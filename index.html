lysis of ultimatum bargaining. Journal of Economic Behavior & Organization, 3(4), 367–388.", "Camerer, C. F. (2003). Behavioral Game Theory: Experiments in Strategic Interaction. Princeton University Press."], "links": [{"id": "cfa14f41916e3839ba33e811128e2d270", "zh": "囚徒困境", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c8604f41916e383ca93b78103475261d5", "slug": "outcome-bias", "zh": "结果偏误", "en": "Outcome Bias", "icon": null, "one": "用结果好坏来评判决策质量，而忽视当时信息条件下决策过程是否合理。", "status": "complete", "rep": "yes", "repDetail": "效应稳定且被多次扩展：同一决策随结果好坏被显著不同地评价，即使结果被明确标注为随机；在医疗、司法、管理情境中都有对应观察。边界条件也清楚：结果数量增加会削弱效应，说明它不是「无视结果」而是「用单次结果替代过程评价」。需要注意这是评价判断层面的效应，不涉及「人是否真的这样奖惩」的制度层面证据。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["决策", "组织管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["outcome bias", "以结果论英雄", "结果偏差", "结果导向评价"], "claims": [{"kind": "boundary", "body": "经典演示：同一份决策描述，只改变结果好坏，被试对决策者「决策质量」与「能力」的评价显著随结果改变——即使明确告知结果由随机因素决定。也就是说，评价标准被不可控变量污染了。", "basis": "literature", "src": "Baron, J. & Hershey, J. C. (1988). Outcome bias in decision evaluation. Journal of Personality and Social Psychology, 54(4), 569–579."}, {"kind": "boundary", "body": "必须与后见之明偏差分开。后见之明是「我早就知道会这样」——对概率判断与记忆的扭曲；结果偏误是「结果好所以决策好」——对评价标准的扭曲。两者常同时出现，但可以独立操纵，机制不同。", "basis": "literature", "src": "Baron & Hershey (1988)；Fischhoff, B. (1975). Hindsight ≠ foresight. Journal of Experimental Psychology: Human Perception and Performance, 1(3), 288–299."}, {"kind": "boundary", "body": "规范标准是决策论的基本要求：决策质量按「当时可得信息 + 决策规则」评价，不按实现的结果。期望效用最大化不等于结果最优——好决策可以坏结果，坏决策也可以好结果，这是概率论的直接推论。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "但完全忽略结果也错。结果是关于决策质量的证据，问题在于「结果是否提供了新信息」：若结果揭示了当时不可能知道的结构性信息，据此更新是贝叶斯理性的；若结果只是噪声的一次实现，据此改评价就是偏误。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "效应随结果数量变化。单一结果下最强；给出多次结果的分布时明显减弱——因为分布让「运气」这一项可见。这也提示去偏手段：把评价从「这一次」移到「这一类决策的长期分布」。", "basis": "literature", "src": "Baron & Hershey (1988)；Hershey, J. C. & Baron, J. (1992). Judgment by outcomes: When is it justified? Organizational Behavior and Human Decision Processes, 53(1), 89–93."}, {"kind": "boundary", "body": "它出现在高代价的真实场景：医疗并发症后的追责、投资业绩归因、司法中的结果责任、事故调查。这些场景里「结果不好」往往直接触发对过程的否定，而过程可能完全合规。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用结果偏误为坏决策开脱。「当时信息不足」是真辩护；「结果不好不代表决策不好」在信息已充分时是伪辩护。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「以结果论英雄」一律否定。若结果是该决策的可重复后果，它是有效反馈；被否定的应是「以单次结果论单次决策」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "与后见之明偏差混用。两者机制不同，去偏手段也不同：前者靠预设判据，后者靠记录事前判断。", "basis": "definition", "src": ""}], "bibs": ["Baron, J. & Hershey, J. C. (1988). Outcome bias in decision evaluation. Journal of Personality and Social Psychology, 54(4), 569–579.", "Hershey, J. C. & Baron, J. (1992). Judgment by outcomes: When is it justified? Organizational Behavior and Human Decision Processes, 53(1), 89–93.", "Fischhoff, B. (1975). Hindsight ≠ foresight: The effect of outcome knowledge on judgment under uncertainty. Journal of Experimental Psychology: Human Perception and Performance, 1(3), 288–299."], "links": []}, {"id": "c8784f41916e3830e9aac0134776302fc", "slug": "groupthink", "zh": "群体思维", "en": "Groupthink", "icon": null, "one": "为了维持团体一致与和谐而压制异议与批判，导致信息筛选、风险低估与决策质量下降的群体决策模式。", "status": "complete", "rep": "partial", "repDetail": "要分开说：①症状层（自我审查、异议压力、无懈可击错觉）在真实案例中可被编码到，Challenger 的分析是代表；②核心因果链不成立——凝聚力在实验室与盲评重分析中都不预测差决策，元分析相关 +0.08 方向相反；③案例基础有选择偏差（只取失败案例），无法估计基线；④但「压制异议损害决策」这一更一般的机制被独立实验支持，且去偏干预有效。所以判 partial：现象清单有用，因果模型未被支持。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "管理学", "决策科学"], "context": ["组织管理", "决策", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["groupthink", "一致同意症", "团体迷思", "小集团意识", "群体盲思"], "claims": [{"kind": "boundary", "body": "Janis 的模型是一条因果链：高凝聚力 + 结构缺陷 + 高压情境 → 寻求一致 → 八种症状（自我审查、异议压力、集体合理化、无懈可击错觉、心灵守卫等）→ 决策缺陷。链条每一环都要单独检验，而实证最不支持的是第一环——凝聚力。", "basis": "literature", "src": "Janis, I. L. (1982). Groupthink: Psychological Studies of Policy Decisions and Fiascoes (2nd rev. ed.). Houghton-Mifflin."}, {"kind": "boundary", "body": "实验室证据与预测相反。44 个四人组的研究：指导型领导（早早表态）降低了方案数量与事实使用，而凝聚力（朋友 vs 陌生人）没有差异；元分析汇总 15 项研究、1200 多个组，凝聚力与决策质量的相关是 +0.08——方向与「凝聚力有害」相反。", "basis": "literature", "src": "Flowers, M. L. (1977). A laboratory test of some implications of Janis's groupthink hypothesis. Journal of Personality and Social Psychology, 35(12), 888–896；Mullen, B., Anthony, T., Salas, E. & Driskell, J. E. (1994). Group cohesiveness and quality of decision making. Small Group Research, 25(2), 189–204."}, {"kind": "boundary", "body": "对 Janis 自己案例的盲评重分析也削弱了核心变量：让不知道预测的评分者用标准化工具描述决策过程，结构缺陷（尤其领导风格与程序草率）与差结果相关，凝聚力不相关。Janis 的症状描述可能对，但引擎装错了。", "basis": "literature", "src": "Tetlock, P. E., Peterson, R. S., McGuire, C., Chang, S. & Feld, P. (1992). Assessing political group dynamics: A test of the groupthink model. Journal of Personality and Social Psychology, 63(3), 403–425."}, {"kind": "boundary", "body": "案例方法有致命的选择偏差：Janis 只挑失败决策来做分析（在因变量上选样），因此无法估计「有同样前因但结果良好」的组有多少。没有分母，因果推论不成立。", "basis": "literature", "src": "Fuller, S. R. & Aldag, R. J. (1998). Organizational tonypandy: Lessons from a quarter century of the groupthink phenomenon. Organizational Behavior and Human Decision Processes, 73(2–3), 163–184."}, {"kind": "boundary", "body": "但「异议被压制会降低决策质量」这一机制有独立支持，且可干预。正式指派魔鬼代言人能提升决策质量——即使其论证很弱，因为异议本身给其他人发了言许可；真实的少数派异议效果更强。Janis 自己提的程序性补救（领导者先不表态、引入外部专家、二次机会会议）在实践中被证明有用。", "basis": "literature", "src": "Nemeth, C. & Rogers, J. (1996). Dissent and the search for information. British Journal of Social Psychology, 35(1), 67–76；Janis (1982)"}, {"kind": "boundary", "body": "正确用法是把它当流程检查清单，不是因果模型。可操作的条目是：有没有人被指定挑错、领导者有没有先表态、有没有外部视角、有没有第二次会议、有没有记录反对意见。这些都不依赖「凝聚力」这个未被支持的变量。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用群体思维解释任何集体失误。它需要具体症状（自我审查、异议压力、心灵守卫），不是「这个决定错了」的同义词。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「大家意见一致」当成群体思维。一致可能是因为证据确实压倒性；判定要看异议是否被允许表达，而不是结果是否一致。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "认为团队凝聚力强就有风险。这一条恰恰是实证最不支持的，凝聚力与决策质量的相关略为正。", "basis": "literature", "src": "Mullen et al. (1994)"}], "bibs": ["Janis, I. L. (1982). Groupthink: Psychological Studies of Policy Decisions and Fiascoes (2nd rev. ed.). Houghton-Mifflin.", "Flowers, M. L. (1977). A laboratory test of some implications of Janis's groupthink hypothesis. Journal of Personality and Social Psychology, 35(12), 888–896.", "Esser, J. K. & Lindoerfer, J. S. (1989). Groupthink and the space shuttle Challenger accident. Journal of Behavioral Decision Making, 2(3), 167–177.", "Tetlock, P. E., Peterson, R. S., McGuire, C., Chang, S. & Feld, P. (1992). Assessing political group dynamics. Journal of Personality and Social Psychology, 63(3), 403–425.", "Mullen, B., Anthony, T., Salas, E. & Driskell, J. E. (1994). Group cohesiveness and quality of decision making. Small Group Research, 25(2), 189–204.", "Fuller, S. R. & Aldag, R. J. (1998). Organizational tonypandy. Organizational Behavior and Human Decision Processes, 73(2–3), 163–184.", "Nemeth, C. & Rogers, J. (1996). Dissent and the search for information. British Journal of Social Psychology, 35(1), 67–76."], "links": [{"id": "c24a4f41916e3832897e08160a0583c32", "zh": "可获性层叠", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cd7e4f41916e382f8aff88152813cbddf", "slug": "self-serving-bias", "zh": "自利偏差", "en": "Self-Serving Bias", "icon": null, "one": "倾向把成功归因于自身能力/努力，把失败归因于外部环境或运气，以维护自我形象。", "status": "complete", "rep": "yes", "repDetail": "证据规模与一致性都很好：266 项研究、503 个效应量的元分析给出 d=0.96，几乎全部样本方向一致；运动领域的独立元分析（69 项研究、10515 名运动员）给出 d≈0.62–0.63。但三个限定条件必须一起说：①文化调节极强（亚洲 d=0.30）；②临床样本显著缩小（抑郁 0.21）；③机制解释未定（动机 vs 期望一致性），且测量多依赖自报，存在印象管理混杂。所以「现象复现良好」成立，「因为它维护自尊」不成立为已证结论。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["组织管理", "沟通与说服", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["self-serving bias", "自利归因偏差", "自我服务偏差", "自我服务归因"], "claims": [{"kind": "boundary", "body": "它是本批效应量最大的之一：元分析汇总 266 项研究、503 个独立效应量，平均 d=0.96；几乎在所有样本中都存在。但这个「大」是平均，内部差异极大。", "basis": "literature", "src": "Mezulis, A. H., Abramson, L. Y., Hyde, J. S. & Hankin, B. L. (2004). Is there a universal positivity bias in attributions? Psychological Bulletin, 130(5), 711–747."}, {"kind": "boundary", "body": "文化调节强到改变结论。亚洲样本 d=0.30，美国样本 d=1.05，其他西方样本 d=0.70。所以它更像「独立自我文化下的默认归因倾向」，而非普遍人性常量。", "basis": "literature", "src": "Mezulis et al. (2004)"}, {"kind": "boundary", "body": "临床样本反向缩小：抑郁 d=0.21、焦虑 0.46、ADHD 0.55。这与「抑郁现实主义」的经典观察一致——并不是抑郁者更准确，而是他们的自我增强消失了。", "basis": "literature", "src": "Mezulis et al. (2004)；Alloy, L. B. & Abramson, L. Y. (1979). Judgment of contingency in depressed and nondepressed students. Journal of Experimental Psychology: General, 108(4), 441–485."}, {"kind": "boundary", "body": "两个子命题的证据强弱不同：自我增强（揽功）证据较强，自我防御（推责）证据较弱且不一致。这意味着「维护自尊」这一动机解释不是必需的——期望一致性（我预期会成功，所以把成功归因于自己）就能生成同样模式。", "basis": "literature", "src": "Miller, D. T. & Ross, M. (1975). Self-serving biases in the attribution of causality. Psychological Bulletin, 82(2), 213–225."}, {"kind": "boundary", "body": "测量方式决定它是不是「信念」。多数证据是自报归因或公开陈述，可能反映「社会上得体的说法」而非私下判断；有观察者时，揽功推责恰是符合印象管理的选择。这一点从未被彻底排除。", "basis": "literature", "src": "Bradley, G. W. (1978). Self-serving biases in the attribution process: A reexamination of the fact or fiction question. Journal of Personality and Social Psychology, 36(1), 56–71."}, {"kind": "boundary", "body": "它并非处处出现。91 名心理治疗师评估提前脱落的来访者时，整体未发现自利偏差，只在「认知闭合需求」较高者身上出现。说明专业训练与情境约束可以压制它，它不是无法避免的。", "basis": "literature", "src": "Dandachi-FitzGerald, B. et al. (2021). Self-serving bias in psychological assessment. 见 Simply Psychology 对该研究的综述。"}, {"kind": "misuse", "body": "把任何「归因于外部」都判为自利偏差。外因可能真的存在；判定需要比较同一人对成功与失败的归因差异，而不是单看一次归因。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它当稳定人格特质去评价某人。它是群体层面的平均倾向，个体差异大且受情境调节。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略文化维度直接套用。亚洲样本的效应量只有美国的三分之一不到。", "basis": "literature", "src": "Mezulis et al. (2004)"}], "bibs": ["Miller, D. T. & Ross, M. (1975). Self-serving biases in the attribution of causality. Psychological Bulletin, 82(2), 213–225.", "Bradley, G. W. (1978). Self-serving biases in the attribution process. Journal of Personality and Social Psychology, 36(1), 56–71.", "Alloy, L. B. & Abramson, L. Y. (1979). Judgment of contingency in depressed and nondepressed students. Journal of Experimental Psychology: General, 108(4), 441–485.", "Mezulis, A. H., Abramson, L. Y., Hyde, J. S. & Hankin, B. L. (2004). Is there a universal positivity bias in attributions? Psychological Bulletin, 130(5), 711–747.", "Allen, M. S. et al. (2020). Self-serving attribution bias in sport: A meta-analysis. Journal of Sports Sciences.", "Dandachi-FitzGerald, B. et al. (2021). Self-serving bias in psychological assessment."], "links": []}, {"id": "ca7f4f41916e382498eb1016fa5f03770", "slug": "planning-fallacy", "zh": "规划谬误", "en": "Planning Fallacy", "icon": null, "one": "系统性低估任务耗时、成本与风险，高估收益与进度，常导致延期与超支。", "status": "complete", "rep": "yes", "repDetail": "学生任务预测与大型基建成本两条独立证据线方向一致；干预实验显示程序中加入「连接过去经验」即可消除偏差。大型项目的量级中混有战略误述成分，不能全部归为认知偏差。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学", "管理学"], "context": ["决策", "组织管理", "产品/增长"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["planning fallacy", "工期乐观偏差", "计划谬误"], "claims": [{"kind": "boundary", "body": "连「最坏情况」都不够坏：学生预测完成论文平均 33.9 天，实际 55.5 天；仅 29.7% 在自报日期前完成；被要求给出「一切都出错时」的日期，平均 48.6 天，仍只有 48.7% 在那之前完成。", "basis": "literature", "src": "Buehler, R., Griffin, D. & Ross, M. (1994). Exploring the planning fallacy. JPSP, 67(3), 366–381"}, {"kind": "boundary", "body": "不是普遍乐观：让被试预测「别人」的完成时间时，他们不乐观，反而高估。说明机制是内视角（只从本案步骤推演），不是笼统的乐观人格。", "basis": "literature", "src": "Buehler, Griffin & Ross (1994)"}, {"kind": "boundary", "body": "知道偏误不能修正，程序才能：当被要求把过去同类任务的实际耗时与当前预测显式连接后，乐观偏差消失。这是程序性干预，不是记住一个事实。", "basis": "literature", "src": "Buehler, Griffin & Ross (1994) 思维出声与干预实验"}, {"kind": "boundary", "body": "大型项目里混有战略误述：258 个交通基建项目 86% 成本被低估、平均低估 28%，且七十年间无改善——这个量级被原作者归因于「错误还是谎言」中的后者。诚实的乐观偏差与故意的低报是两回事。", "basis": "literature", "src": "Flyvbjerg, B., Holm, M. S. & Buhl, S. (2002). Underestimating costs in public works projects: Error or lie? JAPA, 68(3), 279–295；Ika et al. (2022) 区分 intentional/unintentional"}, {"kind": "boundary", "body": "参照类预测（RCF）是证据最好的补救，但有两个硬条件：参照类必须选对（类别选错会得到一个自信但错误的数字），且必须在形成估计之前查（事后查会被已有估计锚定而失效）。", "basis": "literature", "src": "Flyvbjerg, B. (2009) 参照类预测方法；Lovallo, D. & Kahneman, D. (2003) 内视角/外视角"}, {"kind": "boundary", "body": "与拖延不同：拖延是不去做，规划谬误是估错耗时。两者互相强化——若相信「只要两小时」，前一晚开工看起来完全合理。", "basis": "literature", "src": "Buehler, Griffin & Peetz (2010). The planning fallacy: Cognitive, motivational, and social origins. Advances in Experimental Social Psychology, 43, 1–62"}, {"kind": "misuse", "body": "用「这次不一样」解释上一次的延期。判据是能否指出可验证的结构差异（团队规模、依赖方、技术栈），而不是「细节更清楚」的感觉。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它与乐观偏差当同义词。乐观偏差是对风险与收益的整体倾向；规划谬误特指对耗时与成本的预测误差。", "basis": "definition", "src": ""}], "bibs": ["Kahneman, D. & Tversky, A. (1979). Intuitive prediction: Biases and corrective procedures. TIMS Studies in Management Science, 12, 313–327.", "Buehler, R., Griffin, D. & Ross, M. (1994). JPSP, 67(3), 366–381.", "Flyvbjerg, B., Holm, M. S. & Buhl, S. (2002). JAPA, 68(3), 279–295.", "Lovallo, D. & Kahneman, D. (2003). Delusions of success. Harvard Business Review, 81(7), 56–63."], "links": []}, {"id": "c6634f41916e383ce856781014719aa60", "slug": "cognitive-dissonance", "zh": "认知失调", "en": "Cognitive Dissonance", "icon": null, "one": "当信念、态度与行为之间不一致时会产生心理不适，人们倾向通过改变态度、合理化或选择性信息来降低这种不适。", "status": "complete", "rep": "partial", "repDetail": "分范式给结论。诱导服从：2024 年 39 实验室预注册复现中，选择条件效应为零（d=−0.03），而「写反向文章」本身有效应（d=0.26）——即态度改变可能来自自我说服而非失调削减；核心命题（选择是必要条件）未获支持，辩护方对操纵强度的质疑仍未解决。自由选择：Chen & Risen 的混杂被剥离后仍有小效应，但原始效应量被高估。另有稳定边界：文化调节极强。故判 partial：现象部分留存，机制（失调驱动）未被确证。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "决策科学"], "context": ["决策", "批判性思维", "沟通与说服"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["cognitive dissonance", "失调削减", "认知不协调", "认知失调理论"], "claims": [{"kind": "boundary", "body": "两个旗舰范式要分开看。诱导服从（induced compliance）：让人写违反自己立场的文章，报酬越低态度改变越大（「一元胜过二十元」）。自由选择（free choice）：在两个接近的选项中选一个后，所选对象的评价上升、被拒的下降（spreading of alternatives）。两者的证据状况在 2024 年后分道扬镳。", "basis": "literature", "src": "Festinger, L. & Carlsmith, J. M. (1959). Cognitive consequences of forced compliance. Journal of Abnormal and Social Psychology, 58(2), 203–210；Brehm, J. W. (1956). Postdecision changes in the desirability of alternatives. Journal of Abnormal and Social Psychology, 52(3), 384–389."}, {"kind": "boundary", "body": "2024 年的大规模预注册复现是这一领域的分水岭：39 个实验室、19 个国家、14 种语言、招募 4898 人、3822 人进入分析。高选择 vs 低选择的对比 d=−0.03（95% CI −0.10 到 0.04），等于零；而「写反向文章 vs 写中性文章」d=0.26（0.18–0.34）显著。也就是说：写文章确实改变态度，但不依赖「你觉得自己有选择」。", "basis": "literature", "src": "Vaidis, D. C. et al. (2024). A multilab replication of the induced-compliance paradigm of cognitive dissonance. Advances in Methods and Practices in Psychological Science, 7(1)."}, {"kind": "boundary", "body": "原文献的功效严重不足，这是复现失败的背景原因。审计 104 项诱导服从未预注册研究：每条件平均 16.66 人（中位 13.5，最少 4.25），只有 2 项共享数据；在 d=0.43 时需每条件 86 人才能达到 80% 功效。原始效应量 d=2.40 建立在约 10 人/格之上。", "basis": "literature", "src": "Sleegers, W. W. A. et al. (2024). Auditing the evidence for the induced-compliance paradigm. Advances in Methods and Practices in Psychological Science."}, {"kind": "boundary", "body": "辩护方的反驳有实质内容：「低选择」组自评感知自由为 4.44，落在量表中点，属「中等选择」而非「无选择」；若操纵未真正制造低自由，则零结果说明的是程序而非理论。另有以自报选择项替代操纵的重分析得到条件×感知自由交互。争议未结，但「选择是必要条件」这一核心命题在现有检验下未获支持。", "basis": "literature", "src": "Lishner, D. A. (2024). But did they really perceive no (low) choice? Comment on Vaidis et al. (2024). Advances in Methods and Practices in Psychological Science；Pauer, S., Linne, R. & Erb, H.-P. (2024). Commentary on Vaidis et al."}, {"kind": "boundary", "body": "自由选择范式有独立的方法学硬伤：若首次评分含噪声，选择本身就揭示了偏好，那么第二次评分的「变化」可能只是信息揭示与回归，而非态度改变（Chen & Risen 2010）。剥离这条通路的设计（如让被试在看不到选项的情况下选择）仍能检出 spread，但幅度更小。", "basis": "literature", "src": "Chen, M. K. & Risen, J. L. (2010). How choice affects and reflects preferences: Revisiting the free-choice paradigm. Journal of Personality and Social Psychology, 99(4), 573–594."}, {"kind": "boundary", "body": "触发条件是文化塑造的，不是普遍常量。日本被试在自由选择范式中几乎不出现 spread（加拿大人稳定出现）；但若微妙提示「你正在被观察」，日本被试同样会合理化选择。所以变的不是「有没有失调」，而是「什么样的自我形象值得维护」。", "basis": "literature", "src": "Heine, S. J. & Lehman, D. R. (1997). Culture, dissonance, and self-affirmation. Personality and Social Psychology Bulletin, 23(4), 389–400；Kitayama, S., Snibbe, A. C., Markus, H. R. & Suzuki, T. (2004). Is there any 'free' choice? Psychological Science, 15(8), 527–533."}, {"kind": "misuse", "body": "用「认知失调」解释任何言行不一致。失调要求有可测的不适与削减行为；同名不同事的情况（如虚伪、策略性撒谎）不需要失调。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「奖励越少说服力越强」当普适定律。该交互在 2024 年的大规模复现中未被检验，而它所依附的选择条件已被削弱；原始研究每组约十余人。", "basis": "literature", "src": "Vaidis et al. (2024)；Sleegers et al. (2024)"}, {"kind": "misuse", "body": "继续用「一元/二十元」故事当教科书定论。它是最著名的演示，但也是最缺乏统计功效的那一类证据。", "basis": "definition", "src": ""}], "bibs": ["Festinger, L. (1957). A Theory of Cognitive Dissonance. Stanford University Press.", "Festinger, L. & Carlsmith, J. M. (1959). Cognitive consequences of forced compliance. Journal of Abnormal and Social Psychology, 58(2), 203–210.", "Brehm, J. W. (1956). Postdecision changes in the desirability of alternatives. Journal of Abnormal and Social Psychology, 52(3), 384–389.", "Chen, M. K. & Risen, J. L. (2010). How choice affects and reflects preferences. Journal of Personality and Social Psychology, 99(4), 573–594.", "Heine, S. J. & Lehman, D. R. (1997). Culture, dissonance, and self-affirmation. Personality and Social Psychology Bulletin, 23(4), 389–400.", "Kitayama, S., Snibbe, A. C., Markus, H. R. & Suzuki, T. (2004). Is there any 'free' choice? Psychological Science, 15(8), 527–533.", "Vaidis, D. C. et al. (2024). A multilab replication of the induced-compliance paradigm of cognitive dissonance. Advances in Methods and Practices in Psychological Science, 7(1).", "Sleegers, W. W. A. et al. (2024). Auditing the evidence for the induced-compliance paradigm. Advances in Methods and Practices in Psychological Science."], "links": []}, {"id": "c6d14f41916e383c4bc760125add31026", "slug": "decoy-effect", "zh": "诱饵效应", "en": "Decoy Effect", "icon": null, "one": "加入一个被支配的第三选项（诱饵）会系统性改变人们在原本两选项间的偏好。", "status": "complete", "rep": "partial", "repDetail": "分两层：①原始条件下（两三个数值属性、假设性选择、被试对两个真选项接近无差异）效应可重复，元分析均值约 14.7% 份额增益；②扩展到真实产品、有体验、或属性以知觉呈现时，效应大幅缩小甚至消失——91 次尝试只有 11 次可靠，这一规模的结果不能忽视。作者与批评者在同一期刊的正面对话把共识定在「真实但脆弱、条件苛刻」。所以判 partial：现象存在，实用性与外推性远低于流行叙事。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "经济学", "决策科学"], "context": ["决策", "沟通与说服", "产品/增长"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["asymmetric dominance", "attraction effect", "不对称支配效应", "吸引效应", "诱饵选项"], "claims": [{"kind": "boundary", "body": "它的理论意义在于违反「regularity」：往选择集中加入一个新选项，不应提高任何已有选项的被选概率。诱饵（被目标支配、但不被对手支配）恰恰提高了目标的份额——这是标准随机效用模型无法生成的现象，所以 1982 年那个结果才重要。", "basis": "literature", "src": "Huber, J., Payne, J. W. & Puto, C. (1982). Adding asymmetrically dominated alternatives: Violations of regularity and the similarity hypothesis. Journal of Consumer Research, 9(1), 90–98."}, {"kind": "boundary", "body": "原始效应幅度不大：加入诱饵使目标份额提高约 9 个百分点。元分析汇总文献平均约 14.7%，且目标在原条件下的份额越高，增益越小——效应不是均匀的。", "basis": "literature", "src": "Huber, Payne & Puto (1982)；Yang, S. (2013). The attraction effect: An overview, its fragility, and a meta-analysis. Cornell University."}, {"kind": "boundary", "body": "大规模检验的结果很不利。91 次尝试、23 个产品类别、73 个含诱饵的选择集，只有 11 次得到可靠效应，远低于该研究的统计功效预期；当选项用有意义的文字或图片描述（而非纯数字）时，效应降到随机水平。", "basis": "literature", "src": "Yang, S. & Lynn, M. (2014). More evidence challenging the robustness and usefulness of the attraction effect. Journal of Marketing Research, 51(4), 508–513."}, {"kind": "boundary", "body": "效应主要局限于「纯数字、风格化」的刺激。一旦消费者能看见或体验真实产品，或某一属性以知觉形式（照片）呈现，效应通常不出现；在某些条件下甚至反向（repulsion）——诱饵把选择推离目标。", "basis": "literature", "src": "Frederick, S., Lee, L. & Baskin, E. (2014). The limits of attraction. Journal of Marketing Research, 51(4), 487–507."}, {"kind": "boundary", "body": "原作者的反驳有分量但有限度：他们承认边界条件真实存在，坚持在原始实验条件下效应稳健，并把 1982 年的贡献定位为「检验理性选择公理」，而非「可复制的营销杠杆」。这个定位比通俗版诚实得多。", "basis": "literature", "src": "Huber, J., Payne, J. W. & Puto, C. (2014). Let's be honest about the attraction effect. Journal of Marketing Research, 51(4), 520–525."}, {"kind": "boundary", "body": "最流行的案例不能当证据。《经济学人》订阅页那个「印刷版与印刷+网络同价」的例子来自 Ariely 的课堂演示（100 名 MIT 学生、假设性选择），杂志从未公布该报价的真实销售数据。它是教学插图，不是实证。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把诱饵当可靠的定价杠杆。真实页面用文字与图片描述商品，恰好是效应最容易消失的条件。", "basis": "literature", "src": "Yang & Lynn (2014)；Frederick, Lee & Baskin (2014)"}, {"kind": "misuse", "body": "引用 84% vs 32% 的《经济学人》数字当实证。那是假设性课堂实验，无真实销售数据。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「三选一里挑中间那个」都叫诱饵效应。诱饵必须是严格被支配的、且不被对手支配；否则只是折中效应（compromise effect），机制不同。", "basis": "literature", "src": "Simonson, I. (1989). Choice based on reasons: The case of attraction and compromise effects. Journal of Consumer Research, 16(2), 158–174."}], "bibs": ["Huber, J., Payne, J. W. & Puto, C. (1982). Adding asymmetrically dominated alternatives. Journal of Consumer Research, 9(1), 90–98.", "Simonson, I. (1989). Choice based on reasons: The case of attraction and compromise effects. Journal of Consumer Research, 16(2), 158–174.", "Simonson, I. & Tversky, A. (1992). Choice in context: Tradeoff contrast and extremeness aversion. Journal of Marketing Research, 29(3), 281–295.", "Yang, S. (2013). The attraction effect: An overview, its fragility, and a meta-analysis. Cornell University.", "Yang, S. & Lynn, M. (2014). More evidence challenging the robustness and usefulness of the attraction effect. Journal of Marketing Research, 51(4), 508–513.", "Frederick, S., Lee, L. & Baskin, E. (2014). The limits of attraction. Journal of Marketing Research, 51(4), 487–507.", "Huber, J., Payne, J. W. & Puto, C. (2014). Let's be honest about the attraction effect. Journal of Marketing Research, 51(4), 520–525."], "links": []}, {"id": "cf684f41916e383af8844813d5b70071c", "slug": "hyperbolic-discounting", "zh": "贴现/超曲线贴现", "en": "Hyperbolic Discounting", "icon": null, "one": "对近未来的奖励给予不成比例的更高权重（相对远期），表现为时间不一致与偏好反转。", "status": "complete", "rep": "partial", "repDetail": "现象层稳固：短延迟隐含贴现率远高于长延迟、偏好反转可被稳定诱发，这在数十项研究、跨物种中反复出现（Frederick et al. 2002 汇总 42 项研究，贴现率离散度极大但方向一致）。争议在解释层：「双曲」是否是正确函数形式尚无定论，次可加贴现可以复现同样的数据；符号效应与量级效应也说明单一贴现率曲线不足以描述。所以判 partial：时间不一致存在，双曲形式只是候选解释之一。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["经济学", "心理学", "决策科学"], "context": ["决策", "产品/增长", "风险管理"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["hyperbolic discounting", "present bias", "准双曲贴现", "双曲贴现", "时间不一致", "现时偏差", "超曲线贴现"], "claims": [{"kind": "boundary", "body": "关键不是「贴现率高低」，而是「贴现率随延迟下降」。指数贴现下贴现率恒定，选择不受时间流逝影响；双曲贴现下近期贴现率极高、远期很低，于是同一对选项在远近不同时会反转——这才是可检验的核心。", "basis": "literature", "src": "Ainslie, G. (1975). Specious reward: A behavioral theory of impulsiveness and impulse control. Psychological Bulletin, 82(4), 463–496；Frederick, S., Loewenstein, G. & O'Donoghue, T. (2002). Time discounting and time preference: A critical review. Journal of Economic Literature, 40(2), 351–401."}, {"kind": "boundary", "body": "隐含年化贴现率在短延迟时高得离谱：现在拿 15 美元与一月后 20 美元（约 345%/年）、三月后 30 美元（约 277%）、一年后 50 美元（约 120%）、十年后 100 美元（约 19%）。一年以上的平均贴现率大致稳定在 25% 附近。", "basis": "literature", "src": "Frederick, Loewenstein & O'Donoghue (2002)；引用数值亦见 Federal Reserve FEDS 2010-25 对该综述的复述"}, {"kind": "boundary", "body": "「贴现率随延迟下降」有竞争解释：次可加贴现（subadditive discounting）——把同一段延迟切成更细的区间，总贴现更大。按此解释，所谓双曲只是「区间划分方式」的产物，不是时间偏好的形状。", "basis": "literature", "src": "Read, D. (2001). Is time-discounting hyperbolic or subadditive? Journal of Risk and Uncertainty, 23(1), 5–32."}, {"kind": "boundary", "body": "两个稳定的方向性效应与双曲叠加：符号效应（损失比等额收益贴现更少）、量级效应（大金额贴现率更低）。任何只拟合「贴现率曲线」的模型都会漏掉这两条。", "basis": "literature", "src": "Frederick, Loewenstein & O'Donoghue (2002)；Thaler, R. (1981). Some empirical evidence on dynamic inconsistency. Economics Letters, 8(3), 201–207."}, {"kind": "boundary", "body": "政策上真正有用的是准双曲（β-δ）形式：今天与明天之间额外打一个 β 折，之后按 δ 恒定。它把「时间不一致」压缩成一个参数，直接推出承诺装置的需求——这是它比纯双曲更常被使用的原因。", "basis": "literature", "src": "Laibson, D. (1997). Golden eggs and hyperbolic discounting. Quarterly Journal of Economics, 112(2), 443–477；O'Donoghue, T. & Rabin, M. (1999). Doing it now or later. American Economic Review, 89(1), 103–124."}, {"kind": "boundary", "body": "最著名的「自控预测人生」证据已大幅缩水。马尔什梅洛实验 2018 年用 918 名儿童做概念复现：等待时间与 15 岁学业成绩的相关只有原研究的一半，加入家庭背景、早期认知与家庭环境控制后缩减约三分之二；2024 年追到 26 岁，回归调整后的系数基本不显著。", "basis": "literature", "src": "Watts, T. W., Duncan, G. J. & Quan, H. (2018). Revisiting the marshmallow test: A conceptual replication. Psychological Science, 29(7), 1159–1177；Sperber, J. F., Vandell, D. L., Duncan, G. J. & Watts, T. W. (2024). Delay of gratification and adult outcomes. Child Development."}, {"kind": "misuse", "body": "用「贴现率高」当结论。高贴现率可以是理性结果（未来不确定、死亡率、市场利率），时间不一致才构成需要干预的问题。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把偏好反转当人格缺陷。反转是结构性的：任何双曲型偏好者在特定时间距离下都会反转，与意志力强弱无关。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "拿马尔什梅洛原版的相关（r≈.57）当自控决定人生的证据。该样本仅 37 人且来自斯坦福社区，复现后效应大幅缩水。", "basis": "literature", "src": "Watts et al. (2018)；Sperber et al. (2024)"}], "bibs": ["Ainslie, G. (1975). Specious reward: A behavioral theory of impulsiveness and impulse control. Psychological Bulletin, 82(4), 463–496.", "Thaler, R. (1981). Some empirical evidence on dynamic inconsistency. Economics Letters, 8(3), 201–207.", "Laibson, D. (1997). Golden eggs and hyperbolic discounting. Quarterly Journal of Economics, 112(2), 443–477.", "Read, D. (2001). Is time-discounting hyperbolic or subadditive? Journal of Risk and Uncertainty, 23(1), 5–32.", "Frederick, S., Loewenstein, G. & O'Donoghue, T. (2002). Time discounting and time preference: A critical review. Journal of Economic Literature, 40(2), 351–401.", "Watts, T. W., Duncan, G. J. & Quan, H. (2018). Revisiting the marshmallow test: A conceptual replication. Psychological Science, 29(7), 1159–1177.", "Sperber, J. F., Vandell, D. L., Duncan, G. J. & Watts, T. W. (2024). Delay of gratification and adult outcomes: The marshmallow test does not reliably predict adult functioning. Child Development."], "links": []}, {"id": "cf094f41916e3835bb1b7018f1868e3e7", "slug": "gamblers-fallacy", "zh": "赌徒谬误", "en": "Gambler’s Fallacy", "icon": null, "one": "错误地认为随机事件会“自我修正”，例如连续出现某结果后，另一个结果在下一次更可能发生。", "status": "complete", "rep": "yes", "repDetail": "在「独立、概率已知」的定义域内，赌徒谬误是复现最稳的偏差之一：实验室的轮盘、抛币、彩票选号任务反复重现，方向一致。但它的边界同样重要：①镜像现象（热手）在「技能参与、概率未知」时是真的，2018 年的偏差校正把 1985 年的否证结论反转了；②在有偏设备或未知基率下，「该出」的推理未必错。所以判 yes 是就严格定义域而言，不是就「所有连胜判断」而言。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "数学/统计", "决策科学"], "context": ["决策", "风险管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["gambler's fallacy", "成熟度错觉", "蒙特卡洛谬误", "赌博者谬误"], "claims": [{"kind": "boundary", "body": "机制源头是「小数定律」信念：人预期小样本也应反映总体比例，于是连续出现某结果后，认为「该轮到另一个」以恢复平衡。这在独立同分布、概率已知的场景里是明确错误。", "basis": "literature", "src": "Tversky, A. & Kahneman, D. (1971). Belief in the law of small numbers. Psychological Bulletin, 76(2), 105–110."}, {"kind": "boundary", "body": "它的镜像同时存在：同一段连胜，在轮盘上被读作「该出黑了」（赌徒谬误），在球员身上被读作「他手热」（热手信念）。所以判定关键不是「序列是否随机」，而是「这段序列被归因为运气还是技能」。", "basis": "literature", "src": "Gilovich, T., Vallone, R. & Tversky, A. (1985). The hot hand in basketball. Cognitive Psychology, 17(3), 295–314."}, {"kind": "boundary", "body": "热手的「翻案」必须写清，否则会把一个错误统计当结论。1985 年研究比较「三连中之后」与「三连失之后」的命中率，发现只差约 3 个百分点、不显著，遂判定热手是错觉。Miller & Sanjurjo (2018) 证明该估计量有连串选择偏差：有限序列中，只统计连串之后的命中率会系统性偏低——公平硬币 100 次、三连正之后的命中率期望约 46%，偏差约 −8 个百分点。", "basis": "literature", "src": "Miller, J. B. & Sanjurjo, A. (2018). Surprised by the hot hand fallacy? A truth in the law of small numbers. Econometrica, 86(6), 2019–2047."}, {"kind": "boundary", "body": "校正后结论反转：同一批 1985 年数据，偏差校正后的热手效应约 +12 至 +13 个百分点（p<.01），25 名球员中 19 名方向为正；NBA 三分大赛 28 年数据约 +8 个百分点。控制投篮难度后（光学追踪，83000 次出手）仍有 1.2–2.4 个百分点的真实效应。", "basis": "literature", "src": "Miller & Sanjurjo (2018)；Bocskocsky, A., Ezekowitz, J. & Stein, C. (2014). The hot hand: A new approach to an old 'fallacy'. MIT Sloan Sports Analytics Conference."}, {"kind": "boundary", "body": "两者不矛盾，因为它们描述不同的信息结构：赌徒谬误发生在「概率已知且独立」时，此时「该出」必然错；热手发生在「概率未知、可能受状态影响」时，此时把连胜当作关于状态的证据是合理的贝叶斯更新。混淆这两者，是这一族概念最常见的错误。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "还有一个反向陷阱：真实的赌徒谬误在实验室极稳（轮盘、彩票「该出的号」、抛硬币），但在有偏设备上「该出」的推理可能正确——若某结果的基率本身偏高，认为它更可能出现并不构成谬误。判定必须先确认独立性与已知概率。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把赌徒谬误与热手信念当成同一个错误。两者方向相反，适用条件相反。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用赌徒谬误否定任何「状态」判断。技能参与的场景里，连胜可能真的携带信息（Miller & Sanjurjo 2018）。", "basis": "literature", "src": "Miller & Sanjurjo (2018)"}, {"kind": "misuse", "body": "继续引用「热手已被证明是错觉」。该结论建立在有偏估计量上，2018 年后已反转。", "basis": "literature", "src": "Gilovich, Vallone & Tversky (1985)；Miller & Sanjurjo (2018)"}], "bibs": ["Tversky, A. & Kahneman, D. (1971). Belief in the law of small numbers. Psychological Bulletin, 76(2), 105–110.", "Gilovich, T., Vallone, R. & Tversky, A. (1985). The hot hand in basketball: On the misperception of random sequences. Cognitive Psychology, 17(3), 295–314.", "Bocskocsky, A., Ezekowitz, J. & Stein, C. (2014). The hot hand: A new approach to an old 'fallacy'. MIT Sloan Sports Analytics Conference.", "Miller, J. B. & Sanjurjo, A. (2018). Surprised by the hot hand fallacy? A truth in the law of small numbers. Econometrica, 86(6), 2019–2047.", "Raab, M., Gula, B. & Gigerenzer, G. (2012). The hot hand in volleyball. PLoS ONE, 7(8), e42252."], "links": []}, {"id": "c1fb4f41916e38364b08581e77bb39d61", "slug": "path-dependence", "zh": "路径依赖", "en": "Path Dependence", "icon": null, "one": "早期偶然选择或小优势会通过正反馈锁定后续演化路径，使得历史过程影响最终结果而非仅由当下最优决定。", "status": "complete", "rep": "partial", "repDetail": "分层结论：模型层成立且被反复确认——报酬递增可产生多重均衡与锁定（Arthur 1989 的数学结论稳健）。经验层则明显弱于通俗叙事：最著名的 QWERTY 案例在原始证据上被推翻（Dvorak 优势不成立、GSA 实验无反证、来源有利益冲突），VHS/Betamax 案例同样被重新解读。真正有稳健实证的是制度路径依赖（法系渊源、殖民制度对长期发展的影响），那里的转换成本来自政治而非技术。故判 partial：机制真、经典案例假。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["经济学", "社会学", "管理学"], "context": ["决策", "产品/增长", "组织管理"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["QWERTY 效应", "path dependence", "历史依赖", "路径依存"], "claims": [{"kind": "boundary", "body": "必须区分弱命题与强命题。弱命题：「初始条件影响后续路径」——这在任何有正反馈的系统里都成立，几乎是平凡的。强命题：「可能锁在已知更劣的路径上且无法自行退出」——这才有政策含义，也才需要证据。多数引用只证明了弱命题，却按强命题使用。", "basis": "literature", "src": "Liebowitz, S. J. & Margolis, S. E. (1995). Path dependence, lock-in, and history. Journal of Law, Economics, & Organization, 11(1), 205–226."}, {"kind": "boundary", "body": "Liebowitz & Margolis 把强命题再分三级：一阶（初始敏感但结果最优）、二阶（事后遗憾，但当时不可知且改的成本高于收益）、三阶（存在可行的更优方案却未被采用，即真正的可补救无效率）。只有三阶有规范含义，而他们主张三阶在实证上极罕见。", "basis": "literature", "src": "Liebowitz & Margolis (1995)"}, {"kind": "boundary", "body": "教科书案例已被削弱。QWERTY 优于 Dvorak 的说法主要来自 Dvorak 本人参与的研究；1950 年代 GSA 的对照实验未发现 Dvorak 有优势；后来的工效学研究结论类似。也就是说「锁在劣等技术上」这一原始证据链本身不成立。", "basis": "literature", "src": "Liebowitz, S. J. & Margolis, S. E. (1990). The fable of the keys. Journal of Law and Economics, 33(1), 1–25."}, {"kind": "boundary", "body": "理论侧仍然成立：Arthur 的报酬递增模型证明，在存在学习效应、网络外部性、规模经济时，多重均衡与锁定是可能的——市场可能收敛到非唯一、且非预先最优的结果。这是模型结论，不是历史结论。", "basis": "literature", "src": "Arthur, W. B. (1989). Competing technologies, increasing returns, and lock-in by historical events. Economic Journal, 99(394), 116–131；David, P. A. (1985). Clio and the economics of QWERTY. American Economic Review, 75(2), 332–337."}, {"kind": "boundary", "body": "真正有强证据的领域是制度与地理：殖民时期的制度选择通过产权、法律传统持续影响长期经济表现（Acemoglu, Johnson & Robinson 2001；La Porta et al. 1998 的法系渊源效应）。这里的锁定来自政治与制度的转换成本，比技术锁定更可测。", "basis": "literature", "src": "Acemoglu, D., Johnson, S. & Robinson, J. A. (2001). The colonial origins of comparative development. American Economic Review, 91(5), 1369–1401；La Porta, R., Lopez-de-Silanes, F., Shleifer, A. & Vishny, R. (1998). Law and finance. Journal of Political Economy, 106(6), 1113–1155."}, {"kind": "boundary", "body": "判定锁定的操作条件：①存在可选方案；②该方案在决策时已被识别；③转换的净收益为正却未发生；④存在阻止转换的机制（协调失败、转换成本、合约）。四条缺一条，就不能说锁定，只能说「历史有影响」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「路径依赖」解释一切「现状不合理」。现状可能是当前最优（二阶），也可能只是没算清转换成本。不做反事实比较就不是路径依赖分析。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "继续拿 QWERTY 当铁证。该案例的实证基础在 1990 年代已被系统质疑，引用时应说明争议或换例。", "basis": "literature", "src": "Liebowitz & Margolis (1990)"}, {"kind": "misuse", "body": "把「事后觉得另一个更好」等同于「当时有更优选择」。三阶路径依赖要求更优方案在决策时可知；事后遗憾只是二阶。", "basis": "definition", "src": ""}], "bibs": ["David, P. A. (1985). Clio and the economics of QWERTY. American Economic Review, 75(2), 332–337.", "Arthur, W. B. (1989). Competing technologies, increasing returns, and lock-in by historical events. Economic Journal, 99(394), 116–131.", "Liebowitz, S. J. & Margolis, S. E. (1990). The fable of the keys. Journal of Law and Economics, 33(1), 1–25.", "Liebowitz, S. J. & Margolis, S. E. (1995). Path dependence, lock-in, and history. Journal of Law, Economics, & Organization, 11(1), 205–226.", "Acemoglu, D., Johnson, S. & Robinson, J. A. (2001). The colonial origins of comparative development. American Economic Review, 91(5), 1369–1401.", "La Porta, R., Lopez-de-Silanes, F., Shleifer, A. & Vishny, R. (1998). Law and finance. Journal of Political Economy, 106(6), 1113–1155."], "links": []}, {"id": "c6094f41916e38204aabd01b9db8c1073", "slug": "kick-the-cat-effect-scapegoating", "zh": "踢猫效应", "en": "Kick-the-cat effect / Scapegoating", "icon": null, "one": "个体把在更强势对象处受挫产生的负面情绪，转移并发泄到更弱势、无力反抗的对象上。", "status": "complete", "rep": "partial", "repDetail": "学术构念（displaced aggression）稳健：82 项实验比较、d=+0.54，触发置换（TDA）可重复。但「踢猫效应」这个通俗名称本身没有对应研究文献，含义靠类比建立；且效应依赖触发与报复成本，不是无条件发生。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "社会学"], "context": ["沟通与说服", "组织管理"], "epistemic": ["现象描述/命名（Phenomenological / Descriptive）"], "aliases": ["Kick-the-cat", "displaced aggression", "置换攻击", "踢狗效应"], "claims": [{"kind": "boundary", "body": "「踢猫效应」不是学术术语，对应的实证构念是 displaced aggression（置换攻击）。82 项实验比较的元分析给出 d=+0.54，且只纳入实验研究，因此支持「受挫→转向替代目标」的因果方向，而不只是相关。", "basis": "literature", "src": "Marcus-Newhall, A., Pedersen, W. C., Carlson, M. & Miller, N. (2000). Displaced aggression is alive and well: A meta-analytic review. Journal of Personality and Social Psychology, 78(4), 670–689."}, {"kind": "boundary", "body": "通常需要一个「触发」：先被激怒的人遭遇第二个小冒犯时才爆发，且触发置换攻击的强度超过两次挑衅的简单相加；没有这个小触发时，通常观察不到置换。这就是 TDA（triggered displaced aggression）模型。", "basis": "literature", "src": "Pedersen, W. C., Gonzales, C. & Miller, N. (2000)；Miller, N., Pedersen, W. C., Earleywine, M. & Pollock, V. E. (2003) 的触发置换攻击模型"}, {"kind": "boundary", "body": "替代目标与原挑衅者的相似度决定强度：越相似，置换攻击越强（刺激泛化原理）。踢「猫」而不是踢完全无关的对象，正因为它离原对象足够近。", "basis": "literature", "src": "Marcus-Newhall et al. (2000) 的调节效应分析（依 Miller 1948 刺激泛化原理）"}, {"kind": "boundary", "body": "初次挑衅的强度与置换攻击量是反向关系（对比效应）：被重挫后转向弱者的攻击，反而不如被轻挫后猛烈。这一点与「越委屈越要撒气」的直觉相反。", "basis": "literature", "src": "Marcus-Newhall et al. (2000)（依 Berkowitz & Knurek 1969 对比效应）"}, {"kind": "boundary", "body": "定义里的「无力反抗」不是修辞，而是机制的一部分：置换的必要条件是对原对象报复成本高（不可得、怕报复、他人在场抑制）。当反击成本下降时，攻击会回到原对象，而不是继续向下转移。", "basis": "literature", "src": "Marcus-Newhall et al. (2000) 对置换发生条件的归类（provocateur 不可得、怕报复、在场者抑制）"}, {"kind": "misuse", "body": "把「上级批评我、我回家发火」一律叫踢猫效应。若当时并未被激怒、对上级也无攻击冲动，只是单纯疲惫或烦躁，那属于情绪耗竭，不属于置换攻击。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它替迁怒找解释，而不是找约束。该构念的预测变量是触发、目标相似度、报复成本，不是「这人脾气差」。", "basis": "definition", "src": ""}], "bibs": ["Marcus-Newhall, A., Pedersen, W. C., Carlson, M. & Miller, N. (2000). Displaced aggression is alive and well: A meta-analytic review. Journal of Personality and Social Psychology, 78(4), 670–689.", "Pedersen, W. C., Gonzales, C. & Miller, N. (2000). The moderating effect of trivial triggering provocation on displaced aggression. Journal of Personality and Social Psychology.", "Miller, N., Pedersen, W. C., Earleywine, M. & Pollock, V. E. (2003). A theoretical model of triggered displaced aggression. Personality and Social Psychology Review."], "links": []}, {"id": "c1a14f41916e38239845881758e7b9a85", "slug": "simpsons-paradox", "zh": "辛普森悖论", "en": "Simpson’s Paradox", "icon": null, "one": "分组数据中各组趋势一致，但合并汇总后趋势反转的现象，通常由混杂变量或分组比例差异导致。", "status": "complete", "rep": "yes", "repDetail": "数学上必然存在（Blyth 1972 给出构造证明），真实数据中有多个可核验案例（伯克利录取 1975、肾结石疗法 1986），并被系统综述记录为在多个子学科反复出现的现象（Kievit et al. 2013）。争议不在现象是否存在，而在「该用合并还是分层估计」这一因果解释问题。", "checked": "2026-11-19", "nature": ["悖论/二律背反"], "domain": ["数学/统计", "决策科学"], "context": ["批判性思维", "学习/研究", "决策"], "epistemic": ["形式/分析（Formal / Analytic）"], "aliases": ["Simpson's paradox", "Yule-Simpson effect", "合并悖论", "尤尔-辛普森效应", "辛普森反转"], "claims": [{"kind": "boundary", "body": "反转的数学条件是：分组变量同时与处理、结果相关，且各组样本量差异大。若分组变量不是混杂，分层估计与合并估计只差在方差，不会系统性反转。", "basis": "literature", "src": "Blyth, C. R. (1972). On Simpson's paradox and the sure-thing principle. Journal of the American Statistical Association, 67(338), 364–366."}, {"kind": "boundary", "body": "合并估计与分层估计回答的是不同的因果问题：前者是总效应，后者是控制该变量后的条件效应。选哪个由因果图与目标人群决定，不能「看哪个方向更合理」来挑——那个挑法等于用结论选方法。", "basis": "literature", "src": "Pearl, J. (2014). Understanding Simpson's paradox. The American Statistician, 68(1), 8–13."}, {"kind": "boundary", "body": "真实案例：1973 年伯克利研究生录取，全校男性录取率 44%、女性 35%，但逐系看多数系对女性略有利——差异来自女性更多申请录取率低的系，而不是录取歧视。", "basis": "literature", "src": "Bickel, P. J., Hammel, E. A. & O'Connell, J. W. (1975). Sex bias in graduate admissions: data from Berkeley. Science, 187(4175), 398–404."}, {"kind": "boundary", "body": "医学实例：肾结石两种疗法，总体看经皮取石 83% 优于开放手术 78%，但按结石大小分层，开放手术在小结石（93% vs 87%）与大胆石（73% vs 69%）两组都更高——因为经皮取石更多用于小结石。", "basis": "literature", "src": "Charig, C. R., Webb, D. R., Payne, S. R. & Wickham, J. E. A. (1986). Comparison of treatment of renal calculi by open surgery, percutaneous nephrolithotomy, and extracorporeal shockwave lithotripsy. British Medical Journal, 292, 879–882."}, {"kind": "boundary", "body": "它不是罕见奇观。系统综述显示它在认知神经科学、行为遗传学、临床与教育研究中反复出现，且最容易发生在跨层级推断时（群体→亚组、亚组→个体）——这一点与「教科书里的构造案例」印象相反。", "basis": "literature", "src": "Kievit, R. A., Frankenhuis, W. E., Waldorp, L. J. & Borsboom, D. (2013). Simpson's paradox in psychological science: a practical guide. Frontiers in Psychology, 4, 513."}, {"kind": "boundary", "body": "它既不等于生态学谬误，也不等于加权差异：前者是跨层级外推的错误，后者只是权重不同。悖论的特异性在于「方向反转」，判断时必须确认反转发生在同一批数据的两种聚合层级上。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「分组与合计不一致」都叫辛普森悖论。只说幅度不同、方向没变，那是加权差异，不是悖论。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它论证「统计可以任意解读、数据不可信」。它暴露的是因果结构未声明，不是数据无意义；正确回应是把分组变量在因果图上的位置讲清楚。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略分组变量可能是中介。若分组变量在 X 与 Y 的因果路径上，合并估计才是总效应，分层反而是把效应拆掉了一部分。", "basis": "definition", "src": ""}], "bibs": ["Blyth, C. R. (1972). On Simpson's paradox and the sure-thing principle. Journal of the American Statistical Association, 67(338), 364–366.", "Bickel, P. J., Hammel, E. A. & O'Connell, J. W. (1975). Sex bias in graduate admissions: data from Berkeley. Science, 187(4175), 398–404.", "Charig, C. R., Webb, D. R., Payne, S. R. & Wickham, J. E. A. (1986). Comparison of treatment of renal calculi by open surgery, percutaneous nephrolithotomy, and extracorporeal shockwave lithotripsy. British Medical Journal, 292, 879–882.", "Kievit, R. A., Frankenhuis, W. E., Waldorp, L. J. & Borsboom, D. (2013). Simpson's paradox in psychological science: a practical guide. Frontiers in Psychology, 4, 513.", "Pearl, J. (2014). Understanding Simpson's paradox. The American Statistician, 68(1), 8–13."], "links": []}, {"id": "c5e84f41916e38264a0d9817ea5aabd6b", "slug": "marginal-utility", "zh": "边际效益", "en": "Marginal Utility", "icon": null, "one": "在其他条件不变时，额外增加一单位资源/消费带来的新增收益（或效用）。", "status": "complete", "rep": "partial", "repDetail": "「一般商品上边际效用递减」成立且稳健（需求曲线向下、风险厌恶、收入边际效用为正但递减）。但两处被高估：一是「效用可测量、可人际比较」的基数假设已被放弃；二是「收入-幸福在 7.5 万美元后不再上升」这一流行版被 2023 年对撞式合作部分推翻——平台只出现在最不幸福的少数人身上。", "checked": "2026-11-19", "nature": ["基础概念/定义", "模型/框架/启发式"], "domain": ["经济学", "决策科学"], "context": ["决策", "产品/增长"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["marginal benefit", "marginal utility", "边际收益", "边际效用", "递减边际效用"], "claims": [{"kind": "boundary", "body": "边际不等于平均：决策看增量，不看均值。边际效用递减说的是「每多一单位带来的增量下降」，不是「总效用在下降」——总效用仍可上升，只是越升越慢。", "basis": "literature", "src": "Marshall, A. (1890). Principles of Economics. Macmillan."}, {"kind": "boundary", "body": "递减律需要「其他条件不变」：收入、偏好、参照点、情境都固定。跨期或跨情境比较（加薪前后、换了工作之后）不满足这个前提，直接套递减律会算错。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它不是普遍定律。成瘾品、成套收藏（差最后一件时边际价值最高）、学习曲线上的互补技能都出现边际递增。递减是常见情形，不是必然。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "古典假设里「效用可测量、可人际比较」已被放弃。现代效用是序数的（只需偏好排序），基数效用只在期望效用与风险态度这类特定问题里才有意义——所以「他的快乐比我的多 20%」这种说法没有理论支撑。", "basis": "literature", "src": "Hicks, J. R. (1939). Value and Capital. Oxford University Press；Pareto, V. (1906). Manuale di economia politica."}, {"kind": "boundary", "body": "「收入越高、幸福增量越小」被过度推广。广为流传的「7.5 万美元天花板」在 2023 年的对撞式合作中被追溯到测量问题：原调查约 85% 的回答已在量表顶端，只能反映分布低端的变化；对多数人，收入与情绪幸福在 10 万美元以上仍随对数收入上升，只有最不幸福的约 15–20% 出现平台。", "basis": "literature", "src": "Killingsworth, M. A., Kahneman, D. & Mellers, B. (2023). Income and emotional well-being: a conflict resolved. PNAS, 120(10), e2208661120；Kahneman, D. & Deaton, A. (2010). High income improves evaluation of life but not emotional well-being. PNAS, 107(38), 16489–16493."}, {"kind": "boundary", "body": "最优决策在「边际收益 = 边际成本」，不在「总量最大」。只要增量收益大于增量成本就继续投入，相等时停——这条规则同时适用于「再加一组」「再招一人」「再写一页」。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "离散选择要小心：对不可分割的单位（招一个人、开一家店）求导会给出「半个人」这种无意义答案，此时应做增量分析（做 vs 不做两版对比），而不是套边际公式。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「边际递减」当成「不值得再做」。递减不等于为负：只要边际收益仍大于边际成本，继续投入就是对的。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「边际效用递减」解释一切「后来没那么爽」。也可能是参照点上移（适应）、或投入质量本身下降，两者机制不同。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "直接引用 7.5 万美元天花板。该数字来自二元量表的测量上限，2023 年已被对撞式合作修正。", "basis": "literature", "src": "Killingsworth, Kahneman & Mellers (2023)"}], "bibs": ["Marshall, A. (1890). Principles of Economics. Macmillan.", "Hicks, J. R. (1939). Value and Capital. Oxford University Press.", "Kahneman, D. & Deaton, A. (2010). High income improves evaluation of life but not emotional well-being. PNAS, 107(38), 16489–16493.", "Killingsworth, M. A., Kahneman, D. & Mellers, B. (2023). Income and emotional well-being: a conflict resolved. PNAS, 120(10), e2208661120."], "links": [{"id": "c1234f41916e3836cb5ae01d88b9ca953", "zh": "机会成本", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "c3ed4f41916e3826dba550154443d00a6", "zh": "帕累托原则 / 二八定律", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cd4a4f41916e383a1a11801b5d06f1bf5", "slug": "overreaction-underreaction", "zh": "过度反应/反应不足", "en": "Overreaction / Underreaction", "icon": null, "one": "面对新信息时，判断或价格等反应可能偏离“合理更新”：要么反应过头，要么更新不够，随后出现回归或补偿调整。", "status": "complete", "rep": "partial", "repDetail": "价格层：长期反转在原始样本中成立，但对加权方式、微盘股与一月效应敏感，且部分可被价值溢价吸收（Fama-French 1996），因此「过度反应」不是唯一解释；短期动量与盈余漂移方向相反且同样稳健，说明不能把它当单一规律。判断层：贝叶斯更新的系统性偏离有实验证据，但那是另一类对象。故判 partial：现象在两个尺度上都存在，但「投资者过度反应」这一机制归因未被确立。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "经济学", "决策科学"], "context": ["决策", "风险管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["overreaction", "underreaction", "反应不足", "过度反应", "过度反应假说"], "claims": [{"kind": "boundary", "body": "经典证据是长期反转：按过去三年收益分组，「输家」组合在随后三年跑赢「赢家」组合约 25%（累计）。这是价格模式的描述，不是心理机制的测量。", "basis": "literature", "src": "De Bondt, W. F. M. & Thaler, R. (1985). Does the stock market overreact? Journal of Finance, 40(3), 793–805."}, {"kind": "boundary", "body": "同时存在方向相反的现象：三到十二个月尺度上有动量（过去赢家继续赢），盈余公告后有漂移（好消息后价格继续上行）。这说明「过度反应」与「反应不足」不是互斥的对错题，而是不同时间尺度上的两种模式。", "basis": "literature", "src": "Jegadeesh, N. & Titman, S. (1993). Returns to buying winners and selling losers. Journal of Finance, 48(1), 65–91；Bernard, V. L. & Thomas, J. K. (1989). Post-earnings-announcement drift. Journal of Accounting Research, 27, 1–36."}, {"kind": "boundary", "body": "长期反转的稳健性有争议。结果对加权方式（等权 vs 市值权）、微盘股占比、一月效应敏感；相当一部分可由价值溢价（低估值长期跑赢）解释——而价值溢价本身不需要「投资者过度反应」这个心理假设。", "basis": "literature", "src": "Fama, E. F. & French, K. R. (1996). Multifactor explanations of asset pricing anomalies. Journal of Finance, 51(1), 55–84."}, {"kind": "boundary", "body": "最关键的逻辑问题是「以果推因」：从价格反转推断投资者过度反应，需要排除风险溢价、流动性、税负销售、样本选择等替代解释。仅凭价格模式无法区分「人情绪化」与「风险补偿随时间变化」。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "在判断层面（非价格层面），过度/不足反应有独立证据：人对新信息的贝叶斯更新确实系统性偏离，方向取决于信息的显著性与先验强度。所以这个概念在心理学与金融学里指的不是同一件事，混用会出错。", "basis": "literature", "src": "Benjamin, D. J. (2019). Errors in probabilistic reasoning and judgment biases. In Handbook of Behavioral Economics, Vol. 2."}, {"kind": "boundary", "body": "可操作的判据是「基准更新」：先按贝叶斯算出合理更新幅度，再看实际反应偏离方向。没有基准，「过度」与「不足」都只是形容词。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「市场过度反应」解释任何反转。反转也可能来自风险溢价变化或样本特性；需要排除替代解释。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把动量（反应不足）与长期反转（过度反应）当成互相否证。两者在不同期限并存，是期限结构问题。", "basis": "literature", "src": "Jegadeesh & Titman (1993)；De Bondt & Thaler (1985)"}, {"kind": "misuse", "body": "从价格模式直接推断群体心理。这是以果推因，除非能独立测量预期。", "basis": "definition", "src": ""}], "bibs": ["De Bondt, W. F. M. & Thaler, R. (1985). Does the stock market overreact? Journal of Finance, 40(3), 793–805.", "Bernard, V. L. & Thomas, J. K. (1989). Post-earnings-announcement drift. Journal of Accounting Research, 27, 1–36.", "Jegadeesh, N. & Titman, S. (1993). Returns to buying winners and selling losers. Journal of Finance, 48(1), 65–91.", "Fama, E. F. & French, K. R. (1996). Multifactor explanations of asset pricing anomalies. Journal of Finance, 51(1), 55–84.", "Benjamin, D. J. (2019). Errors in probabilistic reasoning and judgment biases. In Handbook of Behavioral Economics, Vol. 2. Elsevier."], "links": []}, {"id": "c2804f41916e3824ab7f801e2533e6714", "slug": "overconfidence-bias", "zh": "过度自信偏差", "en": "Overconfidence Bias", "icon": null, "one": "高估自己的知识、判断准确性或控制力，常导致低估风险与过度交易/过度承诺。", "status": "complete", "rep": "yes", "repDetail": "三型中过度精确最稳定，跨文化、跨专业、跨任务均出现；高估与相对位置高估随任务难度反转，复现方向一致但幅度变化大。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["决策", "风险管理", "组织管理"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["calibration bias", "overconfidence", "校准偏差", "过度自信"], "claims": [{"kind": "boundary", "body": "必须区分三种形态：高估（overestimation，对自己绝对表现估高）、相对位置高估（overplacement，认为自己强于他人）、过度精确（overprecision，置信区间给得太窄）。三者可以同时反向，混为一谈会导致完全相反的结论。", "basis": "literature", "src": "Moore, D. A. & Healy, P. J. (2008). The trouble with overconfidence. Psychological Review, 115(2), 502–517."}, {"kind": "boundary", "body": "任务难度会反转前两型：困难任务上人们高估自己的绝对表现，同时却认为自己比别人差；简单任务上低估绝对表现，同时认为自己比别人强。", "basis": "literature", "src": "Moore & Healy (2008) 实验证据，摘要明示该反转"}, {"kind": "boundary", "body": "过度精确最稳健、最难消除，且它的存在反而会缩小另两型的幅度。跨文化、跨专业水平、跨任务领域都能观察到。", "basis": "literature", "src": "Moore & Healy (2008)；Juslin, Wennerholm & Olsson (1999)；Klayman et al. (1999)"}, {"kind": "boundary", "body": "「多数人认为自己高于平均」不能直接当作过度自信的证据。若能力分布右偏，多数人确实可以高于中位数；须与客观分布比较才能判定。", "basis": "definition", "src": "—"}, {"kind": "boundary", "body": "专家不免：医生的诊断信心系统性高于诊断准确率；金融分析师的预测精度远低于其信心；气候模型专家的预测区间几乎互不重叠。", "basis": "literature", "src": "Christensen-Szalanski & Bushyhead (1981)；Oskamp (1965)；Morgan & Keith (1995)；Zickfeld et al. (2010)—均转述于 CMU 过度精确研究综述"}, {"kind": "boundary", "body": "去偏效果有限且常是暂时的、领域特定的。「考虑相反」与分解判断有帮助，但知道偏误本身不足以消除它。", "basis": "literature", "src": "Moore & Healy (2008)；校准训练文献综述"}, {"kind": "misuse", "body": "把「90% 确信只对 75%」这类校准数字套到所有场景。校准水平取决于该领域是否有频繁、明确、及时的结果反馈——气象预报员校准最好，正因为他们有这个条件。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把自信本身当成缺陷。在没有反馈的领域，高信心可能是合理的先验，不是偏差。", "basis": "definition", "src": ""}], "bibs": ["Moore, D. A. & Healy, P. J. (2008). Psychological Review, 115(2), 502–517.", "Klayman, J. et al. (1999). Overconfidence: It depends on how, what, and whom you ask. OBHDP, 79(3), 216–247.", "Lichtenstein, S., Fischhoff, B. & Phillips, L. (1982). Calibration of probabilities. In Judgment Under Uncertainty."], "links": []}, {"id": "c3c74f41916e38242b1fe81da16361932", "slug": "adverse-selection", "zh": "逆向选择", "en": "Adverse Selection", "icon": null, "one": "信息不对称下，交易前高风险/低质量一方更倾向参与，导致市场平均质量下降甚至市场失灵。", "status": "complete", "rep": "partial", "repDetail": "理论机制成立并被广泛引用（Akerlof 1970 为 2001 年诺奖工作之一），但实证识别不一致：部分市场（年金、长期护理）有较强证据，多数车险与健康险市场找不到经典正向风险-保障关联（Cohen & Siegelman 2010 综述）。结论是「机制真实存在，但不是默认解释」。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["经济学", "决策科学"], "context": ["决策", "风险管理", "组织管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["adverse selection", "lemon market", "劣币驱逐良币", "柠檬市场", "逆选择"], "claims": [{"kind": "boundary", "body": "机制是「信息优势方的入样选择」，不是「价格高」。Akerlof 的二手车模型：买方只肯按平均质量出价，高质量卖方退出，平均质量再降，循环至市场萎缩。价格在这里是内生的结果，不是原因。", "basis": "literature", "src": "Akerlof, G. A. (1970). The market for “lemons”: quality uncertainty and the market mechanism. Quarterly Journal of Economics, 84(3), 488–500."}, {"kind": "boundary", "body": "「市场完全瓦解」依赖强假设：买方完全无法分辨、无质量保证、无重复交易。现实中保修、第三方认证、品牌、评级会部分恢复交易——Akerlof 本人就指出制度性对冲的存在。", "basis": "literature", "src": "Akerlof (1970)（文中已讨论 counteracting institutions：担保、品牌、连锁、执照）"}, {"kind": "boundary", "body": "保险市场是标准案例，但均衡形态不止一种：Rothschild–Stiglitz 显示可能出现分离均衡（用不同合约筛出不同类型），也可能根本不存在均衡。所以「逆向选择导致市场消失」只是若干可能之一。", "basis": "literature", "src": "Rothschild, M. & Stiglitz, J. (1976). Equilibrium in competitive insurance markets: an essay on the economics of imperfect information. Quarterly Journal of Economics, 90(4), 629–649."}, {"kind": "boundary", "body": "与道德风险的分界在时点：逆向选择发生在签约前（类型不可见），道德风险发生在签约后（行为不可见）。混用会导致开错药方——前者要披露与筛选，后者要激励与监督。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "实证识别比理论困难得多：价格与数量同时内生，「风险与保障正相关」也可能来自道德风险或风险偏好。跨市场综述的结论是混合的——许多市场找不到经典逆向选择的强证据。", "basis": "literature", "src": "Cohen, A. & Siegelman, P. (2010). Testing for adverse selection in insurance markets. Journal of Risk and Insurance, 77(1), 37–78."}, {"kind": "boundary", "body": "它不等于「劣币驱逐良币」。格雷欣定律讲的是法定比价扭曲下人们用劣币支付，前提是价格被法律固定；柠檬市场讲的是信息不对称下的退出。两者机制不同，中文语境里常被混用。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「好客户不来了」一律归为逆向选择。也可能是价格、服务或竞争变化；逆向选择要求「退出与不可观测的类型相关」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "认为提高价格能解决逆向选择。在柠檬结构里提价恰恰加速高质量方退出，是正反馈而非解药。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它解释一切「市场变差」。若质量下降源于成本压缩或监管放松，与信息不对称无关。", "basis": "definition", "src": ""}], "bibs": ["Akerlof, G. A. (1970). The market for “lemons”: quality uncertainty and the market mechanism. Quarterly Journal of Economics, 84(3), 488–500.", "Rothschild, M. & Stiglitz, J. (1976). Equilibrium in competitive insurance markets: an essay on the economics of imperfect information. Quarterly Journal of Economics, 90(4), 629–649.", "Stiglitz, J. E. & Weiss, A. (1981). Credit rationing in markets with imperfect information. American Economic Review, 71(3), 393–410.", "Cohen, A. & Siegelman, P. (2010). Testing for adverse selection in insurance markets. Journal of Risk and Insurance, 77(1), 37–78."], "links": [{"id": "c1014f41916e38215a65b01e752e3e1c0", "zh": "信号传递", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c0814f41916e382d08926815d071b97fa", "slug": "selection-bias", "zh": "选择偏差", "en": "Selection Bias", "icon": null, "one": "样本进入观察/分析的机制与研究对象相关，导致样本不具代表性，从而系统性偏离真实结论。", "status": "complete", "rep": "yes", "repDetail": "机制有形式化证明（Heckman 1979 的选择模型；对撞点条件化必然产生关联），并在真实数据中被反复量化：住院样本的 Berkson 偏倚、劳动供给中女性工资的选择性、失访导致的疗效高估。偏差方向通常可判，幅度依情境而定、不可默认。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["数学/统计", "决策科学"], "context": ["学习/研究", "批判性思维", "决策"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["sample selection bias", "selective bias", "入样偏倚", "样本选择偏差", "选择性偏误"], "claims": [{"kind": "boundary", "body": "它是系统偏倚，不随样本量增大而消失：n 变大只压缩方差，不改变入样机制带来的偏移。所以「多收点样本」治不了选择偏差。", "basis": "literature", "src": "Heckman, J. J. (1979). Sample selection bias as a specification error. Econometrica, 47(1), 153–161."}, {"kind": "boundary", "body": "三类机制：入样与结果相关（Heckman 型，如只观察到有工作的人的工资）、条件于对撞点（Berkson 型，如只看住院病人）、失访与幸存（attrition）。三者的共同点是选择变量与结果相关。", "basis": "literature", "src": "Elwert, F. & Winship, C. (2014). Endogenous selection bias: the problem of conditioning on a collider variable. Annual Review of Sociology, 40, 31–53."}, {"kind": "boundary", "body": "非随机抽样本身不等于有偏：志愿者偏差的大小取决于「志愿行为」与「研究变量」的关联强度。抽样不随机只影响外推，不必然影响样本内部的估计。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "选择偏差可以在没有混杂的情况下单独制造虚假关联：条件于对撞点即产生关联。所以「没有混杂」不等于「没有偏倚」——这是两条独立的检查项。", "basis": "literature", "src": "Cole, S. R. et al. (2010). Illustrating bias due to conditioning on a collider. International Journal of Epidemiology, 39(2), 417–420."}, {"kind": "boundary", "body": "Heckman 校正的前提是能建模入样方程，且排除性约束成立（有只影响入样、不影响结果的变量）。没有合格工具变量时，校正只是把偏倚换了个位置，甚至放大。", "basis": "literature", "src": "Heckman (1979)"}, {"kind": "boundary", "body": "逆概率加权（IPW）能校正可观测的选择机制，对不可观测的选择无能为力。这与混杂的处境相同：能校正的永远只是「你测到了的那部分」。", "basis": "literature", "src": "Robins, J. M., Rotnitzky, A. & Zhao, L. P. (1995). Analysis of semiparametric regression models for repeated outcomes in the presence of missing data. JASA, 90(429), 106–121."}, {"kind": "misuse", "body": "把「样本量小」叫选择偏差。那是精度问题（方差大），不是偏倚（期望偏）。两者需要完全不同的补救。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "看到「样本不随机」就判为有偏，而不检查选择变量与结果是否相关、方向如何。不相关的非随机抽样只是一次性外推风险。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "在回归里「控制入样概率」。当入样本身是对撞点或结果的下游时，控制它反而引入新的偏倚。", "basis": "definition", "src": ""}], "bibs": ["Heckman, J. J. (1979). Sample selection bias as a specification error. Econometrica, 47(1), 153–161.", "Elwert, F. & Winship, C. (2014). Endogenous selection bias: the problem of conditioning on a collider variable. Annual Review of Sociology, 40, 31–53.", "Cole, S. R. et al. (2010). Illustrating bias due to conditioning on a collider. International Journal of Epidemiology, 39(2), 417–420.", "Robins, J. M., Rotnitzky, A. & Zhao, L. P. (1995). Analysis of semiparametric regression models for repeated outcomes in the presence of missing data. JASA, 90(429), 106–121.", "Little, R. J. A. & Rubin, D. B. (2019). Statistical Analysis with Missing Data (3rd ed.). Wiley."], "links": []}, {"id": "c3484f41916e38351b29d819a65ac81f9", "slug": "choice-supportive-bias", "zh": "选择支持偏差", "en": "Choice-Supportive Bias", "icon": null, "one": "做出选择后，倾向于回忆或解释为所选方案更好、忽视其缺点，从而在事后强化对自己选择的合理化。", "status": "complete", "rep": "partial", "repDetail": "分版本说。评价版（spreading of alternatives）存在但幅度被高估：Chen & Risen (2010) 证明原范式有信息揭示混杂，剥离后的设计仍检出小效应。记忆版（把优点记给所选、缺点记给被拒）证据更稳，因为它不依赖两次评分的设计，可用来源监控任务直接测，且在老年样本中稳定出现。故判 partial：记忆层成立，评价层的效应量与机制均有争议。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["决策", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["choice-supportive bias", "事后偏袒所选", "选择后合理化", "选择支持性偏差"], "claims": [{"kind": "boundary", "body": "有两个可测版本，别混。评价版：选择后重新评价，所选对象上升、被拒对象下降（spreading of alternatives，Brehm 1956）。记忆版：事后回忆时，把所选选项的优点记得更多、缺点记得更少，甚至把被拒选项的优点错记到所选选项上（Mather, Shafir & Johnson 2000）。", "basis": "literature", "src": "Brehm, J. W. (1956). Postdecision changes in the desirability of alternatives. Journal of Abnormal and Social Psychology, 52(3), 384–389；Mather, M., Shafir, E. & Johnson, M. K. (2000). Misremembrance of options past. Psychological Science, 11(2), 132–138."}, {"kind": "boundary", "body": "评价版有一个严重的方法学挑战：若首次评分含噪声，选择本身就揭示了真实偏好，那么第二次评分的「上升」只是信息揭示与回归，不是态度改变（Chen & Risen 2010）。剥离这条通路的设计仍能检出效应，但幅度明显更小。", "basis": "literature", "src": "Chen, M. K. & Risen, J. L. (2010). How choice affects and reflects preferences. Journal of Personality and Social Psychology, 99(4), 573–594."}, {"kind": "boundary", "body": "记忆版不受这个混杂影响，因此证据更干净：它测的是回忆内容的系统性偏移（把优点归给所选、缺点归给被拒），可以用来源监控任务直接检验。这类偏移在老年人中更强——可能是因为他们更依赖图式化重建。", "basis": "literature", "src": "Mather, Shafir & Johnson (2000)；Mather, M. & Johnson, M. K. (2000). Choice-supportive source monitoring. Psychology and Aging, 15(4), 638–649."}, {"kind": "boundary", "body": "效应在「选项接近」时最大。两个选项差异明显时几乎没有——因为没有需要调和的认知张力。这既是边界条件，也是机制证据：它支持「为已发生的行为建构一致性」这一解释。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它可以不用「失调」解释。至少三条竞争路径：自我知觉（从自己的选择推断偏好）、叙事连贯（记忆倾向于讲一个前后一致的故事）、印象管理（对外维持一致形象）。现有证据难以完全区分，所以「机制是失调削减」不是已证结论。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "实际后果是双重的：它让后续选择更可能重复原选择（路径黏性），也让「我当初选得有道理」的记忆逐渐取代真实理由。后者在复盘时尤其危险——你以为在回顾，其实在辩护。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「事后说所选的好」一律判为偏差。所选可能真的好；判定需要与选择前的独立评价比较。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它解释任何「坚持原决定」。坚持可能来自真实转换成本或新信息；偏差要求可测的记忆或评价偏移。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略 Chen-Risen 混杂就引用 spread 的效应量。原始幅度被高估，剥离后更小。", "basis": "literature", "src": "Chen & Risen (2010)"}], "bibs": ["Brehm, J. W. (1956). Postdecision changes in the desirability of alternatives. Journal of Abnormal and Social Psychology, 52(3), 384–389.", "Mather, M., Shafir, E. & Johnson, M. K. (2000). Misremembrance of options past: Source monitoring and choice. Psychological Science, 11(2), 132–138.", "Mather, M. & Johnson, M. K. (2000). Choice-supportive source monitoring. Psychology and Aging, 15(4), 638–649.", "Chen, M. K. & Risen, J. L. (2010). How choice affects and reflects preferences. Journal of Personality and Social Psychology, 99(4), 573–594."], "links": []}, {"id": "c01a4f41916e382fd867b01948f8ab98f", "slug": "moral-hazard", "zh": "道德风险", "en": "Moral Hazard", "icon": null, "one": "在一方不会承担全部后果或受到保障时，可能更倾向于承担过高风险或降低努力水平的现象。", "status": "complete", "rep": "yes", "repDetail": "有随机实验的直接因果证据：RAND 健康保险实验把共保率随机分配，支出随自付比例单调下降，全免费组比 95% 共保组高 45%，弹性约 -0.2（Manning et al. 1987）。方向在车险、健康险、劳动合约中反复出现；争议在量级——多数估计的弹性远小于通俗叙事。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["经济学", "决策科学"], "context": ["风险管理", "组织管理", "决策"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["hidden action", "moral hazard", "事后机会主义", "败德行为", "隐蔽行动"], "claims": [{"kind": "boundary", "body": "它是「行为不可观测 + 后果不完全承担」，不是「道德败坏」。术语里的 moral 是十七世纪保险业的遗留用法，指「主观风险因素」，与伦理评价无关。", "basis": "literature", "src": "Pauly, M. V. (1968). The economics of moral hazard: comment. American Economic Review, 58(3), 531–537."}, {"kind": "boundary", "body": "要分两类：事前道德风险（受保后行为改变，如少锻炼、少锁门）与事后道德风险（损失发生后过度使用，如多开检查、拖延退院）。两者的对策不同——前者靠共保比例，后者靠免赔额与审核。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "与欺诈的分界：欺诈是虚构或隐瞒事实（可诉、可刑事追责），道德风险是在合约范围内的理性反应（不违法，只能用合约设计约束）。把它当欺诈处理，会得到「抓坏人」而不是「改激励」的方案。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "量级有随机实验：RAND 健康保险实验随机分配共保率，全免费组人均支出比 95% 共保组高 45%，价格弹性约 -0.2。所以它真实存在，但弹性不大——「保险导致医疗费用爆炸」是过度解读。", "basis": "literature", "src": "Manning, W. G., Newhouse, J. P., Duan, N., Keeler, E. B., Leibowitz, A. & Marquis, M. S. (1987). Health insurance and the demand for medical care: evidence from a randomized experiment. American Economic Review, 77(3), 251–277."}, {"kind": "boundary", "body": "在委托-代理框架里它是同一现象的另一个面：代理人努力不可观测，委托人只能依结果付酬。此时「道德风险」与「激励不足」是一枚硬币的两面。", "basis": "literature", "src": "Holmström, B. (1979). Moral hazard and observability. Bell Journal of Economics, 10(1), 74–91."}, {"kind": "boundary", "body": "约束手段会引入新扭曲：监督有成本、风险分担效率下降、严格筛选又会招来逆向选择。所以最优合约是把道德风险压到「边际治理成本 = 边际损失」的位置，不是清零。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把一切「买了保险就更敢冒险」都归为道德风险。若风险偏好本来就更强的人更愿意买保险，那是逆向选择，方向相反。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它做道德指责（「这人没良心」）。它是激励结构的系统性结果，换人不如换合约。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "以为加强考核就能消除它。考核指标本身会被优化（古德哈特），单指标强激励往往把道德风险转成多任务扭曲。", "basis": "definition", "src": ""}], "bibs": ["Pauly, M. V. (1968). The economics of moral hazard: comment. American Economic Review, 58(3), 531–537.", "Manning, W. G. et al. (1987). Health insurance and the demand for medical care: evidence from a randomized experiment. American Economic Review, 77(3), 251–277.", "Holmström, B. (1979). Moral hazard and observability. Bell Journal of Economics, 10(1), 74–91.", "Shavell, S. (1979). On moral hazard and insurance. Quarterly Journal of Economics, 93(4), 541–562."], "links": [{"id": "c1014f41916e38215a65b01e752e3e1c0", "zh": "信号传递", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c79c4f41916e3822785cc81b84d1ebfa4", "slug": "dunningkruger-effect", "zh": "邓宁-克鲁格效应 / 达克效应", "en": "Dunning–Kruger Effect", "icon": null, "one": "能力较低者更可能高估自身能力，而能力较高者更可能低估自身相对水平；本质是元认知不足导致的判断偏差。", "status": "complete", "rep": "partial", "repDetail": "强弱两版要分开。强版本（「越低能越高估、越高能越低估」，由四分位图呈现）在去掉人为分组后不成立：929 人样本的异方差与二次回归均不显著，随机数也能复现该图形，故判为统计假象。弱版本（低能力者对自身正确性更不敏感、自评普遍偏高）有支持：13977 人样本效应显著但仅解释约 1% 方差，性能依赖模型也给出方向一致的结果。另有极稳的邻近结论（优于平均效应 d=0.78、自评-实测相关约 .30）。故判 partial：戏剧版是假象，朴素版成立。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "决策科学"], "context": ["学习/研究", "组织管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["DK 效应", "Dunning-Kruger effect", "无知而不自知", "达克效应", "邓宁-克鲁格效应"], "claims": [{"kind": "boundary", "body": "原始证据是四分位图：按客观成绩分四组，画自评与实测的均值，得到「低分组高估最多、高分组略低估」的经典形状（Kruger & Dunning 1999）。这个图是流行叙事的全部来源，也是问题所在。", "basis": "literature", "src": "Kruger, J. & Dunning, D. (1999). Unskilled and unaware of it. Journal of Personality and Social Psychology, 77(6), 1121–1134."}, {"kind": "boundary", "body": "四分位图有两个统计假象，都会单独产生这个形状：①优于平均效应——大多数人不分能力都把自己评在平均之上；②回归到均值——极端分数在另一测量上会向中间靠。两者叠加，即使真实关系是线性的，图也会呈「低组高估、高组低估」。", "basis": "literature", "src": "Gignac, G. E. & Zajenkowski, M. (2020). The Dunning-Kruger effect is (mostly) a statistical artefact. Intelligence, 80, 101449."}, {"kind": "boundary", "body": "直接检验的结果支持假象说：929 名成年人做 Raven 高级推理测验并自评智商，自评均值 123.76、实测均值 101.70，相关 .28；按四分位画图完美重现教科书形状（最低组高估 32.63 分、最高组 12.68 分），但用异方差检验与二次回归（不依赖人为分组）检验时，两者都不显著。", "basis": "literature", "src": "Gignac & Zajenkowski (2020)"}, {"kind": "boundary", "body": "同类证据不止一项：随机数也能画出四分位图形（Nuhfer et al. 2016）；在困难任务上，高能力者反而误判更多（Burson et al. 2006）——与流行叙事方向相反。这些都指向「图形假象」而非「元认知缺陷」。", "basis": "literature", "src": "Nuhfer, E. et al. (2016). Random numbers and the Dunning-Kruger effect. Numeracy, 9(1)；Burson, K. A., Larrick, R. P. & Klayman, J. (2006). Skilled or unskilled, but still unaware of it. Journal of Personality and Social Psychology, 90(1), 60–77."}, {"kind": "boundary", "body": "但也不能说完全不存在。用 13977 人的全国样本（Add Health）做同类检验，效应统计显著但极小（解释约 1% 的方差）；用性能依赖模型分析原始任务数据，低能力者确实对「自己答对没有」更不敏感。所以留存的是一小块真实差异，不是那个戏剧化版本。", "basis": "literature", "src": "Dunkel, C. S., Nedelec, J. L. & van der Linden, D. (2023). Replication of the Dunning-Kruger effect in a large sample. Intelligence；Jansen, R. A., Rafferty, A. N. & Griffiths, T. L. (2021). A rational model of the Dunning-Kruger effect. Nature Human Behaviour, 5, 1442–1450."}, {"kind": "boundary", "body": "真正稳固的是两个更朴素的结论：人普遍高估自己（优于平均效应元分析：124 篇、291 个样本、逾 95 万人，d=0.78）；自评与实测的相关约为 .30（154 个效应量 r=.33，2024 年更新 r=.30）——即自我判断「粗糙但有用」，且系统偏高。这比「越低能越高估」更靠得住。", "basis": "literature", "src": "Zell, E., Strickhouser, J. E., Sedikides, C. & Alicke, M. D. (2020). The better-than-average effect in comparative self-evaluation. Psychological Bulletin, 146(2), 118–149；Freund, P. A. & Kasten, N. (2012). How smart do you think you are? Psychological Bulletin, 138(2), 296–321."}, {"kind": "misuse", "body": "用它嘲笑别人「你这就是达克效应」。它描述群体层面的统计模式，不能用于判定某一个体；且强版本本身是图形假象。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「自信」当低能力的标志。实证里自信与能力的相关只有约 .30，且在困难任务上高能力者也会低估自己。", "basis": "literature", "src": "Burson et al. (2006)；Freund & Kasten (2012)"}, {"kind": "misuse", "body": "引用四分位图当证据。该图形在随机数据上也能被造出来，不能作为效应存在的证明。", "basis": "literature", "src": "Nuhfer et al. (2016)；Gignac & Zajenkowski (2020)"}], "bibs": ["Kruger, J. & Dunning, D. (1999). Unskilled and unaware of it. Journal of Personality and Social Psychology, 77(6), 1121–1134.", "Burson, K. A., Larrick, R. P. & Klayman, J. (2006). Skilled or unskilled, but still unaware of it. Journal of Personality and Social Psychology, 90(1), 60–77.", "Freund, P. A. & Kasten, N. (2012). How smart do you think you are? Psychological Bulletin, 138(2), 296–321.", "Nuhfer, E. et al. (2016). Random numbers and the Dunning-Kruger effect. Numeracy, 9(1).", "Gignac, G. E. & Zajenkowski, M. (2020). The Dunning-Kruger effect is (mostly) a statistical artefact. Intelligence, 80, 101449.", "Zell, E., Strickhouser, J. E., Sedikides, C. & Alicke, M. D. (2020). The better-than-average effect in comparative self-evaluation. Psychological Bulletin, 146(2), 118–149.", "Jansen, R. A., Rafferty, A. N. & Griffiths, T. L. (2021). A rational model of the Dunning-Kruger effect. Nature Human Behaviour, 5, 1442–1450.", "Dunkel, C. S., Nedelec, J. L. & van der Linden, D. (2023). Replication of the Dunning-Kruger effect in a large sample. Intelligence."], "links": [{"id": "c6944f41916e383f39ed80148c4d5c06e", "zh": "确认偏误", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c5f54f41916e38260a2d481ef6cca03d8", "slug": "lock-in", "zh": "锁定效应", "en": "Lock-in", "icon": null, "one": "由于转换成本、网络效应或互补资产等原因，个体/组织被“锁定”在某种技术、平台或流程上，难以迁移到更优替代。", "status": "complete", "rep": "partial", "repDetail": "机制层稳固：转换成本影响定价与进入（Klemperer 的模型与大量实证）、网络效应影响标准竞争，这两条在电信、软件、支付网络里被反复验证。但「锁定导致长期劣等标准固化」这一强版本的实证支持弱于流行程度（见 `路径依赖` 条对 QWERTY 的复核）。另外，把「锁定」当解释时容易与现状偏差混淆，二者在观察上难分。故判 partial：机制可测、强结论需个案证据。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["经济学", "管理学"], "context": ["决策", "产品/增长", "组织管理"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["vendor lock-in", "供应商锁定", "技术锁定", "转换成本锁定", "锁定"], "claims": [{"kind": "boundary", "body": "锁定的三个来源机制不同，应对方式也不同：转换成本（学习、数据迁移、合约违约）、网络效应（价值随同用者数量上升）、互补资产（专用设备、配套流程）。把三者合称「锁定」会导致开错药方——网络效应型要靠互操作性，转换成本型要靠标准与可迁移性。", "basis": "literature", "src": "Shapiro, C. & Varian, H. R. (1999). Information Rules. Harvard Business School Press；Katz, M. L. & Shapiro, C. (1985). Network externalities, competition, and compatibility. American Economic Review, 75(3), 424–440."}, {"kind": "boundary", "body": "锁定不等于无效率。在真网络效应市场里，标准统一本身创造价值——所有人都用同一套接口，比每人用「更优」的不同接口总福利更高。判定锁定是否有害，必须比较「统一下的损失」与「碎片化下的损失」。", "basis": "literature", "src": "Farrell, J. & Saloner, G. (1985). Standardization, compatibility, and innovation. RAND Journal of Economics, 16(1), 70–83."}, {"kind": "boundary", "body": "锁定强度可测，不必靠感觉：转换成本可用「涨价容忍度」或「迁移后留存率」估计；网络效应可用「用户价值随规模的弹性」估计；互补资产可用专用性投资的沉没比例估计。没有这些数，「被锁定」只是抱怨。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "锁定经常被市场自己打破。智能手机取代键盘机、浏览器从 IE 迁移、企业从自建机房迁往云，都发生在「高度锁定」的判断之后。原因通常是新范式让旧转换成本失效（不是硬碰硬地付迁移费）。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "政策上的可操作处是互操作性与数据可携带权，而非价格管制。欧盟的互操作与数据迁移要求、号码可携带，都是把「转换成本」从用户身上转移到平台侧——这是针对机制而非针对结果。", "basis": "literature", "src": "Farrell, J. & Klemperer, P. (2007). Coordination and lock-in: Competition with switching costs and network effects. In Handbook of Industrial Organization, Vol. 3."}, {"kind": "boundary", "body": "个人层面的「锁定」要警惕归因错误：不愿改变可能来自现状偏差、损失厌恶或认知成本，而非真实转换成本。区分方法很简单——把迁移成本实际算出来，看它是否超过收益。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「我不喜欢这个平台」说成「我被锁定」。锁定需要正的、可量化的转换成本。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "认为锁定必然导致垄断定价。锁定给的是定价空间，是否用尽取决于竞争者能否用「补贴迁移」攻入；现实中常见的是新进入者替用户付转换成本。", "basis": "literature", "src": "Klemperer, P. (1995). Competition when consumers have switching costs. Review of Economic Studies, 62(4), 515–539."}, {"kind": "misuse", "body": "忽略锁定在组织内部的形态：流程、KPI、审批链也会锁定，且往往没有价格信号。这类锁定比技术锁定更难量化，也更容易被忽略。", "basis": "definition", "src": ""}], "bibs": ["Katz, M. L. & Shapiro, C. (1985). Network externalities, competition, and compatibility. American Economic Review, 75(3), 424–440.", "Farrell, J. & Saloner, G. (1985). Standardization, compatibility, and innovation. RAND Journal of Economics, 16(1), 70–83.", "Klemperer, P. (1995). Competition when consumers have switching costs. Review of Economic Studies, 62(4), 515–539.", "Shapiro, C. & Varian, H. R. (1999). Information Rules: A Strategic Guide to the Network Economy. Harvard Business School Press.", "Farrell, J. & Klemperer, P. (2007). Coordination and lock-in: Competition with switching costs and network effects. In Handbook of Industrial Organization, Vol. 3.", "Liebowitz, S. J. & Margolis, S. E. (1990). The fable of the keys. Journal of Law and Economics, 33(1), 1–25."], "links": []}, {"id": "c6e84f41916e383d6bb77813d992ed64f", "slug": "anchoring-effect", "zh": "锚定效应", "en": "Anchoring Effect", "icon": null, "one": "在估计数值或做判断时，会过度依赖最先接触到的参考点（锚），并围绕它做不充分的调整。", "status": "complete", "rep": "yes", "repDetail": "经典范式复现极稳：Many Labs 1 的四个问题在 36 个样本中 100% 显著且方向一致，效应量甚至大于原研究，这在整个偏差文献里是例外而非通例。但这个「yes」有明确边界：①它属于比较-估计范式；②经济学估值范式在锚点透明随机时效应消失或极弱；③个体差异测量信度低。所以正确结论是「现象真实、机制未定、适用域有限」，不是「一切都受锚定支配」。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["决策", "沟通与说服", "产品/增长"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["anchoring", "anchoring bias", "参照点效应", "锚定与调整", "锚定偏差"], "claims": [{"kind": "boundary", "body": "经典范式（先比较、再估计）是所有偏差里复现最稳的一类。Many Labs 1 在 36 个样本、6344 人中重跑四道题：每一道在每一个样本里都显著、方向一致，无一样本为零、无一样本反向；未加权效应量 1.27–2.60，均高于原研究的 0.93。在复现危机里这是罕见的「过了最严检验」。", "basis": "literature", "src": "Klein, R. A., Ratliff, K. A., Vianello, M. et al. (2014). Investigating variation in replicability: A 'Many Labs' replication project. Social Psychology, 45(3), 142–152."}, {"kind": "boundary", "body": "但「任意随机数字能改变支付意愿」这个经济学版本不稳。用真实报酬、且锚点明显随机（软件随机数、掷骰子）时，多项研究没找到效应；复现 Ariely 的社保号实验只得到 d≈0.26，而原研究约 0.94。所以必须区分两个范式：比较-估计（稳）与估值-出价（弱）。", "basis": "literature", "src": "Fudenberg, D., Levine, D. K. & Maniadis, Z. (2012). On the robustness of anchoring effects. American Economic Journal: Microeconomics；Ioannidis, K., Offerman, T. & Sloof, P. (2020). On the effect of anchoring on valuations when the anchor is transparently uninformative. Journal of the Economic Science Association；Maniadis, Z., Tufano, F. & List, J. A. (2014). One swallow doesn't make a summer. American Economic Journal: Microeconomics."}, {"kind": "boundary", "body": "机制有两条互不等价的解释。一是调整不足：从锚点出发向正确答案移动，但停得太早（Tversky & Kahneman 的原始解释）。二是选择性可及性：锚点激活了与之一致的语义知识，使支持该数值的证据更容易被检索（Mussweiler & Strack）。两者预测方向相同，但含义完全不同——前者是努力不够，后者是检索偏向。", "basis": "literature", "src": "Tversky, A. & Kahneman, D. (1974). Judgment under uncertainty: Heuristics and biases. Science, 185(4157), 1124–1131；Mussweiler, T. & Strack, F. (1999). Hypothesis-consistent testing and semantic priming in the anchoring paradigm. Journal of Experimental Social Psychology, 35(2), 136–164."}, {"kind": "boundary", "body": "语用成分真实存在。若明确告知锚点是实验故障产生的随机数，效应显著衰减但不归零——说明「锚点被视为有信息量的参考」这一层（Gricean 推断）放大了效应，但底层的认知同化仍在。", "basis": "literature", "src": "Wilson, T. D., Houston, C. E., Etling, K. M. & Brekke, N. (1996). A new look at anchoring effects. Journal of Experimental Psychology: General, 125(4), 387–402."}, {"kind": "boundary", "body": "个人层面的「锚定易感性」不可靠。汇总 96 项研究、五万余次估计的分析显示，个体锚定指数的信度很低：某人在一道题上被拉得很厉害，不代表下一道题也会。因此把它当稳定人格特质、或拿去做个体差异相关研究，基础不成立。", "basis": "literature", "src": "Röseler, L., Schütz, A. et al. (2024). The anchoring effect: A meta-analysis of individual differences. Meta-Psychology."}, {"kind": "boundary", "body": "去偏手段有明确强弱：单纯警告「别被锚定」基本无效；「consider the opposite」——要求写下该锚点为什么错的三条理由——有效；结构性手段（盲评、先各自独立估值再汇合、先给区间再定值）比个人意志可靠。", "basis": "literature", "src": "Mussweiler, T., Strack, F. & Pfeiffer, T. (2000). Overcoming the inevitable anchoring effect. Personality and Social Psychology Bulletin, 26(9), 1142–1150."}, {"kind": "misuse", "body": "把任何「先看到某个数字」都算锚定。锚定要求该数值进入了判断过程并产生了同化；只出现而未影响估计，不构成效应。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用锚定解释一切谈判结果。对方的高开价之所以有效，也可能因为它传递了关于底价的信息（合理推断），而非纯偏差；两者需要分开检验。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "引用 0.93 或「两个标准差」当固定效应量做跨场景推算。效应量随范式（比较-估计 vs 估值）差一个数量级。", "basis": "literature", "src": "Klein et al. (2014)；Maniadis et al. (2014)"}], "bibs": ["Tversky, A. & Kahneman, D. (1974). Judgment under uncertainty: Heuristics and biases. Science, 185(4157), 1124–1131.", "Jacowitz, K. E. & Kahneman, D. (1995). Measures of anchoring in estimation tasks. Personality and Social Psychology Bulletin, 21(11), 1161–1166.", "Wilson, T. D., Houston, C. E., Etling, K. M. & Brekke, N. (1996). A new look at anchoring effects. Journal of Experimental Psychology: General, 125(4), 387–402.", "Mussweiler, T. & Strack, F. (1999). Hypothesis-consistent testing and semantic priming in the anchoring paradigm. Journal of Experimental Social Psychology, 35(2), 136–164.", "Mussweiler, T., Strack, F. & Pfeiffer, T. (2000). Overcoming the inevitable anchoring effect. Personality and Social Psychology Bulletin, 26(9), 1142–1150.", "Klein, R. A., Ratliff, K. A., Vianello, M. et al. (2014). Investigating variation in replicability: A 'Many Labs' replication project. Social Psychology, 45(3), 142–152.", "Röseler, L., Schütz, A. et al. (2024). The anchoring effect: A meta-analysis of individual differences. Meta-Psychology."], "links": []}, {"id": "c87c4f41916e382049af401a58abbdf7e", "slug": "risk-aversion", "zh": "风险厌恶", "en": "Risk Aversion", "icon": null, "one": "在期望值相同的情况下偏好确定结果而非不确定赌局的倾向；通常以凹型效用函数刻画。", "status": "complete", "rep": "yes", "repDetail": "现象层极其稳固：人在等期望值下偏好确定结果，这是实验经济学里复现率最高的结果之一，跨文化、跨年龄、跨物种都能观察到。争议在「量」而不在「有无」：由凹效用解释风险厌恶在数学上被 Rabin (2000) 否证；宏观要求的系数（30–40）与微观测得的（约 1）差一个数量级（股权溢价之谜）；系数还随测法与领域大幅变动。所以「人厌恶风险」成立，「风险厌恶可用单一凹效用系数刻画」不成立。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["经济学", "决策科学"], "context": ["决策", "风险管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["CRRA", "risk averse", "相对风险厌恶系数", "绝对风险厌恶系数", "风险回避", "风险规避"], "claims": [{"kind": "boundary", "body": "它是关于「方差」的偏好，不需要参照点。这与损失厌恶是两套机制：前者比较的是同一期望值下确定的与不确定的结果，后者比较的是相对某参照点的得与失。两者常被互相替代解释，导致预测错位。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "两种测度不能混用：绝对风险厌恶 A(x)=−u''/u' 描述对固定金额赌局的态度，相对风险厌恶 R(x)=−x·u''/u' 描述对财富比例的赌局的态度。说「风险厌恶系数是 2」必须先说是哪一个。", "basis": "literature", "src": "Pratt, J. W. (1964). Risk aversion in the small and in the large. Econometrica, 32(1/2), 122–136；Arrow, K. J. (1971). Essays in the Theory of Risk-Bearing. Markham."}, {"kind": "boundary", "body": "「凹效用」不能同时解释小额与大额的风险态度。Rabin 校准定理：只要在任意财富水平拒绝「五成输 100 赢 110」，在同一模型内就必须拒绝「五成输 100 赢任意大」。所以现实中的小额风险厌恶不是凹性造成的，而是别的东西（损失厌恶、模糊回避）。", "basis": "literature", "src": "Rabin, M. (2000). Risk aversion and expected-utility theory: A calibration theorem. Econometrica, 68(5), 1281–1292."}, {"kind": "boundary", "body": "宏观数据把缺口放大到荒诞：1889–1978 美股相对国债的年溢价约 6%，在标准消费资产定价模型里需要相对风险厌恶 30–40 才能解释，而微观行为证据支持的值约为 1。这就是股权溢价之谜。", "basis": "literature", "src": "Mehra, R. & Prescott, E. C. (1985). The equity premium: A puzzle. Journal of Monetary Economics, 15(2), 145–161."}, {"kind": "boundary", "body": "它不是稳定的人格特质。同一人在不同领域（财务、健康、休闲、社交、伦理）的风险态度相关性很低，用单一系数跨域外推会失败。", "basis": "literature", "src": "Weber, E. U., Blais, A.-R. & Betz, N. E. (2002). A domain-specific risk-attitude scale. Journal of Behavioral Decision Making, 15(4), 263–290."}, {"kind": "boundary", "body": "测法决定数值。假设性问卷、分级赌局表（MPL）、激励相容的真实支付，给出的系数可以差几倍；风险厌恶的「大小」不是对象的属性，是「测法 × 对象」的联合产物。", "basis": "literature", "src": "Holt, C. A. & Laury, S. K. (2002). Risk aversion and incentive effects. American Economic Review, 92(5), 1644–1655."}, {"kind": "misuse", "body": "把任何保守选择都叫风险厌恶。信息不足、流动性约束、损失厌恶、模糊回避都会产生同样的外观，但机制不同。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "拿一个系数值去做跨场景推算（如「他的 γ=2，所以保费应该……」）。系数是局部测度，且跨域不稳定。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「厌恶风险」和「厌恶不确定性」混为一谈。前者是已知概率下的方差偏好，后者是概率本身未知（Ellsberg），两者可分离。", "basis": "literature", "src": "Ellsberg, D. (1961). Risk, ambiguity, and the Savage axioms. Quarterly Journal of Economics, 75(4), 643–669."}], "bibs": ["Pratt, J. W. (1964). Risk aversion in the small and in the large. Econometrica, 32(1/2), 122–136.", "Arrow, K. J. (1971). Essays in the Theory of Risk-Bearing. Markham.", "Mehra, R. & Prescott, E. C. (1985). The equity premium: A puzzle. Journal of Monetary Economics, 15(2), 145–161.", "Rabin, M. (2000). Risk aversion and expected-utility theory: A calibration theorem. Econometrica, 68(5), 1281–1292.", "Weber, E. U., Blais, A.-R. & Betz, N. E. (2002). A domain-specific risk-attitude scale. Journal of Behavioral Decision Making, 15(4), 263–290.", "Holt, C. A. & Laury, S. K. (2002). Risk aversion and incentive effects. American Economic Review, 92(5), 1644–1655."], "links": []}, {"id": "ccdb4f41916e38349a29a01f83d130c09", "slug": "matthew-effect", "zh": "马太效应", "en": "Matthew Effect", "icon": null, "one": "资源与优势会向已有优势者累积，导致“强者更强、弱者更弱”的正反馈。", "status": "complete", "rep": "partial", "repDetail": "在科研经费与引用上有强因果证据（回归断点设计、八年后两倍以上差距）；但「强者恒强」的严格版本在其他层级不成立（人际地位层级显示流动频繁），且概念的界定与检验在文献中长期不统一。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["社会学", "经济学"], "context": ["组织管理", "产品/增长", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["Matthew effect", "cumulative advantage", "强者恒强", "累积优势"], "claims": [{"kind": "boundary", "body": "最强证据来自回归断点设计：荷兰早期科研经费申请中，刚好过线与刚好未过线者质量几乎相同，但八年后过线者累计获得的经费是不足者的两倍以上——微小随机优势被放大。", "basis": "literature", "src": "Bol, T., de Vaan, M. & van de Rijt, A. (2018). The Matthew effect in science funding. PNAS, 115(19), 4887–4890."}, {"kind": "boundary", "body": "地位带来的引用增益是「温和且集中」的，且在质量不确定时更强：地位在证据薄弱处起作用，在质量清晰处作用有限。", "basis": "literature", "src": "Azoulay, P., Stuart, T. & Wang, D. (2014). Social influence given limited information: The Matthew effect in science."}, {"kind": "boundary", "body": "严格版本的「强者恒强」在别的层级不成立：青少年人际地位层级里，个体频繁上下流动，只是难以维持；长期格局稳定来自「回拉」，而不是「初始优势不可逆」。", "basis": "literature", "src": "关于「movement without mobility」的纵向网络研究（Social Networks）：地位流动频繁但不持久"}, {"kind": "boundary", "body": "这个概念在文献里被滥用：累积优势的模型、机制与检验长期缺乏统一界定，导致错误设定、错误估计与错误解释。", "basis": "literature", "src": "DiPrete, T. A. & Eirich, G. M. (2006). Cumulative advantage as a mechanism for inequality: A review of theoretical and empirical developments. Annual Review of Sociology, 32, 271–297."}, {"kind": "boundary", "body": "与「优先连接」（网络中的富者愈富）相关但不等同：前者描述个体获得资源后的增益，后者是网络生长机制；把两者混为一谈会把「结构效应」误当「个人能力」。", "basis": "literature", "src": "DiPrete & Eirich (2006)；网络科学中的 preferential attachment 文献"}, {"kind": "misuse", "body": "把任何「成功者更容易成功」都叫马太效应。需要指认累积的具体资源（经费、曝光、声誉、机会），否则只是同义反复。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略反向过程。累积劣势与累积优势是同一机制的两面；只讲「强者更强」会漏掉「弱者更难翻身」的政策含义。", "basis": "definition", "src": ""}], "bibs": ["Merton, R. K. (1968). The Matthew Effect in Science. Science.", "Bol, T., de Vaan, M. & van de Rijt, A. (2018). PNAS, 115(19), 4887–4890.", "Azoulay, P., Stuart, T. & Wang, D. (2014). Social influence given limited information.", "DiPrete, T. A. & Eirich, G. M. (2006). Annual Review of Sociology, 32, 271–297."], "links": [{"id": "c3ed4f41916e3826dba550154443d00a6", "zh": "帕累托原则 / 二八定律", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "cd254f41916e3826e94d98136b45b2c5d", "zh": "晕轮效应 / 光环效应", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "cfa14f41916e3839ba33e811128e2d270", "zh": "囚徒困境", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c4c84f41916e383c186058161bc5a27ec", "slug": "black-swan", "zh": "黑天鹅事件", "en": "Black Swan", "icon": null, "one": "极端罕见、影响巨大且事后常被解释为“可预见”的事件；强调不确定性与尾部风险对决策的支配性。", "status": "complete", "rep": "n/a", "repDetail": "它是概念/认识论主张，不是一个可复现的效应，因此不适用复现判定。它的经验支撑是「事后叙事确实普遍存在」（后见之明偏差有大量实验证据），但「黑天鹅」本身作为分类无法被数据检验——这正是 Lindley 与 Aven 的核心批评。可检验的替代物是尾部风险（见该条）与后见之明偏差，那两者都有实证。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["决策科学", "经济学"], "context": ["风险管理", "决策", "批判性思维"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["black swan event",
