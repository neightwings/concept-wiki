<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#fbfaf7;--panel:#fff;--line:#e6e2da;--line2:#f0ece5;
--ink:#1f1e1b;--ink2:#5f5d57;--ink3:#918e86;
--accent:#2f5d8a;--accent-bg:#eaf1f8;
--green:#2f6f4f;--green-bg:#e8f3ed;
--amber:#8f6414;--amber-bg:#faf0dc;
--red:#9e3b3b;--red-bg:#fbecec;
}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em}
.stat{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
#built{padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.sbox{flex:1;min-width:220px;position:relative}
.sbox input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:13px/1.5 inherit;color:var(--ink);outline:none}
.sbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:13px inherit;color:var(--ink2);cursor:pointer}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
main{display:grid;grid-template-columns:210px 320px 1fr;height:calc(100vh - 57px)}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:16px 14px 40px}
.fgroup{margin-bottom:20px}
.fgh{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.fitem{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.45}
.fitem:hover{background:var(--line2)}
.fitem.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.fitem .n{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.fitem.on .n{color:var(--accent);opacity:.7}
.fitem.zero{opacity:.35;pointer-events:none}
#list{border-right:1px solid var(--line);overflow-y:auto}
.li{padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.li:hover{background:var(--line2)}
.li.on{background:var(--accent-bg)}
.li.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.li .t{font-size:13.5px;font-weight:500;line-height:1.4}
.li .e{font-size:11px;color:var(--ink3);font-style:italic;margin-top:1px}
.li .o{font-size:12px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grp-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 16px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink3);border-bottom:1px solid var(--line2)}
.grp-h .n{font-weight:400;color:var(--ink3);opacity:.8;margin-left:5px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle}
#detail{overflow-y:auto;padding:28px 36px 80px;max-width:820px}
.empty{color:var(--ink3);font-size:13px;padding:60px 36px;line-height:1.8}
h1{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.en{font-size:13px;color:var(--ink3);font-style:italic;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--panel)}
.chip.nat{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.chip.rep-yes{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:500}
.chip.rep-partial{background:var(--amber-bg);border-color:transparent;color:var(--amber);font-weight:500}
.chip.rep-no{background:var(--red-bg);border-color:transparent;color:var(--red);font-weight:500}
.chip.rep-na{background:var(--line2);border-color:transparent;color:var(--ink3)}
.def{margin-top:20px;font-size:15px;line-height:1.75;color:var(--ink);padding:14px 16px;background:var(--panel);border-left:2px solid var(--accent);border-radius:0 6px 6px 0}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink3);margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.claim{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px;line-height:1.65}
.claim:last-child{border-bottom:none}
.basis{flex:0 0 34px;font-size:10px;padding-top:3px;color:var(--ink3);letter-spacing:.02em}
.basis.lit{color:var(--green)}
.claim .bd{flex:1}
.claim .src{display:block;font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.5}
.quote{font-size:12px;color:var(--ink2);line-height:1.65;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
ol.bib{padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.7}
ol.bib li{margin-bottom:6px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink2);text-decoration:none;background:var(--panel)}
.rel a:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:36px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px}
mark{background:#fdf3c8;color:inherit;padding:0 1px;border-radius:2px}
@media(max-width:1080px){main{grid-template-columns:180px 1fr}#detail{display:none}body.detail #detail{display:block}body.detail #list,body.detail aside{display:none}}
@media(max-width:720px){main{grid-template-columns:1fr;height:auto}aside{display:none}}
</style>
</head>
<body>
<header>
<div class="hd">
  <div class="brand">概念库</div>
  <div class="stat" id="stat"></div>
  <div class="stat" id="built" title="本页是只读快照，内容截至该时刻；此后库若有变动，需重新生成才会反映"></div>
  <div class="sbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="搜标题 / 别名 / 断言 / 文献   按 / 聚焦" autocomplete="off" spellcheck="false">
  </div>
  <select class="btn" id="grp" title="分组方式">
    <option value="nature">按性质</option>
    <option value="domain">按学科</option>
    <option value="context">按场景</option>
    <option value="rep">按复现</option>
    <option value="none">不分组</option>
  </select>
  <button class="btn" id="rnd">随机一条</button>
  <button class="btn" id="clr">清空</button>
</div>
</header>
<main>
  <aside id="facets"></aside>
  <div id="list"></div>
  <div id="detail"><div class="empty">从左侧选一条。或按 / 直接搜。</div></div>
</main>
<script>
const DATA={"concepts": [{"id": "c6c04f41916e383919c15816bd2477cfd", "slug": "p-value-statistical-significance", "zh": "p 值与统计显著性", "en": "P-value / Statistical Significance", "icon": null, "one": "p 值是在零假设成立前提下，观测到当前或更极端数据的概率；“显著”不等于效应大或结果重要。", "status": "complete", "rep": "n/a", "repDetail": "p 值是数学定义（零假设下观测到当前或更极端数据的尾概率），本身不存在「能否复现」的问题。可复现的是围绕它的实证结论，而这两条都有多来源证据：低统计功效普遍存在（Button et al. 2013）、p 值被系统性误读且「略小于 0.05」被过度发表（Amrhein et al. 2019 综述）。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["数学/统计"], "context": ["学习/研究", "批判性思维"], "epistemic": ["形式/分析（Formal / Analytic）"], "aliases": ["P值", "p < .05", "p-value", "statistical significance", "显著性检验", "统计显著性"], "claims": [{"kind": "boundary", "body": "p 值不是「零假设为真的概率」。它是 P(数据|H0)，不是 P(H0|数据)；把 p 值当成假设为真的后验概率，等于把条件概率的方向搞反。美国统计学会的六条原则里，第 2 条专门澄清这一点。", "basis": "literature", "src": "Wasserstein, R. L. & Lazar, N. A. (2016). The ASA statement on p-values: context, process, and purpose. The American Statistician, 70(2), 129–133."}, {"kind": "boundary", "body": "p 值不度量效应大小。样本足够大时，任意微小的效应都能得到极小的 p 值；反过来，大效应在小样本里也可能 p=0.2。要判断「值不值得在意」必须看效应量与置信区间，而不是看 p 是否跨过 0.05。", "basis": "literature", "src": "Wasserstein, R. L., Schirm, A. L. & Lazar, N. A. (2019). Moving to a world beyond “p<0.05”. The American Statistician, 73(S1), 1–19."}, {"kind": "boundary", "body": "p 值依赖研究者的意图与停止规则：同一批数据，「测到显著就停」与「固定样本量」算出的 p 值不同。所以 p 值不是数据本身的属性，而是「数据 + 分析计划」的属性——这也是 optional stopping 能让假阳性率远超 5% 的原因。", "basis": "literature", "src": "ASA 原则 4（Wasserstein & Lazar 2016）；Simmons, J. P., Nelson, L. D. & Simonsohn, U. (2011). False-positive psychology. Psychological Science, 22(11), 1359–1366."}, {"kind": "boundary", "body": "0.05 是习惯而非定理。Fisher 原意是把 p 当作连续的证据强度，不是二元通关线；2019 年 800 余名学者联署主张放弃「统计显著性」这一二分用法。", "basis": "literature", "src": "Amrhein, V., Greenland, S. & McShane, B. (2019). Scientists rise up against statistical significance. Nature, 567, 305–307."}, {"kind": "boundary", "body": "p=0.049 与 p=0.051 之间没有证据断层。阈值两侧的差别小于抽样误差本身；把一侧叫「有效」、另一侧叫「无效」，是把连续量强行二分，并会系统性放大「略小于 0.05」的发表偏好。", "basis": "literature", "src": "Amrhein et al. (2019)；Wasserstein, Schirm & Lazar (2019)"}, {"kind": "boundary", "body": "p 不显著不等于「没有效应」：可能只是功效不足。神经科学论文的中位统计功效长期低于 0.5，这意味着大半真实效应在单次研究中根本测不出来，零结果更多反映样本量而非真相。", "basis": "literature", "src": "Button, K. S. et al. (2013). Power failure: why small sample size undermines the reliability of neuroscience. Nature Reviews Neuroscience, 14, 365–376."}, {"kind": "misuse", "body": "用「两组各自做了检验，一组显著、一组不显著」断言两组有差异。显著性的差异不等于差异的显著性；正确做法是直接检验交互项或差值。", "basis": "literature", "src": "Gelman, A. & Stern, H. (2006). The difference between “significant” and “not significant” is not itself statistically significant. The American Statistician, 60(4), 328–331."}, {"kind": "misuse", "body": "只报 p 不报效应量与置信区间。这样读者无法判断「显著」是效应大，还是样本大。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把 p<0.05 当成「结论已成立」，跳过重复验证。单次显著只说明「在 H0 下这数据不太可能出现」，不说明这个发现经得起再测一次。", "basis": "definition", "src": ""}], "bibs": ["Wasserstein, R. L. & Lazar, N. A. (2016). The ASA statement on p-values: context, process, and purpose. The American Statistician, 70(2), 129–133.", "Wasserstein, R. L., Schirm, A. L. & Lazar, N. A. (2019). Moving to a world beyond “p<0.05”. The American Statistician, 73(S1), 1–19.", "Amrhein, V., Greenland, S. & McShane, B. (2019). Scientists rise up against statistical significance. Nature, 567, 305–307.", "Button, K. S. et al. (2013). Power failure: why small sample size undermines the reliability of neuroscience. Nature Reviews Neuroscience, 14, 365–376.", "Gelman, A. & Stern, H. (2006). The difference between “significant” and “not significant” is not itself statistically significant. The American Statistician, 60(4), 328–331."], "links": []}, {"id": "c6fc4f41916e382e1ae2c01dd1f3ac72e", "slug": "tipping-point-phase-transition", "zh": "临界点/相变", "en": "Tipping Point / Phase Transition", "icon": null, "one": "系统参数跨过某个阈值后，整体行为发生突变式变化（从一种状态跃迁到另一种状态），常见于扩散、网络与复杂系统。", "status": "complete", "rep": "partial", "repDetail": "分两层。物理相变层：理论完备、实验精确，属最稳固的科学内容。复杂系统层：双稳态、滞后、突变这些现象在湖泊富营养化、珊瑚白化、气候子系统中都有实证，机制真实；但「临界慢化可作为通用预警」这一推广被数据削弱——长期生态序列中信号出现率约四成，且与实际转折点时间不一致、假阳性居多；噪声/速率诱导型转变则机制上不产生该信号。所以判 partial：现象真实，预警能力被高估。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["数学/统计", "决策科学"], "context": ["决策", "风险管理", "产品/增长"], "epistemic": [], "aliases": ["phase transition", "tipping point", "临界点", "临界转变", "引爆点", "相变", "翻转点"], "claims": [{"kind": "boundary", "body": "物理相变与社会「引爆点」是两种东西。物理相变有严格理论：序参量、对称破缺、临界指数、普适类——不同材料的相变可以落在同一普适类里，这是可预测的。社会系统的「临界点」多数只是「非线性变化的比喻」，没有对应的序参量与普适类。", "basis": "literature", "src": "Landau, L. D. & Lifshitz, E. M. (1980). Statistical Physics, Part 1. Pergamon；Stanley, H. E. (1971). Introduction to Phase Transitions and Critical Phenomena. Oxford University Press."}, {"kind": "boundary", "body": "数学上的对应物是分岔：鞍结分岔、叉式分岔、Hopf 分岔。这些有明确判据（雅可比矩阵特征值穿越虚轴），因此「临界点在哪」可以算出来，不是感觉出来的。", "basis": "literature", "src": "Strogatz, S. H. (2015). Nonlinear Dynamics and Chaos (2nd ed.). Westview Press."}, {"kind": "boundary", "body": "预警信号的实际命中率不高。理论上临近分岔会出现「临界慢化」——恢复变慢、方差与自相关上升。但对长期生态时间序列的检验显示：方差显著上升的序列约 41%、自相关约 44%，且这些信号与实际转折点在时间上并不一致，假阳性占多数。", "basis": "literature", "src": "Burthe, S. J. et al. (2016). Do early warning indicators consistently predict nonlinear change in long-term ecological data? Journal of Applied Ecology."}, {"kind": "boundary", "body": "三类转变不产生临界慢化：噪声诱导（随机扰动直接推过边界）、速率诱导（参数变化快过系统跟随能力）、外生冲击驱动。这三类下，基于方差的预警会安静地失效——不是信号弱，是机制上不该有信号。", "basis": "literature", "src": "Ashwin, P., Wieczorek, S., Vitolo, R. & Cox, P. (2012). Tipping points in open systems. Philosophical Transactions of the Royal Society A, 370, 1166–1184."}, {"kind": "boundary", "body": "即使检出预警，它只说「接近不稳定」，不说时间、幅度与形式。从「系统在变脆」到「何时翻转、翻转成什么样」之间有实质缺口，不能靠外推填上。", "basis": "literature", "src": "Scheffer, M. et al. (2009). Early-warning signals for critical transitions. Nature, 461, 53–59；Burthe et al. (2016)"}, {"kind": "boundary", "body": "社会扩散的阈值模型给出另一种机制：个体有异质阈值，微小扰动可以触发级联（Granovetter 1978）。这条路径不需要「临界慢化」，因此它的临界点不可用方差预警，只能靠阈值分布估计。", "basis": "literature", "src": "Granovetter, M. (1978). Threshold models of collective behavior. American Journal of Sociology, 83(6), 1420–1443."}, {"kind": "misuse", "body": "把「过了某个点就会崩」当预言。临界点理论给的是条件性结论（若参数沿此路径变化、若无非线性扰动），不是日期。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「临界点」为线性外推加戏。许多所谓临界点只是在事后把一段平滑变化切成两段；判定需要独立证据（分岔结构、双稳态、滞后）。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「有滞后（hysteresis）」当「不可逆」。滞后说明回到原状态需要越过不同阈值，不等于无法恢复；两者常被混用来强化叙事。", "basis": "definition", "src": ""}], "bibs": ["Landau, L. D. & Lifshitz, E. M. (1980). Statistical Physics, Part 1. Pergamon.", "Stanley, H. E. (1971). Introduction to Phase Transitions and Critical Phenomena. Oxford University Press.", "Granovetter, M. (1978). Threshold models of collective behavior. American Journal of Sociology, 83(6), 1420–1443.", "Scheffer, M. et al. (2009). Early-warning signals for critical transitions. Nature, 461, 53–59.", "Ashwin, P., Wieczorek, S., Vitolo, R. & Cox, P. (2012). Tipping points in open systems. Philosophical Transactions of the Royal Society A, 370, 1166–1184.", "Strogatz, S. H. (2015). Nonlinear Dynamics and Chaos (2nd ed.). Westview Press.", "Burthe, S. J. et al. (2016). Do early warning indicators consistently predict nonlinear change in long-term ecological data? Journal of Applied Ecology."], "links": []}, {"id": "cb3a4f41916e382bbae6881b38fb6ec22", "slug": "antinomy", "zh": "二律背反", "en": "Antinomy", "icon": null, "one": "在同一套看似合理的前提下，可以推导出彼此矛盾的两条命题，用来揭示理性/概念框架的边界。", "status": "complete", "rep": "n/a", "repDetail": "它是哲学分析工具，不是经验命题，没有可复现的效应。可评价的是它的使用效果：康德四组二律背反的具体论证在哲学史上被反复检验与批评（如对第三组自由的讨论），但它作为「诊断框架」的价值不依赖某一组的胜负。历史上若干科学危机确实呈现二律背反结构并被「改前提」解决，这属于案例说明而非统计证据。", "checked": "2026-11-19", "nature": ["悖论/二律背反", "基础概念/定义"], "domain": ["哲学"], "context": ["批判性思维", "学习/研究"], "epistemic": [], "aliases": ["antinomy", "二律背反性", "康德二律背反", "理性的二律背反"], "claims": [{"kind": "boundary", "body": "结构与普通矛盾不同。矛盾是 A 与 ¬A，必有一假；二律背反是「正题」与「反题」各自都有看似成立的论证，冲突指向共同前提有问题，而不是某一方算错。判定二律背反要看：两边的论证是否共享了某个不该共享的假设。", "basis": "literature", "src": "Kant, I. (1781/1787). Kritik der reinen Vernunft, 先验辩证论「纯粹理性的二律背反」；Wood, A. W. (2010). The antinomies of pure reason. In The Cambridge Companion to Kant's Critique of Pure Reason."}, {"kind": "boundary", "body": "康德的四组正题/反题是原型：世界在时空上有无开端与界限；是否存在单纯不可分者；是否存在自然之外的自由因；是否存在绝对必然的存在者。他的解法不是选边，而是指出「把现象当作物自体」这一共同错误——两边都越出了经验的适用范围。", "basis": "literature", "src": "Kant (1781/1787), A426/B454 及以下"}, {"kind": "boundary", "body": "现代科学里有大量「二律背反式」的张力，但解法都是改前提而非选边：罗素悖论促成类型论与公理化集合论；光速与伽利略变换的冲突促成狭义相对论；波粒二象性促成量子力学。它们的共同点是：冲突暴露了旧框架的隐藏假设。", "basis": "literature", "src": "Russell, B. (1903). The Principles of Mathematics；Einstein, A. (1905). Zur Elektrodynamik bewegter Körper. Annalen der Physik, 17, 891–921."}, {"kind": "boundary", "body": "二律背反的诊断价值在于「找到共同前提」，不在于「宣布无解」。若两边论证不共享前提，那只是两个立场之争，不是二律背反。这个区分决定了下一步该做什么：改框架 vs 继续辩论。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它预设了「理性有其适用边界」这一康德式立场。若不接受该立场（例如黑格尔式辩证法认为矛盾可被更高层次统一），二律背反就不是终点而是环节。因此这个概念的用法依赖你站在哪个哲学传统里。", "basis": "literature", "src": "Hegel, G. W. F. (1812–1816). Wissenschaft der Logik；Wood (2010)"}, {"kind": "boundary", "body": "在实践层面，它提示的是「检查共享假设」这一动作：当两个都能自圆其说的结论互斥时，先找它们共同接受但未经检验的前提（往往是某个计量单位的定义或某个模型的适用域），比争论结论更有效。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何两难都叫二律背反。若一方论证明显更强，那就不是二律背反，是尚未解决的普通问题。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它当「无法解决」的挡箭牌。康德的原意是「边界在此，需换层次」，不是「到此为止」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「两边都有道理」等同于「两边都对」。二律背反的结论是两边都不完全对——因为共享前提有问题。", "basis": "definition", "src": ""}], "bibs": ["Kant, I. (1781/1787). Kritik der reinen Vernunft. 先验辩证论，第二卷第二章。", "Hegel, G. W. F. (1812–1816). Wissenschaft der Logik.", "Russell, B. (1903). The Principles of Mathematics. Cambridge University Press.", "Einstein, A. (1905). Zur Elektrodynamik bewegter Körper. Annalen der Physik, 17, 891–921.", "Wood, A. W. (2010). The antinomies of pure reason. In The Cambridge Companion to Kant's Critique of Pure Reason. Cambridge University Press."], "links": [{"id": "c0754f41916e3834a808e0113fa0e3e86", "zh": "忒修斯之船", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "c08c4f41916e38352bb4201f73f4c2347", "zh": "先验 & 后验", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cdcf4f41916e3831d9c6c01b36569d8ce", "slug": "bandwagon-effect", "zh": "从众效应", "en": "Bandwagon Effect", "icon": null, "one": "个体倾向于因为“很多人都这么做/这么认为”而跟随多数选择，从而放大潮流与集体偏好。", "status": "complete", "rep": "partial", "repDetail": "从众基质稳健（133 项研究、17 国，合并顺从率约 25%，跨文化与跨年代有系统变化）；但政治 bandwagon 效应不稳定（受控实验 +7pp，大样本调查无一般效应）。此外中文「从众」与英文「bandwagon」是两个构念，本条目的命名本身存在错配。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "社会学", "决策科学"], "context": ["产品/增长", "沟通与说服", "决策"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["bandwagon", "乐队花车效应", "羊群效应", "阿希从众"], "claims": [{"kind": "boundary", "body": "中文名与英文名指向两个不同构念：Asch 传统研究的是「明知群体答案错误仍跟着答」（知觉判断），bandwagon 研究的是「因为流行而采纳」（偏好与行为）。两者的实验范式与机制不同，混用会导致错误归因。", "basis": "literature", "src": "Leibenstein, H. (1950). Bandwagon, Snob, and Veblen Effects in the Theory of Consumers' Demand. Quarterly Journal of Economics；Asch, S. E. (1951)"}, {"kind": "boundary", "body": "从众幅度普遍被高估：Asch 范式的合并顺从率约 25%（原始研究约 32–37%），约四分之一被试从未从众，而控制条件下错误率低于 1%。「人人都会从众」是误引。", "basis": "literature", "src": "Bond, R. & Smith, P. B. (1996). Culture and conformity: A meta-analysis of studies using Asch's line judgment task. Psychological Bulletin, 119(1), 111–137（133 项研究、17 个国家）"}, {"kind": "boundary", "body": "它不是恒定人性：集体主义社会的顺从率显著更高，美国样本的顺从率自 1950 年代以来持续下降。", "basis": "literature", "src": "Bond & Smith (1996)"}, {"kind": "boundary", "body": "一个同盟者即可大幅瓦解：只要出现一名同样给出正确答案的支持者，从众率显著下降（部分条件下降幅达 75%）。这是「 unanimity 被打破」的效应。", "basis": "literature", "src": "Asch, S. E. (1951/1956) 关于一致性与同盟者的实验"}, {"kind": "boundary", "body": "政治领域的 bandwagon 效应不稳定：受控实验约 +7 个百分点，但 N≈23,000+ 的荷兰调查实验没有发现民调结果的一般效应，作者把它比作「尼斯湖水怪」；有综述认为混乱主要来自概念界定不清。", "basis": "literature", "src": "Farjam, M. (2020) 的在线投票实验；van der Meer, T., Hakhverdian, A. & Aaldering, L. (2016)；Barnfield, M. (2020) 的概念澄清"}, {"kind": "boundary", "body": "流行度本身携带的信息会衰减：当所有人都在互相复制时，群体的选择比看起来的信息更少。人工音乐市场实验显示，社会影响使成功同时变得更不平等、更不可预测。", "basis": "literature", "src": "Salganik, M. J., Dodds, P. S. & Watts, D. J. (2006). Experimental study of inequality and unpredictability in an artificial cultural market. Science, 311(5762), 854–856."}, {"kind": "misuse", "body": "把「很多人相信」当作「因此为真」。这是诉诸流行的推理错误（bandwagon fallacy），与 bandwagon effect（一种行为倾向）不是一回事——前者是论证形式，后者是心理现象。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用从众解释一切集体行为。需要先区分信息性影响（把他人选择当证据）与规范性影响（怕被排斥），两者的干预手段相反：前者要提供独立信息，后者要降低表态成本。", "basis": "definition", "src": ""}], "bibs": ["Asch, S. E. (1951). Effects of group pressure upon the modification and distortion of judgments.", "Bond, R. & Smith, P. B. (1996). Culture and conformity: A meta-analysis. Psychological Bulletin, 119(1), 111–137.", "Leibenstein, H. (1950). Bandwagon, snob, and Veblen effects in the theory of consumers' demand. Quarterly Journal of Economics.", "Salganik, M. J., Dodds, P. S. & Watts, D. J. (2006). Science, 311(5762), 854–856.", "van der Meer, T., Hakhverdian, A. & Aaldering, L. (2016) 关于政治 bandwagon 效应的大样本调查实验."], "links": [{"id": "c24a4f41916e3832897e08160a0583c32", "zh": "可获性层叠", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cbee4f41916e3822eae7d8190aa5b57d7", "slug": "representativeness-heuristic", "zh": "代表性启发式", "en": "Representativeness Heuristic", "icon": null, "one": "人们根据“像不像典型案例/原型”来判断概率或归类，容易忽视基准率与样本量等统计信息。", "status": "complete", "rep": "partial", "repDetail": "单事件概率框架下现象稳健复现，跨学生、专家与统计训练样本均出现；但效应大小高度依赖表述格式，机制解释存在四种竞争版本，尚未定论。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["心理学", "决策科学"], "context": ["决策", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["representativeness bias", "代表性偏差", "相似性启发式"], "claims": [{"kind": "boundary", "body": "Linda 问题的违例率很高，且统计训练不构成保护：统计外行约 89% 认为「银行出纳且女权」比「银行出纳」更可能；统计老手约 85%，几乎无改善。", "basis": "literature", "src": "Tversky, A. & Kahneman, D. (1983). Extensional versus intuitive reasoning: The conjunction fallacy. Psychological Review, 90(4), 293–315"}, {"kind": "boundary", "body": "格式敏感：把问题从概率表述改为频率表述后，违例率从 80% 以上降到 10–20%。", "basis": "literature", "src": "Hertwig, R. & Gigerenzer, G. (1999). The conjunction fallacy revisited. JBDM, 12(3), 275–305"}, {"kind": "boundary", "body": "但仅换格式不足：Mellers、Hertwig 与 Kahneman 的对抗性合作发现，频率格式本身不能消除合取效应，还需同时消除措辞歧义（如「可能」与「且」的多义）。", "basis": "literature", "src": "Mellers, B., Hertwig, R. & Kahneman, D. (2001). Do frequency representations eliminate conjunction effects? Psychological Science, 12(4), 269–275"}, {"kind": "boundary", "body": "与基线率忽视不是同一件事：基线率忽视是代表性的后果之一，且有明确边界——被试内设计、直接经验、频率表征、明确样本空间、随机抽样，都会让人重新变得对基线率敏感。", "basis": "literature", "src": "Koehler, J. J. (1996). The base rate fallacy reconsidered. Behavioral and Brain Sciences, 19(1), 1–17"}, {"kind": "boundary", "body": "机制至少有四种竞争解释：会话/语义歧义、归纳确证（人追踪的是证据支持度而非概率）、量子概率模型、概率估计加噪声。哪种成立尚未定。", "basis": "literature", "src": "各解释的对照综述，见 Tentori & Crupi (2013)；Hertwig & Gigerenzer (1999)"}, {"kind": "boundary", "body": "不等于「以貌取人」或刻板印象。这里的「代表性」特指用「与原型相似度」替代「概率判断」这一次具体替换。", "basis": "definition", "src": "—"}, {"kind": "misuse", "body": "把任何「忽视基准率」都归因于代表性。忽视基准率也可能来自措辞歧义、信息缺失，或基准率本身与当前问题无关。", "basis": "definition", "src": ""}], "bibs": ["Kahneman, D. & Tversky, A. (1972). Subjective probability: A judgment of representativeness. Cognitive Psychology, 3(3), 430–454.", "Tversky, A. & Kahneman, D. (1974). Science, 185, 1124–1131.", "Tversky, A. & Kahneman, D. (1983). Psychological Review, 90(4), 293–315.", "Koehler, J. J. (1996). Behavioral and Brain Sciences, 19(1), 1–17."], "links": []}, {"id": "c1014f41916e38215a65b01e752e3e1c0", "slug": "signaling", "zh": "信号传递", "en": "Signaling", "icon": null, "one": "在信息不对称下，拥有私有信息的一方通过可观察行动/成本投入向另一方传递自身类型或质量，以影响对方决策。", "status": "complete", "rep": "partial", "repDetail": "分离均衡的机制与单交叉条件在理论上严格，实验也支持「成本差异驱动信号可信度」。但「教育主要是信号」这一强命题未被普遍接受——人力资本解释同样能拟合文凭回报，两者难以分离（羊皮纸效应是支持信号论的证据之一，但不是判决性证据）。结论：机制成立，具体场景的权重仍需逐案识别。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["经济学", "博弈论", "决策科学"], "context": ["沟通与说服", "组织管理", "决策"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["signaling", "signalling", "信号理论", "市场信号", "成本信号"], "claims": [{"kind": "boundary", "body": "信号有效的核心不是「昂贵」，而是「成本对不同类型的差异」——单交叉条件。低成本类型付得起、高成本类型付不起，信号才有分离力；所有人都同样昂贵的投入不传递任何信息。", "basis": "literature", "src": "Spence, M. (1973). Job market signaling. Quarterly Journal of Economics, 87(3), 355–374."}, {"kind": "boundary", "body": "要区分「信号」与「指数」：指数是不可操纵的属性（年龄、性别、历史记录），信号是可主动选择的投入（学历、广告、保修）。只有后者才是策略行为。", "basis": "literature", "src": "Spence (1973)"}, {"kind": "boundary", "body": "信号均衡可能带来社会性过度投资：教育若主要作为信号，私人会投到「足以区分」的程度，社会却承担了全部成本而无生产率提升。这是 Spence 模型的标准福利含义，不是反教育的结论。", "basis": "literature", "src": "Spence (1973)；Stiglitz, J. E. (1975). The theory of screening, education, and the distribution of income. American Economic Review, 65(3), 283–300."}, {"kind": "boundary", "body": "筛选是它的镜像：由信息劣势方设计合约让对方自选（高免赔额 vs 低免赔额、试用期、期权行权价）。所以不对称的解法有两条路——优势方出示，或劣势方设闸。", "basis": "literature", "src": "Rothschild, M. & Stiglitz, J. (1976). Equilibrium in competitive insurance markets. Quarterly Journal of Economics, 90(4), 629–649."}, {"kind": "boundary", "body": "信号会退化：一旦可被低成本伪造，接收方就转向更昂贵的替代，形成军备竞赛（学历通胀、认证堆叠、广告投放竞赛）。信号的价值取决于伪造成本，而不是它看起来多正式。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它解释的是「为什么值得付出这个成本」，不是「这个投入本身有生产力」。同一个行为可以同时是信号与生产性投入，识别两者需要看「成本是否随类型变化」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「花钱」都当信号。烧钱若对所有类型成本相同，就没有信息量，只是浪费。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「这是信号」解释一切无法解释的支出（高管豪宅、豪华办公室）。可检验的版本必须指出「谁付得起、谁付不起」，否则不可证伪。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把筛选与信号混用。方向搞反会导致设计错误：让劣势方去「发信号」，等于要它自证不利。", "basis": "definition", "src": ""}], "bibs": ["Spence, M. (1973). Job market signaling. Quarterly Journal of Economics, 87(3), 355–374.", "Stiglitz, J. E. (1975). The theory of screening, education, and the distribution of income. American Economic Review, 65(3), 283–300.", "Rothschild, M. & Stiglitz, J. (1976). Equilibrium in competitive insurance markets. Quarterly Journal of Economics, 90(4), 629–649.", "Nelson, P. (1974). Advertising as information. Journal of Political Economy, 82(4), 729–754."], "links": [{"id": "c01a4f41916e382fd867b01948f8ab98f", "zh": "道德风险", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "c3c74f41916e38242b1fe81da16361932", "zh": "逆向选择", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "ca844f41916e382609db68193fea41a6b", "zh": "信息不对称", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "ca844f41916e382609db68193fea41a6b", "slug": "information-asymmetry", "zh": "信息不对称", "en": "Information Asymmetry", "icon": null, "one": "交易或互动双方掌握的信息不一样，导致决策、定价与激励出现系统偏差，是逆向选择与道德风险等问题的根源之一。", "status": "complete", "rep": "n/a", "repDetail": "这是一个结构性条件（双方信息集不同且不可验证），本身没有「效应」可复现。可复现的是由它派生的机制：逆向选择（Akerlof 1970）、信贷配给（Stiglitz & Weiss 1981）、信号与筛选（Spence 1973；Rothschild & Stiglitz 1976）——这三支都各自有理论与实证支撑。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["经济学", "决策科学"], "context": ["决策", "风险管理", "组织管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["asymmetric information", "information asymmetry", "不对称信息", "信息优势", "私有信息"], "claims": [{"kind": "boundary", "body": "关键不是「信息少」，而是「双方信息集不同且不可验证」。单方信息少但可核验（如公开财报、第三方检测）不构成不对称问题——能被验证的差异只是搜寻成本，不是结构性问题。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "后果分两个时点：事前是逆向选择（类型不可见），事后是道德风险（行为不可见）。对应的工具也分两类：信号与筛选（事前）、激励与监督（事后）。把两者混为一谈，药方一定开错。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它不必然导致市场失灵。制度可以把不可观测信息转化为可观测承诺：担保、品牌、连锁、执照、强制披露。Akerlof 原文就列了这些对冲机制——「柠檬市场」常被引到一半。", "basis": "literature", "src": "Akerlof, G. A. (1970). The market for “lemons”. Quarterly Journal of Economics, 84(3), 488–500."}, {"kind": "boundary", "body": "不对称的方向决定谁付代价：卖方占优→买方折价、优质退出（柠檬）；买方占优→卖方设限，出现信贷配给——银行宁可拒绝也不提价，因为提价只会招来更高风险的借款人。", "basis": "literature", "src": "Stiglitz, J. E. & Weiss, A. (1981). Credit rationing in markets with imperfect information. American Economic Review, 71(3), 393–410."}, {"kind": "boundary", "body": "它与「信息不完全」是两件事：后者是所有人都不确定（奈特意义上的不确定性），前者是分布不均。政策含义相反——前者要披露与验证，后者要保险与分散。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "数字平台降低的是搜寻成本，不是不对称本身：评价体系可被刷单污染，算法黑箱制造了新的不对称（平台知道、用户不知道）。所以「信息更透明了」这个判断要分开看。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「我不了解情况」都说成信息不对称。单方面无知不是不对称，必须存在掌握方与利益冲突。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "以为披露越多越好。披露有成本，且过量披露会造成信息过载与责任转移；有效披露的标准是「使验证成为可能」，不是「全部公开」。", "basis": "definition", "src": ""}], "bibs": ["Akerlof, G. A. (1970). The market for “lemons”: quality uncertainty and the market mechanism. Quarterly Journal of Economics, 84(3), 488–500.", "Spence, M. (1973). Job market signaling. Quarterly Journal of Economics, 87(3), 355–374.", "Stiglitz, J. E. & Weiss, A. (1981). Credit rationing in markets with imperfect information. American Economic Review, 71(3), 393–410.", "Rothschild, M. & Stiglitz, J. (1976). Equilibrium in competitive insurance markets. Quarterly Journal of Economics, 90(4), 629–649."], "links": [{"id": "c1014f41916e38215a65b01e752e3e1c0", "zh": "信号传递", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cf264f41916e382968a118127cd55e24d", "slug": "false-dilemma-false-dichotomy", "zh": "假两难", "en": "False Dilemma / False Dichotomy", "icon": null, "one": "把原本存在多个可能选项/连续光谱的问题，错误地压缩成“只能二选一”的对立选项，从而迫使站队或误导结论。", "status": "complete", "rep": "n/a", "repDetail": "它是论证形式（非形式谬误）的判定，不是经验效应，因此没有复现问题，也没有效应量。可援引的经验内容只有一项相邻事实：问题的二分/分档形式会改变回答分布（Schwarz 关于问卷形式的综述），这说明二分问法有实质后果——但那是测量效应，不是「假两难」这个谬误本身的证据。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["哲学", "社会学"], "context": ["批判性思维", "沟通与说服", "决策"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["false dichotomy", "false dilemma", "假二分法", "虚假两难", "虚假二分", "非黑即白谬误"], "claims": [{"kind": "boundary", "body": "判定要件有两条，缺一不成立：①论证给出的选项集合不穷尽（存在未被列出的可行选项）；②被排除的选项不是因为与前提矛盾而被排除。只满足「听起来极端」不算假两难。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "真两难确实存在。是否签字、是否手术、生或死，这些在特定约束下选项集合就是二元的。判定标准是「选项是否穷尽」，不是「选项数量」。把它当万能反驳，会退化成「我拒绝选边」的托词。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "更隐蔽的版本是连续谱切分：「你支持还是反对 X」隐去了支持程度与支持哪一部分。这类问法会实际改变答案分布——同一议题在二分问法与分档问法下得到的「多数意见」可以相反。这是测量效应，不只是修辞。", "basis": "literature", "src": "Schwarz, N. (1999). Self-reports: How the questions shape the answers. American Psychologist, 54(2), 93–105."}, {"kind": "boundary", "body": "它有修辞功能，且常是有意的：强制站队能提高承诺、简化动员、压缩讨论成本。所以在政治与营销里它是工具而非失误——判定「谬误」要看语境是求真的论证，还是求动员的修辞。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "反制手段是具体的：要求补出第三选项；要求给出量级与条件（「在什么条件下、多大程度上」）；把二分问法改成连续或分档问法再问一遍，看结论是否稳定。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它没有效应量。这是论证形式的判定，不是可测偏差；因此不能像锚定、框架那样给出 d 值，也不能说「人有 X% 概率犯这个错」。把它与「二分思维」这种人格化说法混用，是概念滑坡。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何二选一都叫假两难。若选项确实穷尽（在给定约束下），那是真两难。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "指责对方假两难却不指出被排除的可行选项。没有第三选项的具体内容，这个指责本身是空的。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「我拒绝选边」当第三选项。拒绝选择不是选项，除非它能产生一个不同的结果。", "basis": "definition", "src": ""}], "bibs": ["Walton, D. (1996). Arguments from Ignorance. Pennsylvania State University Press.", "Schwarz, N. (1999). Self-reports: How the questions shape the answers. American Psychologist, 54(2), 93–105.", "Toulmin, S. E. (1958). The Uses of Argument. Cambridge University Press."], "links": []}, {"id": "c08c4f41916e38352bb4201f73f4c2347", "slug": "a-priori-a-posteriori", "zh": "先验 & 后验", "en": "A priori & A posteriori", "icon": null, "one": "先验：不依赖经验事实即可成立的知识/判断；后验：需要经验观察或证据支持的知识/判断。", "status": "complete", "rep": "n/a", "repDetail": "这是概念区分，不是经验主张，无复现问题。可评价的是这组区分的可用性：它在数学哲学与语言哲学中仍在被使用与争论（Kripke 的三分交叉、Quine 的整体论反对），说明它是有生产力的工具而非已定案的结论。需要警惕的是把康德强含义与现代弱含义混用，那会制造出看似深刻实则歧义的对立。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["哲学", "数学/统计"], "context": ["学习/研究", "批判性思维"], "epistemic": ["形式/分析（Formal / Analytic）"], "aliases": ["a posteriori", "a priori", "先验", "先验知识", "后验", "后验知识"], "claims": [{"kind": "boundary", "body": "先验 ≠ 天生。这个区分说的是「辩护方式」——该命题的真是否需要诉诸经验——不是「获得方式」。你可以后天学会一个先验命题（比如通过学习才知道「7+5=12」），它仍然是先验的。把 a priori 译成「先天」是中文语境里最持久的误导。", "basis": "literature", "src": "Kant, I. (1781/1787). Kritik der reinen Vernunft, 导论；Bruce, M. & Barbone, S. (2011). A priori and a posteriori. Internet Encyclopedia of Philosophy."}, {"kind": "boundary", "body": "它只是三组区分中的一组，另两组是「分析/综合」（谓词是否包含在主词中）与「必然/偶然」（是否在所有可能世界成立）。三组常被当成同义词，实际可以交叉——这是 20 世纪分析哲学的核心工作之一。", "basis": "literature", "src": "Kant (1781/1787)；Kripke, S. (1980). Naming and Necessity. Harvard University Press."}, {"kind": "boundary", "body": "Kripke 的三处交叉是标准反例：①后天必然——「水是 H₂O」在所有可能世界为真，但需要经验发现；②先验偶然——「标准米尺在 t₀ 时长一米」在我们定义它的方式下先验可知，但作为事实是偶然的；③先验必然——逻辑与算术命题。所以「先验」不蕴含「必然」，「必然」也不蕴含「先验」。", "basis": "literature", "src": "Kripke, S. (1980). Naming and Necessity. Harvard University Press, Lecture III."}, {"kind": "boundary", "body": "「先验」在康德那里还有一层强含义：不仅是「不依赖经验」，还是「使经验成为可能」的条件（时空、因果等范畴）。这比现代分析哲学用的弱含义（不诉诸经验即可辩护）强得多，混用会导致对康德论证的误解。", "basis": "literature", "src": "Kant (1781/1787), 先验感性论与先验分析论；Guyer, P. (1998). Kant and the Claims of Knowledge. Cambridge University Press."}, {"kind": "boundary", "body": "「分析/综合」区分本身受质疑。Quine 论证不存在不依赖经验的分析命题——所谓定义只是我们暂时不愿放弃的信念，整体知识面对经验（整体论）。若不接受分析/综合，先验知识的范围也随之收缩。", "basis": "literature", "src": "Quine, W. V. O. (1951). Two dogmas of empiricism. Philosophical Review, 60(1), 20–43."}, {"kind": "boundary", "body": "数学的地位是这个区分的主战场。逻辑主义（Frege、Russell）想把算术归约为逻辑，从而全部先验；哥德尔不完备定理使「一切数学真理都可由一组逻辑公理机械导出」受挫。今天更常见的立场是：数学的「先验性」是关于证明的，不是关于世界的。", "basis": "literature", "src": "Frege, G. (1884). Die Grundlagen der Arithmetik；Russell, B. & Whitehead, A. N. (1910–1913). Principia Mathematica；Gödel (1931)"}, {"kind": "misuse", "body": "把「我不用查资料就知道」当先验。那可能只是社会共识或常识（经验积累），不是先验辩护。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把「先验」当「主观」或「想当然」。先验命题要求的是必然性与不依赖经验的辩护，门槛比「我觉得」高得多。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「这是先验的」结束讨论，免除举证责任。在经验问题上主张先验，通常是在回避证据。", "basis": "definition", "src": ""}], "bibs": ["Kant, I. (1781/1787). Kritik der reinen Vernunft. 导论及先验感性论。", "Frege, G. (1884). Die Grundlagen der Arithmetik.", "Russell, B. & Whitehead, A. N. (1910–1913). Principia Mathematica. Cambridge University Press.", "Quine, W. V. O. (1951). Two dogmas of empiricism. Philosophical Review, 60(1), 20–43.", "Kripke, S. (1980). Naming and Necessity. Harvard University Press.", "Guyer, P. (1998). Kant and the Claims of Knowledge. Cambridge University Press."], "links": [{"id": "c0754f41916e3834a808e0113fa0e3e86", "zh": "忒修斯之船", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "cb3a4f41916e382bbae6881b38fb6ec22", "zh": "二律背反", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "ccb44f41916e3829291e60156123ac176", "zh": "奥卡姆剃刀", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c5804f41916e382bfa30381f160d2632f", "slug": "prospect-theory", "zh": "前景理论", "en": "Prospect Theory", "icon": null, "one": "描述人在风险与不确定性下的选择方式：相对参照点评价得失、对损失更敏感，并呈现概率加权等非线性特征。", "status": "complete", "rep": "yes", "repDetail": "定性模式复现良好：参照点依赖、损失侧更陡、反 S 概率加权、四重模式（小概率收益求险/小概率损失避 risk、大概率收益保守/大概率损失求险）在跨国家、跨样本、跨年代中反复出现；Ruggeri et al. (2020) 在 19 国约 4100 人中重现约 94% 题目、12/13 个理论对比。但参数层面不稳定：个体拟合的参数分布很宽且相互纠缠，损失厌恶系数的估计高度依赖测法（见 `损失厌恶` 条）。结论应为：模式成立，常数不成立。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["经济学", "决策科学"], "context": ["决策", "风险管理", "产品/增长"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["CPT", "PT", "cumulative prospect theory", "展望理论", "累积前景理论"], "claims": [{"kind": "boundary", "body": "三根支柱要分开检验：参照点依赖、损失厌恶、概率加权。它们不是同一个假设，证据强度也不同——参照点依赖最稳，概率加权的形状最依赖测量方式，损失厌恶的系数争议最大（见 `损失厌恶` 条）。混在一起说「前景理论被证实/被推翻」都是错的。", "basis": "literature", "src": "Kahneman, D. & Tversky, A. (1979). Prospect theory: An analysis of decision under risk. Econometrica, 47(2), 263–291."}, {"kind": "boundary", "body": "1979 原版有硬伤：它对每个结果单独加权，可能让一个被支配的选项排在被支配它的选项之前。1992 的累积版改用秩依加权（借用 Quiggin 的机制），把支配性直接建进函数形式里。今天做参数估计用的都是累积版。", "basis": "literature", "src": "Tversky, A. & Kahneman, D. (1992). Advances in prospect theory: Cumulative representation of uncertainty. Journal of Risk and Uncertainty, 5(4), 297–323；Quiggin, J. (1982). A theory of anticipated utility. Journal of Economic Behavior & Organization, 3(4), 323–343."}, {"kind": "boundary", "body": "价值函数是分段幂函数：收益侧凹（α≈0.88）、损失侧凸、损失段更陡。凹与凸分别对应「从参照点出发的敏感度递减」——离参照点越远，同样幅度的变化感受越弱。这条与损失厌恶是两件事。", "basis": "literature", "src": "Tversky & Kahneman (1992)"}, {"kind": "boundary", "body": "概率加权函数是反 S 形：小概率被高估、中大概率被低估，曲线与客观概率大致在三分之一附近相交。这一个形状同时解释了买彩票（高估微小中奖率）与买保险（高估微小事故率）——同一机制，不需要两个假设。", "basis": "literature", "src": "Wu, G. & Gonzalez, R. (1996). Curvature of the probability weighting function. Management Science, 42(12), 1676–1690；Prelec, D. (1998). The probability weighting function. Econometrica, 66(3), 497–527."}, {"kind": "boundary", "body": "反 S 只在「描述型决策」（概率被明确告知）里成立。当人靠反复经历学习概率时，稀有事件被低估而不是高估——这是描述-体验差异（description-experience gap）。所以加权函数不能跨范式外推。", "basis": "literature", "src": "Hertwig, R., Barron, G., Weber, E. U. & Erev, I. (2004). Decisions from experience and the effect of rare events in risky choice. Psychological Science, 15(8), 534–539."}, {"kind": "boundary", "body": "跨文化可迁移的是定性模式，不是参数。19 国约 4100 人的复现研究重现了约 94% 的原始题目与 13 个理论对比中的 12 个；但个体层面拟合显示参数分布很宽、彼此相关，导致损失厌恶与概率加权难以分离。", "basis": "literature", "src": "Ruggeri, K. et al. (2020). Replicating patterns of prospect theory for decision under risk. Nature Human Behaviour, 4, 622–633；Nilsson, H., Rieskamp, J. & Wagenmakers, E.-J. (2011). Hierarchical Bayesian parameter estimation for cumulative prospect theory. Journal of Mathematical Psychology, 55(1), 84–93."}, {"kind": "misuse", "body": "把它当预测个体选择的模型。它拟合群体聚合数据很好，但个体外样本预测差——它是描述性曲线拟合，不是认知机制。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「前景理论说人厌恶损失」替代具体机制分析。参照点在哪、由什么设定，才是决定预测的关键；跳过参照点，理论什么都不预测。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略框架的适用域，把描述型实验的结论搬到体验型场景（如长期投资、重复博弈）。两者在稀有事件上的方向相反。", "basis": "literature", "src": "Hertwig et al. (2004)"}], "bibs": ["Kahneman, D. & Tversky, A. (1979). Prospect theory: An analysis of decision under risk. Econometrica, 47(2), 263–291.", "Tversky, A. & Kahneman, D. (1992). Advances in prospect theory: Cumulative representation of uncertainty. Journal of Risk and Uncertainty, 5(4), 297–323.", "Quiggin, J. (1982). A theory of anticipated utility. Journal of Economic Behavior & Organization, 3(4), 323–343.", "Wu, G. & Gonzalez, R. (1996). Curvature of the probability weighting function. Management Science, 42(12), 1676–1690.", "Prelec, D. (1998). The probability weighting function. Econometrica, 66(3), 497–527.", "Hertwig, R., Barron, G., Weber, E. U. & Erev, I. (2004). Decisions from experience and the effect of rare events in risky choice. Psychological Science, 15(8), 534–539.", "Ruggeri, K. et al. (2020). Replicating patterns of prospect theory for decision under risk. Nature Human Behaviour, 4, 622–633."], "links": [{"id": "c1234f41916e3836cb5ae01d88b9ca953", "zh": "机会成本", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "c4b14f41916e3826fa2168136840ccead", "zh": "期望效用理论", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cf6c4f41916e382c7bf85010e9f5307c0", "slug": "coordination-game", "zh": "协调博弈", "en": "Coordination Game", "icon": null, "one": "参与者利益在“选择同一行动/标准”时更高的博弈类型，常用于解释标准制定、平台生态与组织协同。", "status": "complete", "rep": "yes", "repDetail": "焦点效应是最稳的实验发现之一：无沟通的纯协调任务中，被试达成一致的比率显著高于随机，且对「哪个选项显著」的判读跨人群高度一致（Schelling 1960 的原始演示，Mehta et al. 1994 的系统实验）。锁定效应也有历史案例支持（Arthur 1989）。理论争议在「锁定有多普遍」，不在机制是否存在。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["博弈论", "决策科学"], "context": ["组织管理", "沟通与说服", "决策"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["coordination game", "focal point", "多重均衡博弈", "标准博弈", "配合博弈"], "claims": [{"kind": "boundary", "body": "它与囚徒困境的差别在策略互补还是替代：协调博弈里「跟随对方」是最优的（大家选同一个就好），PD 里「背叛对方」才是最优的。混淆两者会导致完全相反的机制设计。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "核心困难不是「要不要合作」，而是「选哪个均衡」。无沟通时人靠显著性收敛——Schelling 的焦点（focal point）。实验显示纯协调任务的达成率远高于随机，且对「显著」的判读高度一致。", "basis": "literature", "src": "Schelling, T. C. (1960). The Strategy of Conflict. Harvard University Press；Mehta, J., Starmer, C. & Sugden, R. (1994). The nature of salience: an experimental investigation of pure coordination games. American Economic Review, 84(3), 658–673."}, {"kind": "boundary", "body": "收益不对称时协调与分配纠缠（性别战结构）：双方都想协调，但偏好不同的那个均衡。此时「我们能合作」与「合作对谁有利」是两个独立问题。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "标准竞争是它的特例：网络外部性 + 转换成本会造成赢家通吃与锁定，锁在次优标准是可能的（QWERTY 类故事）。所以「市场选了它」不等于「它更好」。", "basis": "literature", "src": "Katz, M. L. & Shapiro, C. (1985). Network externalities, competition, and compatibility. American Economic Review, 75(3), 424–440；Arthur, W. B. (1989). Competing technologies, increasing returns, and lock-in by historical events. Economic Journal, 99(394), 116–131."}, {"kind": "boundary", "body": "协调失败有真实宏观后果：银行挤兑与货币危机可以被建模为自我实现的均衡切换——基本面没变，只是所有人相信别人会跑。", "basis": "literature", "src": "Obstfeld, M. (1996). Models of currency crises with self-fulfilling features. European Economic Review, 40(3–5), 1037–1047."}, {"kind": "boundary", "body": "可用的协调装置：公开的共同知识（会议、公告）、降低选择集（默认项）、设定标准、让先动者承担成本。这些做的都是「让某一个均衡变成显然的那个」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「需要配合」的事都叫协调博弈。若一方多干对另一方有害（搭便车），那是公共品或 PD，不是协调。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「这是市场选择」为既成标准辩护。锁定与路径依赖意味着选择结果不反映优劣，只反映谁先到、谁的网络更大。", "basis": "definition", "src": ""}], "bibs": ["Schelling, T. C. (1960). The Strategy of Conflict. Harvard University Press.", "Mehta, J., Starmer, C. & Sugden, R. (1994). The nature of salience: an experimental investigation of pure coordination games. American Economic Review, 84(3), 658–673.", "Katz, M. L. & Shapiro, C. (1985). Network externalities, competition, and compatibility. American Economic Review, 75(3), 424–440.", "Arthur, W. B. (1989). Competing technologies, increasing returns, and lock-in by historical events. Economic Journal, 99(394), 116–131.", "Obstfeld, M. (1996). Models of currency crises with self-fulfilling features. European Economic Review, 40(3–5), 1037–1047."], "links": []}, {"id": "cad34f41916e3831ebab801c89fd3fea5", "slug": "antifragile", "zh": "反脆弱", "en": "Antifragile", "icon": null, "one": "某些系统不仅能承受波动与压力，还会从波动中受益；用于指导在不确定性下的结构与策略设计。", "status": "complete", "rep": "partial", "repDetail": "分两层看。数学层不可争议：凸收益对波动受益是 Jensen 不等式的直接推论，只要 f 与 X 定义清楚就是定理。生物层有实证支持（hormesis、运动适应、免疫训练），但严格剂量依赖。组织/社会层基本没有可复现证据，主要靠案例叙事，且与幸存者偏差纠缠——「经历危机后更强」无法与「弱者已被淘汰」区分。所以判 partial：内核成立，通俗版本不成立。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["决策科学", "经济学"], "context": ["风险管理", "决策", "组织管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["antifragility", "反脆弱性", "反脆弱结构", "杠铃策略"], "claims": [{"kind": "boundary", "body": "有严格内核：反脆弱 = 收益函数对波动呈凸性。由 Jensen 不等式，若 f 是凸的，则 E[f(X)] > f(E[X])，波动本身提高期望收益。Taleb 与 Douady 把它形式化为对压力变量的二阶导数符号：负为脆弱、零为稳健、正为反脆弱。这是它唯一可检验的部分。", "basis": "literature", "src": "Taleb, N. N. & Douady, R. (2013). Mathematical definition, mapping, and detection of (anti)fragility. Quantitative Finance, 13(11), 1677–1689."}, {"kind": "boundary", "body": "「反脆弱」不等于「坚韧」。坚韧（robust）是承受后不变，反脆弱是承受后变强。日常语言里两者几乎总被混用，但在决策上区别很大：稳健策略只求不被打死，反脆弱策略要求暴露在有利的不对称里。", "basis": "literature", "src": "Taleb, N. N. (2012). Antifragile: Things That Gain from Disorder. Random House."}, {"kind": "boundary", "body": "生物学里对应的机制是 hormesis（低剂量刺激产生适应性增强），有实证：运动造成的应激使肌肉与心血管更强、疫苗的低剂量暴露提升免疫。但它是剂量依赖的——同一刺激在剂量高时转为损伤。所以「压力使人变强」缺了剂量条件就是错的。", "basis": "literature", "src": "Calabrese, E. J. (2008). Hormesis: why it is important to toxicology and toxicologists. Environmental Toxicology and Chemistry, 27(7), 1451–1474."}, {"kind": "boundary", "body": "「什么没杀死我就让我更强」这句话有选择偏差：我们只能观察到活下来的系统。被波动摧毁的个体不再出现在样本里，所以幸存者看起来都「从波动中受益」。要区分反脆弱与幸存，必须看到分母。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "在组织与社会层面，这个概念的实证基础最弱：既没有公认的操作化指标，也难以做对照实验。「公司经历危机后更强」这类断言同时被幸存者偏差与事后归因污染。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "可操作的做法是改造暴露结构，不是加强意志：把下行截断（有限责任、止损、可逆决策）、把上行保留（小成本多试错、期权式投入）。杠铃策略就是这一条的通俗版——极端保守的底盘 + 少量极端冒险的探针，砍掉中间。", "basis": "literature", "src": "Taleb (2012)"}, {"kind": "misuse", "body": "拿来给「多受点苦有好处」背书。缺剂量与可恢复性条件时，压力造成的是损伤而非增强；创伤研究里多数人恢复、少数人成长、也有一部分人长期受损。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「熬过来了」都当反脆弱的证据。没被摧毁只证明稳健或幸运，不证明受益。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "在无法定义收益函数的系统里使用它。凸性需要能写出 f 与压力变量 X；写不出来时，「反脆弱」只是形容词。", "basis": "definition", "src": ""}], "bibs": ["Taleb, N. N. (2012). Antifragile: Things That Gain from Disorder. Random House.", "Taleb, N. N. & Douady, R. (2013). Mathematical definition, mapping, and detection of (anti)fragility. Quantitative Finance, 13(11), 1677–1689.", "Calabrese, E. J. (2008). Hormesis: why it is important to toxicology and toxicologists. Environmental Toxicology and Chemistry, 27(7), 1451–1474.", "Masten, A. S. (2001). Ordinary magic: Resilience processes in development. American Psychologist, 56(3), 227–238."], "links": []}, {"id": "c0d54f41916e3838cb70981c949edc541", "slug": "feedback-loop", "zh": "反馈回路（正反馈/负反馈）", "en": "Feedback Loop", "icon": null, "one": "系统中变量之间的相互作用形成闭环：正反馈放大变化，负反馈抑制变化并趋向稳定；用于理解动态行为与干预点。", "status": "complete", "rep": "yes", "repDetail": "作为结构机制，其定性行为在多个独立领域被反复验证：负反馈维持稳态（生理学，可定量）、正反馈导致发散（人口-资源、金融挤兑）、延迟导致振荡（控制工程、供应链牛鞭效应，Sterman 的实验用管理者和学生都复现了系统性误判）。需要注意这是「机制成立」而非「任何号称的回路成立」：具体某个回路是否闭合、增益多大，必须单独测。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["决策科学", "管理学"], "context": ["决策", "组织管理", "产品/增长", "风险管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["feedback", "反馈", "反馈环路", "增强回路", "正反馈", "调节回路", "负反馈"], "claims": [{"kind": "boundary", "body": "「正/负」指偏差的方向，不是价值判断。正反馈 = 放大偏差（deviation-amplifying），负反馈 = 抑制偏差（deviation-counteracting）。负反馈常被误读成「坏消息回路」，正反馈常被误读成「好事」，这层褒贬完全是语言污染。", "basis": "literature", "src": "Meadows, D. H. (2008). Thinking in Systems: A Primer. Chelsea Green，第 2 章；Forrester, J. W. (1961). Industrial Dynamics. MIT Press."}, {"kind": "boundary", "body": "闭环必须被证明，不能靠相似性断言。「A 与 B 相关」不构成回路；要成立必须给出 A→B→A 的因果链与时间顺序，并说明信号如何返回。多数「XX 循环」的图示其实只是两个相关变量加一支反向箭头。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "时滞是振荡的来源。负反馈加显著延迟会产生超调-回调的振荡，而不是平滑收敛；这正是库存-订货系统里「牛鞭效应」的机制：需求的小波动沿供应链放大成订单的大波动。", "basis": "literature", "src": "Sterman, J. D. (1989). Modeling managerial behavior: Misperceptions of feedback in a dynamic decision making experiment. Management Science, 35(3), 321–339."}, {"kind": "boundary", "body": "稳定性由环增益决定，不由「有没有反馈」决定。增益小于 1 时扰动衰减；大于 1 且带延迟时发散或持续振荡。所以「加强监管」这类干预若提高增益而不改延迟，可能把稳定系统推成振荡系统。", "basis": "literature", "src": "Åström, K. J. & Murray, R. M. (2008). Feedback Systems: An Introduction for Scientists and Engineers. Princeton University Press."}, {"kind": "boundary", "body": "生理稳态是最硬的经验证据：体温、血糖、渗透压都由负反馈维持，且可被定量建模（胰岛素-血糖环的延迟正是餐后血糖振荡的原因）。这不是隐喻，是可测的动态。", "basis": "literature", "src": "Guyton, A. C. & Hall, J. E. Textbook of Medical Physiology（血糖调节章节）；Åström & Murray (2008)"}, {"kind": "boundary", "body": "干预点不在「某个变量」而在回路结构：改增益（补贴/惩罚强度）、改延迟（信息提速）、改回路连接（切断某条反馈）、改信息可见性（让决策者看到自己造成的结果）。Meadows 的杠杆点排序里，改信息流比改参数更靠上。", "basis": "literature", "src": "Meadows, D. H. (1999). Leverage points: Places to intervene in a system. Whole Earth；Meadows (2008)"}, {"kind": "misuse", "body": "把任何循环论证都叫正反馈。「因为成功所以成功」若不指明具体机制与可测的增益，只是同义反复。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「负反馈」为「压制异议」辩护。那是社会过程，与系统稳定性无关；把控制论术语借去做修辞是典型的概念挪用。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "假设加了反馈就一定收敛。负反馈只有在增益与延迟满足条件时才稳定；很多政策失败正是因为忽略了延迟。", "basis": "literature", "src": "Sterman (1989)；Åström & Murray (2008)"}], "bibs": ["Forrester, J. W. (1961). Industrial Dynamics. MIT Press.", "Sterman, J. D. (1989). Modeling managerial behavior: Misperceptions of feedback in a dynamic decision making experiment. Management Science, 35(3), 321–339.", "Meadows, D. H. (1999). Leverage points: Places to intervene in a system. Whole Earth.", "Meadows, D. H. (2008). Thinking in Systems: A Primer. Chelsea Green.", "Åström, K. J. & Murray, R. M. (2008). Feedback Systems: An Introduction for Scientists and Engineers. Princeton University Press."], "links": []}, {"id": "c9a14f41916e38325b24d0176ac4a49b9", "slug": "goodharts-law", "zh": "古德哈特定律", "en": "Goodhart’s Law", "icon": null, "one": "当某个指标成为目标时，它就不再是好指标；因为人们会优化指标本身而扭曲其原本代表的真实目标。", "status": "complete", "rep": "partial", "repDetail": "现象在公共管理、教育、科研评价中有大量文档化案例，并已被形式化为四种机制；但多为案例研究，缺少「指标被设为目标→目标偏离」的对照实验，因此「多快失效、多严重」没有量化结论。", "checked": "2026-11-19", "nature": ["规律/经验法则"], "domain": ["经济学", "管理学", "决策科学"], "context": ["组织管理", "产品/增长", "决策"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["Campbell's law", "Goodhart's law", "坎贝尔定律", "指标腐化"], "claims": [{"kind": "boundary", "body": "原始表述是关于货币政策的，而且更精确：任何被观测到的统计规律，一旦被用于控制目的，就会趋于失效。流行的「指标成为目标就不再是好指标」是后来的简化版。", "basis": "literature", "src": "Goodhart, C. (1975) 的演讲；后由 Strathern, M. (1997) 简化为「when a measure becomes a target, it ceases to be a good measure」"}, {"kind": "boundary", "body": "它不是单一机制，至少四种：回归型（代理含噪声，选高分即选噪声）、极值型（超出观测范围后关系断裂）、因果型（共同原因被误读为干预点）、对抗型（被测量者主动博弈）。", "basis": "literature", "src": "Manheim, D. & Garrabrant, S. (2018). Categorizing Variants of Goodhart's Law. arXiv:1803.04585."}, {"kind": "boundary", "body": "其中只有回归型被认为不可避免：任何不精确的指标在尾部都会偏离目标；其余三种有触发条件，可以通过改指标设计或改变激励结构避免。", "basis": "literature", "src": "Manheim & Garrabrant (2018)"}, {"kind": "boundary", "body": "因果型最常见也最易被忽略：把相关当干预点，改动代理却不改动目标。这类失效与「有人作弊」无关，改指标也解决不了。", "basis": "literature", "src": "Manheim & Garrabrant (2018) 对四种变体的机制说明"}, {"kind": "boundary", "body": "案例横跨多个领域，但多为案例而非对照实验：英国 NHS 候诊时间指标、美国教育测验、警方记录的犯罪统计；世界银行 Doing Business 指数因排名异常于 2021 年停用。", "basis": "literature", "src": "Bevan, G. & Hood, C. (2006). What's measured is what matters: Targets and gaming in the English public health care system. Public Administration, 84(3), 517–538；Campbell, D. T. (1979)"}, {"kind": "misuse", "body": "用它否定一切量化。Goodhart 本人反对的是把统计量当作政策目标，不是反对统计分析；他批评的是 Thatcher 政府用货币总量定政策。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把所有指标失效都归为「对抗型腐化」。多数失效来自因果型与回归型，与作弊无关；只盯作弊会改错地方。", "basis": "definition", "src": ""}], "bibs": ["Goodhart, C. (1975). Problems of Monetary Management: The U.K. Experience.", "Manheim, D. & Garrabrant, S. (2018). Categorizing Variants of Goodhart's Law. arXiv:1803.04585.", "Bevan, G. & Hood, C. (2006). Public Administration, 84(3), 517–538.", "Campbell, D. T. (1979). Assessing the impact of planned social change."], "links": [{"id": "cb474f41916e38212a2aa01cee9a18667", "zh": "坎贝尔定律", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cad74f41916e382319b2901326be0d420", "slug": "availability-heuristic", "zh": "可得性启发式", "en": "Availability Heuristic", "icon": null, "one": "人们倾向用“例子在脑中出现的容易程度”来判断概率或重要性，从而高估更生动、更近期、更常被提及事件的发生率。", "status": "complete", "rep": "partial", "repDetail": "方向复现但效应量严重衰减（d 从 0.82 降至 0.09）。作为「存在的机制」成立，作为「强效应」不成立；引用时不应再使用原始论文的效应量。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["心理学", "决策科学"], "context": ["决策", "风险管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["availability bias", "可得性偏差", "可获得性启发式", "易得性启发式"], "claims": [{"kind": "boundary", "body": "经典演示的效应量在复现中大幅缩水：Many Labs 3（20 个样本池加在线样本，总样本约 3400）中原始效应 d=0.82［0.47, 1.17］，复现 d=0.09［0.02, 0.16］。方向一致，量级相差近九倍。", "basis": "literature", "src": "Ebersole, C. R. et al. (2016). Many Labs 3. JESP, 67, 68–82；效应量对比见该项目公开评审记录"}, {"kind": "boundary", "body": "不等于「生动的信息更有说服力」。机制是提取的难易程度，生动性只是影响提取难易的因素之一；信息生动但难以提取时，效应可以反向。", "basis": "definition", "src": "—"}, {"kind": "boundary", "body": "「想起的例子越多，判断的频率越高」不总成立：决定判断的是提取的难易，而难易与数量可以脱钩——被要求举出很多例子时，提取变难，频率判断反而下降。", "basis": "definition", "src": "—"}, {"kind": "boundary", "body": "与「可及性（accessibility）」不是同一层：可及性是记忆被激活的难易，是输入变量；可得性启发式是用这个难易度替代概率判断的策略。", "basis": "definition", "src": "—"}, {"kind": "misuse", "body": "把「我能想起很多例子」当成「这类事很常见」。你的样本来自记忆可达性，不是随机抽样——这两者的差别正是这个偏误本身。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它与确认偏误混用。可得性影响「频率估计」，确认偏误影响「证据搜寻与解释方向」；两者可叠加但机制不同。", "basis": "definition", "src": ""}], "bibs": ["Tversky, A. & Kahneman, D. (1973). Availability: A heuristic for judging frequency and probability. Cognitive Psychology, 5(2), 207–232.", "Tversky, A. & Kahneman, D. (1974). Judgment under uncertainty: Heuristics and biases. Science, 185, 1124–1131.", "Ebersole, C. R. et al. (2016). Many Labs 3. JESP, 67, 68–82."], "links": [{"id": "c24a4f41916e3832897e08160a0583c32", "zh": "可获性层叠", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c24a4f41916e3832897e08160a0583c32", "slug": "availability-cascade", "zh": "可获性层叠", "en": "Availability Cascade", "icon": null, "one": "某个观点因在公共讨论中被反复提及与转述而变得“更容易想起”，进而看起来更可信并被更多人附和，形成自我强化的集体信念循环。", "status": "complete", "rep": "partial", "repDetail": "必须分层：①可获性启发式有稳固实验证据（字母位置判断等经典任务，方向明确、多次复现）；②信息级联有理论与实验支持（Banerjee 1992；Bikhchandani et al. 1992）；③但「可获性层叠」这个复合体（媒体—公众—监管正反馈）几乎没有系统实证，主要靠案例叙事，且难以与「真实风险上升」区分。判 partial：成分成立，整体未验证。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "社会学", "决策科学"], "context": ["批判性思维", "决策", "风险管理", "沟通与说服"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["availability cascade", "可得性层叠", "可获性级联", "舆论级联"], "claims": [{"kind": "boundary", "body": "它是两个机制的复合：可获性启发式（越容易想起 → 判断为越常见/越可能）+ 声誉级联（公开表态的收益随他人表态增加）。单有前者是个体偏差，单有后者是信息级联；「层叠」要求两者互相供能。", "basis": "literature", "src": "Kuran, T. & Sunstein, C. R. (1999). Availability cascades and risk regulation. Stanford Law Review, 51(4), 683–768."}, {"kind": "boundary", "body": "可获性启发式本身有实验支持，但证据形态是「特定判断任务」而非「普遍效应」：字母位置判断里，人们认为以 K 开头的英文词多于第三字母为 K 的词，而实际相反——这直接证明判断被检索难易度而非频次驱动。", "basis": "literature", "src": "Tversky, A. & Kahneman, D. (1973). Availability: A heuristic for judging frequency and probability. Cognitive Psychology, 5(2), 207–232."}, {"kind": "boundary", "body": "「层叠」作为整体几乎没有系统实证。它是关于媒体-公众-监管三方正反馈的理论叙事，证据以案例为主（如风险恐慌的兴起与消退）。核心困难是识别：媒体报道增多也可能因为事件真的变多，「层叠」与「风险上升」在数据上难以分离。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "可检验的推论有一条可用：若层叠存在，媒体覆盖率应比客观频次更能预测公众的风险判断。这一方向有支持——报道频率能预测人们把某类死因排得多靠前，而实际死亡率不能。", "basis": "literature", "src": "Combs, B. & Slovic, P. (1979). Newspaper coverage of causes of death. Journalism Quarterly, 56(4), 837–843."}, {"kind": "boundary", "body": "层叠会自我耗尽。公众注意力有饱和点，过度曝光会引发疲劳与怀疑；且当权威统计信息被广泛提供时，可获性效应减弱。所以「越传越信」不是无限正反馈，而是有衰减的。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "它与「回音室」「道德恐慌」部分重叠但不等同：回音室强调同质信息的封闭循环，道德恐慌强调道德越界的集体反应，可获性层叠强调「认知可及性 → 可信度」这条通路。三者常同时发生，但解释对象不同。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用「可获性层叠」否定任何公共关切（「你们只是被媒体带节奏」）。真实风险上升与层叠在观察上相似，断言需要数据。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它当已证实的机制引用。复合机制的整体缺乏系统检验，只有成分证据与案例。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它与「多数人相信所以是真的/假的」混同。层叠描述的是信念传播机制，不评判内容真假。", "basis": "definition", "src": ""}], "bibs": ["Tversky, A. & Kahneman, D. (1973). Availability: A heuristic for judging frequency and probability. Cognitive Psychology, 5(2), 207–232.", "Combs, B. & Slovic, P. (1979). Newspaper coverage of causes of death. Journalism Quarterly, 56(4), 837–843.", "Bikhchandani, S., Hirshleifer, D. & Welch, I. (1992). A theory of fads, fashion, custom, and cultural change as informational cascades. Journal of Political Economy, 100(5), 992–1026.", "Kuran, T. & Sunstein, C. R. (1999). Availability cascades and risk regulation. Stanford Law Review, 51(4), 683–768."], "links": [{"id": "c8784f41916e3830e9aac0134776302fc", "zh": "群体思维", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "cad74f41916e382319b2901326be0d420", "zh": "可得性启发式", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "cdcf4f41916e3831d9c6c01b36569d8ce", "zh": "从众效应", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c45f4f41916e383bd91e801d7ce5b511b", "slug": "replication-crisis", "zh": "可重复性危机", "en": "Replication Crisis", "icon": null, "one": "大量已发表研究在重复实验或更大样本下难以复现，暴露出发表偏倚、p-hacking、低统计功效等系统问题。", "status": "complete", "rep": "yes", "repDetail": "这是关于「复现率」本身的大规模实证，且被多个独立项目在不同领域验证：心理学 39%（OSC 2015）、社会科学 61.9%（Camerer et al. 2018）、经济学 61%（Camerer et al. 2016）、癌症临床前研究透明度极低（Errington et al. 2021）。各领域复现率差异明显，但「已发表效应量被高估」这一方向一致。", "checked": "2026-11-19", "nature": ["效应/现象"], "domain": ["心理学", "数学/统计", "决策科学"], "context": ["学习/研究", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["replicability crisis", "reproducibility crisis", "复现危机", "复现性危机", "重复性危机"], "claims": [{"kind": "boundary", "body": "规模可量化：OSC 重复 100 项心理学研究，36% 得到显著结果（原始研究为 97%），自评复现 39%，复现效应量约为原始的一半（r 0.197 vs 0.403）。", "basis": "literature", "src": "Open Science Collaboration (2015). Estimating the reproducibility of psychological science. Science, 349(6251), aac4716."}, {"kind": "boundary", "body": "顶级期刊也不例外：Nature / Science 2010–2015 的 21 项社会科学实验，13 项（61.9%）复现；成功复现的效应量约为原始的 75%，失败的接近零。", "basis": "literature", "src": "Camerer, C. F. et al. (2018). Evaluating the replicability of social science experiments in Nature and Science between 2010 and 2015. Nature Human Behaviour, 2, 637–644."}, {"kind": "boundary", "body": "「复现不了」不等于「造假」：主因是低统计功效、分析自由度、选择性报告与发表偏倚，不是学术不端。把复现失败读成诚信问题是这一类讨论里最常见的误读。", "basis": "literature", "src": "Button et al. (2013)；Simmons, Nelson & Simonsohn (2011)；Open Science Collaboration (2015)"}, {"kind": "boundary", "body": "癌症生物学项目的真正障碍是透明度，而非效应本身：193 个实验中只有 4 个的原始数据可公开获取，最终只完成 50 个；没有一篇的方法描述足以直接照做。", "basis": "literature", "src": "Errington, T. M., Denis, A., Perfito, N., Iorns, E. & Nosek, B. A. (2021). Challenges for assessing replicability in preclinical cancer biology. eLife, 10, e67995."}, {"kind": "boundary", "body": "39% 不能外推到所有学科：经济学实验约 61%，社会科学 62%，癌症临床前研究更低。跨领域直接套用这个数字，是把一个领域的结果当成普遍常数。", "basis": "literature", "src": "Camerer, C. F. et al. (2016). Evaluating replicability of laboratory experiments in economics. Science, 351(6280), 1433–1436；Camerer et al. (2018)"}, {"kind": "boundary", "body": "危机催生了可操作的制度修复：预注册、注册报告、多实验室复现、数据与代码公开。这些不是姿态，而是直接改变「显著才发表」的激励结构。", "basis": "literature", "src": "Nosek, B. A., Ebersole, C. R., DeHaven, A. C. & Mellor, D. T. (2018). The preregistration revolution. PNAS, 115(11), 2600–2606；Chambers, C. D. (2013). Registered reports: a new publishing initiative at Cortex. Cortex, 49(3), 609–610."}, {"kind": "boundary", "body": "它没有证明「科学失效」。它证明的是：在特定激励与统计惯例下，已发表效应的期望值被系统性高估——这是对推断流程的诊断，不是对科学方法的否定。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它一次性否定整个学科或所有论文。复现率是领域平均值，个体研究仍要看证据强度、样本量与预注册情况。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把单项复现失败当作原研究造假的证据。复现研究本身也可能功效不足、操作偏离或情境不同。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它当成「心理学才有的问题」。经济学、癌症生物学、社会科学都有对应项目，只是复现率不同。", "basis": "definition", "src": ""}], "bibs": ["Open Science Collaboration (2015). Estimating the reproducibility of psychological science. Science, 349(6251), aac4716.", "Camerer, C. F. et al. (2018). Evaluating the replicability of social science experiments in Nature and Science between 2010 and 2015. Nature Human Behaviour, 2, 637–644.", "Camerer, C. F. et al. (2016). Evaluating replicability of laboratory experiments in economics. Science, 351(6280), 1433–1436.", "Errington, T. M., Denis, A., Perfito, N., Iorns, E. & Nosek, B. A. (2021). Challenges for assessing replicability in preclinical cancer biology. eLife, 10, e67995.", "Ioannidis, J. P. A. (2005). Why most published research findings are false. PLoS Medicine, 2(8), e124.", "Nosek, B. A., Ebersole, C. R., DeHaven, A. C. & Mellor, D. T. (2018). The preregistration revolution. PNAS, 115(11), 2600–2606."], "links": []}, {"id": "ce964f41916e383e48bec81fb7c66c862", "slug": "hindsight-bias", "zh": "后见之明偏差", "en": "Hindsight Bias", "icon": null, "one": "事情发生后会觉得“早就知道会这样”，从而高估事前可预测性，影响复盘与学习。", "status": "complete", "rep": "partial", "repDetail": "元分析 d=0.39 支持存在，但 2025 年预注册复现仅得 d=0.12 且组间无可靠差异。各成分（记忆扭曲/必然性/可预见性）复现情况不同，不宜当作单一稳健效应。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["决策", "学习/研究", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["creeping determinism", "knew-it-all-along effect", "事后聪明偏差", "我早知道效应", "渐增决定论"], "claims": [{"kind": "boundary", "body": "至少包含三个可分离成分：记忆扭曲（错误记得自己当时的判断）、必然性（觉得结果只能如此）、可预见性（觉得自己本可预判）。三者可单独出现，单一「后见偏差分数」会掩盖性质完全不同的问题。", "basis": "literature", "src": "Roese, N. J. & Vohs, K. D. (2012). Hindsight bias. Perspectives on Psychological Science, 7(5), 411–426；Blank, H. et al. (2008) 关于成分部分独立的论证"}, {"kind": "boundary", "body": "总体效应中等：95 项研究、252 个效应量的元分析得 d=0.39（95% 区间 0.36–0.42）；百科知识题上的效应大于真实事件与案例史。", "basis": "literature", "src": "Guilbault, R. L. et al. (2004). A meta-analysis of research on hindsight bias. Basic and Applied Social Psychology, 26(2), 103–117."}, {"kind": "boundary", "body": "复现性存在实质疑问：2025 年对 Fischhoff 第二个实验的预注册复现（431 人，巴西）未发现后见组与前见组的可靠差异，整体效应仅 d=0.12。", "basis": "literature", "src": "Seda, L. et al. (2025). 预印本，圣保罗大学；未同行评审"}, {"kind": "boundary", "body": "专家身份、追求准确的动机、被告知存在此偏差，都不能消除它。有效的是程序：强制重建「当时同样合理的其他结果」，以及保留事前书面记录。", "basis": "literature", "src": "Roese & Vohs (2012) 对干预研究的综述"}, {"kind": "boundary", "body": "不等于结果偏差（outcome bias）：结果偏差是拿结果好坏评价决策质量；后见偏差是重估事前概率与自己当时的判断。", "basis": "literature", "src": "Baron, J. & Hershey, J. C. (1988) 对 outcome bias 的界定，与 hindsight bias 的概念对照"}, {"kind": "boundary", "body": "不等于知识诅咒（curse of knowledge）：后者是难以忽略自己已知的信息去推测他人所知，对象是他人的心智；前者是对自己过去估计的重建污染。", "basis": "literature", "src": "概念对照，见 Roese & Vohs (2012) 与 Camerer, Loewenstein & Weber (1989)"}, {"kind": "misuse", "body": "把「现在看着显然」当作「当时确实可预见」的证据。真诚而自信的「我早知道」恰恰是污染已经发生的迹象，不是事前知识的证明。", "basis": "definition", "src": ""}], "bibs": ["Fischhoff, B. (1975). Hindsight is not equal to foresight. Journal of Experimental Psychology: Human Perception and Performance, 1(3), 288–299.", "Fischhoff, B. & Beyth, R. (1975). I knew it would happen. Organizational Behavior and Human Performance, 13(1), 1–16.", "Roese, N. J. & Vohs, K. D. (2012). Perspectives on Psychological Science, 7(5), 411–426.", "Guilbault, R. L. et al. (2004). Basic and Applied Social Psychology, 26(2), 103–117."], "links": []}, {"id": "cfba4f41916e3826ebfaa81d8f0285738", "slug": "godels-second-incompleteness-theorem", "zh": "哥德尔第二不完备定理", "en": "Gödel’s Second Incompleteness Theorem", "icon": null, "one": "在足够强且可有效公理化的一致形式系统中，系统无法在自身内部证明自身一致性。", "status": "draft", "rep": "n/a", "repDetail": "它是已证明的数学定理，不存在复现问题。可核验的是它的形式化证明已被机器检验（Coq、Isabelle 等证明助手中已有完整形式化），以及它的推论在具体系统中被实例化（PA、ZFC 的一致性不可在自身内证）。需要区分的是：定理本身确定无疑，围绕它的哲学外推（心智、理性极限）则争议很大，属解释而非定理。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["数学/统计", "哲学"], "context": ["学习/研究", "批判性思维"], "epistemic": ["形式/分析（Formal / Analytic）"], "aliases": ["Gödel's second incompleteness theorem", "一致性不可自证", "哥德尔第二定理", "第二不完备定理"], "claims": [{"kind": "boundary", "body": "三个前提缺一不可：①足够强（能表示基本算术，Robinson 算术 Q 就够）；②可有效公理化（公理集可被算法判定）；③一致。若系统不一致，则一切命题都可证，定理变成空洞的真。抛掉任一条件，定理不适用。", "basis": "literature", "src": "Gödel, K. (1931). Über formal unentscheidbare Sätze der Principia Mathematica und verwandter Systeme I. Monatshefte für Mathematik und Physik, 38, 173–198."}, {"kind": "boundary", "body": "第二定理不等于第一定理。第一：存在既不可证也不可反驳的命题（不完备）。第二：系统不能在自身内部证明自身一致性（Con(PA) 不可在 PA 内证）。第二定理的证明方式是把第一定理的形式化版本在系统内表达出来，但两者说的是不同的事。日常引用几乎总把它们混成一句。", "basis": "literature", "src": "Gödel (1931)；Smoryński, C. (1977). The incompleteness theorems. In Handbook of Mathematical Logic."}, {"kind": "boundary", "body": "它不阻止「用更强的手段证明一致性」。Gentzen (1936) 用超限归纳到 ε₀ 证明了皮亚诺算术的一致性——代价是所用的归纳原则超出 PA 本身。所以定理说的是「不能自证」，不是「不能证」。", "basis": "literature", "src": "Gentzen, G. (1936). Die Widerspruchsfreiheit der reinen Zahlentheorie. Mathematische Annalen, 112, 493–565."}, {"kind": "boundary", "body": "不能推广到经验科学、法律、道德或「任何系统」。定理的适用范围是能表达算术的形式系统；物理理论、社会制度没有「在自身内部证明自身一致性」这个操作，类比无对象。这是最高频的越界。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "Lucas–Penrose 式论证（人心能看出系统一致，故人心非机器）在哲学上有争议且未被接受为定理推论：它依赖「人心的一致性可被可靠地知道」这一未经证明的前提，且对「机器」的定义极为狭窄。把它当作哥德尔定理的结论是误读。", "basis": "literature", "src": "Lucas, J. R. (1961). Minds, machines and Gödel. Philosophy, 36(137), 112–127；Penrose, R. (1989). The Emperor's New Mind. Oxford University Press；批评见 Putnam, H. (1960). Minds and machines."}, {"kind": "boundary", "body": "它的正面后果是具体的：终结希尔伯特纲领（用有穷方法证明全部数学一致性）；催生证明论与可计算性理论；给出「可证性逻辑」这一独立研究对象。它不是一个关于「理性极限」的悲观格言，而是一条有精确条件的技术定理。", "basis": "literature", "src": "Hilbert, D. (1926). Über das Unendliche. Mathematische Annalen, 95, 161–190；Boolos, G. (1993). The Logic of Provability. Cambridge University Press."}, {"kind": "misuse", "body": "用它论证「任何系统都不完备」「科学终有不可知」。「系统」在定理里指满足三条件的形式系统，不是任何东西。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把第二定理说成「数学不能证明自己的正确性，所以数学不可靠」。一致性不可自证不等于不可靠；数学的可靠性由证明实践与交叉检验维持，不靠自证。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "引用它来支持「人心超越算法」。这是哲学立场（Lucas–Penrose），不是定理内容；该论证在学界仍有实质争议。", "basis": "literature", "src": "Lucas (1961)；Penrose (1989)；Putnam (1960)"}], "bibs": ["Gödel, K. (1931). Über formal unentscheidbare Sätze der Principia Mathematica und verwandter Systeme I. Monatshefte für Mathematik und Physik, 38, 173–198.", "Gentzen, G. (1936). Die Widerspruchsfreiheit der reinen Zahlentheorie. Mathematische Annalen, 112, 493–565.", "Hilbert, D. (1926). Über das Unendliche. Mathematische Annalen, 95, 161–190.", "Smoryński, C. (1977). The incompleteness theorems. In Handbook of Mathematical Logic. North-Holland.", "Boolos, G. (1993). The Logic of Provability. Cambridge University Press.", "Lucas, J. R. (1961). Minds, machines and Gödel. Philosophy, 36(137), 112–127.", "Penrose, R. (1989). The Emperor's New Mind. Oxford University Press."], "links": []}, {"id": "cfa14f41916e3839ba33e811128e2d270", "slug": "prisoners-dilemma", "zh": "囚徒困境", "en": "Prisoner’s Dilemma", "icon": null, "one": "个体理性选择会导向集体非最优结果的经典博弈模型，用来解释合作为何困难以及如何被机制改善。", "status": "complete", "rep": "partial", "repDetail": "结构层成立且稳定：占优策略、逆向归纳、贴现因子支撑合作，都是定理。但行为层与理论不符且方向一致——一次性实验中三到五成人选择合作（Sally 1995 元分析），而不是理论预测的接近零。所以「人会按 PD 的理性预测行事」这一强版本不成立；成立的是「结构会制造这个张力」。", "checked": "2026-11-19", "nature": ["模型/框架/启发式"], "domain": ["博弈论", "决策科学", "经济学"], "context": ["决策", "沟通与说服", "组织管理"], "epistemic": ["构建/建模（Constructed / Model-based）"], "aliases": ["PD 博弈", "prisoner's dilemma", "social dilemma", "囚徒两难", "社会困境"], "claims": [{"kind": "boundary", "body": "严格定义要求「背叛」是严格占优策略，且这与「人是否自私」无关：即使双方都更想要合作结果，只要没有约束机制，单方面背叛仍然更划算。利他偏好改变的是收益数字，不是结构。", "basis": "literature", "src": "Axelrod, R. (1984). The Evolution of Cooperation. Basic Books."}, {"kind": "boundary", "body": "有限次重复且完全理性时，逆向归纳会让合作在最后一期瓦解，并逐期向前传染到第一期——「反正最后一轮要背叛」的逻辑吃掉整条链。这是理论预测，不是观察结论。", "basis": "literature", "src": "Luce, R. D. & Raiffa, H. (1957). Games and Decisions. Wiley；Kreps, D., Milgrom, P., Roberts, J. & Wilson, R. (1982). Rational cooperation in the finitely repeated prisoners' dilemma. Journal of Economic Theory, 27(2), 245–252."}, {"kind": "boundary", "body": "关键变量不是「重复次数」，而是「未来有多重要」。只要贴现因子足够高（或终点不确定），以牙还牙、冷酷触发这类策略可以支撑合作成为子博弈精炼均衡。", "basis": "literature", "src": "Friedman, J. (1971). A non-cooperative equilibrium for supergames. Review of Economic Studies, 38(1), 1–12；Axelrod (1984)"}, {"kind": "boundary", "body": "Axelrod 竞赛的结论常被简化成「以牙还牙最优」。更准确的读法是：在噪声环境下以牙还牙会被「永远背叛」拖死，而「赢则保持、输则改变」（win-stay, lose-shift）表现更稳。策略优劣依赖环境有没有误判。", "basis": "literature", "src": "Nowak, M. & Sigmund, K. (1993). A strategy of win-stay, lose-shift that outperforms tit-for-tat in the Prisoner's Dilemma game. Nature, 364, 56–58."}, {"kind": "boundary", "body": "一次性实验里人并不像理论那样全背叛：跨 1958–1992 的实验元分析显示一次性社会困境中的合作率大致在三到五成，远高于纳什均衡预测的零。所以它更像「结构预测」而非「行为预测」。", "basis": "literature", "src": "Sally, D. (1995). Conversation and cooperation in social dilemmas: a meta-analysis of experiments from 1958 to 1992. Rationality and Society, 7(1), 58–92."}, {"kind": "boundary", "body": "四种可操作的破解手段：把一次性变重复、提高透明度、允许惩罚、直接改收益矩阵（补贴/罚金）。前三条改变信息与时间结构，第四条改变支付——机制设计就是在这四处动手。", "basis": "literature", "src": "Axelrod (1984)；Ostrom, E. (1990). Governing the Commons. Cambridge University Press."}, {"kind": "misuse", "body": "把它当「合作不可能」的证明。它证明的是特定收益结构下个体理性导致帕累托劣结果；结构一改，结果就变。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「双方都不肯让步」都叫囚徒困境。若一方让步对另一方没好处、或双方偏好本就不同，那不是 PD，是谈判或纯冲突。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "忽略「一次性 vs 长期」这个前提就直接推论。PD 的悲观结论几乎全部依赖一次性与不可惩罚；长期关系里它是另一道题。", "basis": "definition", "src": ""}], "bibs": ["Axelrod, R. (1984). The Evolution of Cooperation. Basic Books.", "Axelrod, R. & Hamilton, W. D. (1981). The evolution of cooperation. Science, 211(4489), 1390–1396.", "Luce, R. D. & Raiffa, H. (1957). Games and Decisions. Wiley.", "Kreps, D., Milgrom, P., Roberts, J. & Wilson, R. (1982). Rational cooperation in the finitely repeated prisoners' dilemma. Journal of Economic Theory, 27(2), 245–252.", "Nowak, M. & Sigmund, K. (1993). A strategy of win-stay, lose-shift that outperforms tit-for-tat in the Prisoner's Dilemma game. Nature, 364, 56–58.", "Sally, D. (1995). Conversation and cooperation in social dilemmas: a meta-analysis of experiments from 1958 to 1992. Rationality and Society, 7(1), 58–92.", "Ostrom, E. (1990). Governing the Commons: The Evolution of Institutions for Collective Action. Cambridge University Press."], "links": [{"id": "c3224f41916e3830bbf4c81c47e699f4e", "zh": "纳什均衡", "type": "untyped", "bridge": "", "boundary": ""}, {"id": "ccdb4f41916e38349a29a01f83d130c09", "zh": "马太效应", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "c4a24f41916e3820ca958818ecc657290", "slug": "regression-to-the-mean", "zh": "回归均值", "en": "Regression to the Mean", "icon": null, "one": "在存在随机波动时，极端表现往往会在后续观测中更接近平均水平；若忽略这一点容易误把自然波动当作干预效果。", "status": "complete", "rep": "yes", "repDetail": "统计上必然（ρ<1 时数学成立），机制清楚、无争议；真实数据中反复留下痕迹（「体育画报封面魔咒」、极端组前后测的虚假疗效、教练反馈的错觉）。争议不在现象，而在「某次回落里有多少是回归、多少是真实效应」——这需要对照组才能拆开。", "checked": "2026-11-19", "nature": ["基础概念/定义"], "domain": ["数学/统计", "决策科学"], "context": ["批判性思维", "学习/研究", "决策"], "epistemic": ["形式/分析（Formal / Analytic）"], "aliases": ["RTM", "regression toward the mean", "向均值回归", "回归效应", "均值回归"], "claims": [{"kind": "boundary", "body": "它是统计必然，不是某种「力」：两次测量不完全相关（ρ<1）时，极端值的期望后续值必然更靠近均值，回归量约为 (1-ρ)(x₁-μ)。所以「回到平均」是可算的，不是玄学。", "basis": "literature", "src": "Barnett, A. G., van der Pols, J. C. & Dobson, A. J. (2005). Regression to the mean: what it is and how to deal with it. International Journal of Epidemiology, 34(1), 215–220."}, {"kind": "boundary", "body": "触发条件是「按极端值选人」加「重复测量含随机成分」。两者缺一，回归均值就不会冒充干预效果：随机抽样、或不按极端值分组的对照设计，基本不受它影响。", "basis": "literature", "src": "Barnett et al. (2005)"}, {"kind": "boundary", "body": "单组前后测无法区分回归均值与干预效应：在极端组里，即使什么都不做，后测也会向均值移动。需要对照组，或用多次基线测量 + ANCOVA 把基线当协变量。", "basis": "literature", "src": "Barnett et al. (2005)（建议至少两次基线测量，或以基线为协变量的方差分析）"}, {"kind": "boundary", "body": "波动来源不必是「测量误差」：真实情境波动（状态、对手、天气、季节）同样造成不完全相关，同样触发回归。这一点常被忽略，导致把「仪器不准」当成唯一条件。", "basis": "literature", "src": "Barnett et al. (2005)"}, {"kind": "boundary", "body": "它是选择偏差的一个特例：按结果选样本，等于条件于一个与结果相关的变量。所以「挑出最差的一批人来干预」这个设计本身就制造了回归。", "basis": "literature", "src": "Elwert & Winship (2014). Endogenous selection bias. Annual Review of Sociology, 40, 31–53."}, {"kind": "boundary", "body": "它是高尔顿在研究身高遗传时发现的，原名「向平庸回归」。名字里的「回归」来自这里，与今天的「回归分析」是同一个词源，但那只是历史巧合，不代表回归模型必然产生回归均值。", "basis": "literature", "src": "Galton, F. (1886). Regression towards mediocrity in hereditary stature. Journal of the Anthropological Institute, 15, 246–263."}, {"kind": "misuse", "body": "把一切极端值回落都归给回归均值。若真有干预、真有因果，回落里可能同时含真实效应——它是「至少要扣掉多少」的下限，不是「全部都是假的」的判决。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "在绩效评估里把「去年最差的人今年变好」当成培训有效。卡尼曼记录过飞行教员的相反直觉：被表扬后变差、被批评后变好，其实都是回归均值。", "basis": "literature", "src": "Kahneman, D. (2011). Thinking, Fast and Slow. Farrar, Straus and Giroux."}, {"kind": "misuse", "body": "认为它只在「仪器不准」时发生。真实波动同样触发，且更难察觉。", "basis": "definition", "src": ""}], "bibs": ["Barnett, A. G., van der Pols, J. C. & Dobson, A. J. (2005). Regression to the mean: what it is and how to deal with it. International Journal of Epidemiology, 34(1), 215–220.", "Galton, F. (1886). Regression towards mediocrity in hereditary stature. Journal of the Anthropological Institute, 15, 246–263.", "Kahneman, D. (2011). Thinking, Fast and Slow. Farrar, Straus and Giroux.", "Elwert, F. & Winship, C. (2014). Endogenous selection bias: the problem of conditioning on a collider variable. Annual Review of Sociology, 40, 31–53."], "links": []}, {"id": "cb474f41916e38212a2aa01cee9a18667", "slug": "campbells-law", "zh": "坎贝尔定律", "en": "Campbell’s Law", "icon": null, "one": "量化社会指标被用于决策时，越容易受到操纵与腐蚀，从而扭曲被监测过程；是对“指标治理”副作用的警示。", "status": "complete", "rep": "partial", "repDetail": "机制层有多案例的量化支持：教师作弊率（Jacob & Levitt 2003 的可检测估计约 4%–5%，且集中于低绩效学校）、NHS 目标下的停表操作、金融销售的账户造假，都符合「高权重 + 可操纵 + 不可核验」三条件同时成立的结构。但它作为「定律」不可证伪——任何指标失灵都能追认为它的例证，缺少「有指标但未被腐蚀」的对照。所以判 partial：条件性经验规律成立，普适定律的地位不成立。", "checked": "2026-11-19", "nature": ["规律/经验法则"], "domain": ["社会学", "管理学", "决策科学"], "context": ["组织管理", "产品/增长", "决策"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["Campbell's law", "坎贝尔法则", "指标治理反噬", "指标腐蚀"], "claims": [{"kind": "boundary", "body": "原始表述比流行版更精确：「任何量化社会指标，越是用于社会决策，就越容易受到腐蚀压力，越容易扭曲并腐化它本应监测的社会过程。」关键词是「用于决策」与「腐化过程」——不只是数字造假，而是行为本身被改变。", "basis": "literature", "src": "Campbell, D. T. (1979). Assessing the impact of planned social change. Evaluation and Program Planning, 2(1), 67–90."}, {"kind": "boundary", "body": "与 Goodhart 定律不完全相同。Goodhart 强调「指标一旦成为目标，就不再是好指标」（统计效力失效）；坎贝尔强调「社会过程本身被扭曲」（实质后果）。前者是测量问题，后者是行为问题，常被混用。", "basis": "literature", "src": "Goodhart, C. (1975). Problems of monetary management: The U.K. experience；Campbell (1979)；Bevan, G. & Hood, C. (2006). What's measured is what matters. Public Administration, 84(3), 517–538."}, {"kind": "boundary", "body": "机制清晰且可预测：指标成为目标 → 优化指标而非目标 → 代理变量失效。它不是「人性贪婪」的泛论，而是代理指标与被代理目标之间可分离时必然出现的套利。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "有量化证据的案例：芝加哥公立学校在高风险考试下，约 4%–5% 的班级存在可检测的作弊，集中在低绩效学校；英国 NHS 的等待时间目标催生「停表」操作；某银行零售部门的账户开立丑闻是同一结构的商业版本。", "basis": "literature", "src": "Jacob, B. A. & Levitt, S. D. (2003). Rotten apples: An investigation of the prevalence and predictors of teacher cheating. Quarterly Journal of Economics, 118(3), 843–877；Bevan & Hood (2006)"}, {"kind": "boundary", "body": "它不是无条件的。三个条件同时成立时最严重：指标权重高、被考核者能影响指标、指标不能被独立核验。有独立审计、随机抽查或第三方复核时，腐蚀显著减弱——这在教育问责与医疗监管的比较研究里都能看到。", "basis": "literature", "src": "Bevan & Hood (2006)；Jacob & Levitt (2003)"}, {"kind": "boundary", "body": "反面同样成立：取消度量不会消除问题，只会把责任变成不可见。可行方向是多指标组合、独立核验、定期更换指标口径、并保留质性评估——而不是「不用指标」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它否定一切量化管理。定律说的是「有条件的腐蚀压力」，不是「指标必然失效」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把它当不可证伪的宿命论。任何指标失灵都能归因于它，这使它容易变成事后解释；有效用法是事前预测「哪一类指标会被怎样套利」。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "只盯数字造假。坎贝尔的重点是行为被扭曲（只教考的、只收轻症、只挑好客户），那比改数字更隐蔽也更难纠正。", "basis": "definition", "src": ""}], "bibs": ["Campbell, D. T. (1979). Assessing the impact of planned social change. Evaluation and Program Planning, 2(1), 67–90.", "Goodhart, C. (1975). Problems of monetary management: The U.K. experience. Reserve Bank of Australia.", "Jacob, B. A. & Levitt, S. D. (2003). Rotten apples: An investigation of the prevalence and predictors of teacher cheating. Quarterly Journal of Economics, 118(3), 843–877.", "Bevan, G. & Hood, C. (2006). What's measured is what matters: Targets and gaming in the English public health care system. Public Administration, 84(3), 517–538.", "Muller, J. Z. (2018). The Tyranny of Metrics. Princeton University Press."], "links": [{"id": "c9a14f41916e38325b24d0176ac4a49b9", "zh": "古德哈特定律", "type": "untyped", "bridge": "", "boundary": ""}]}, {"id": "cd064f41916e383ebbc2b81bf712179b0", "slug": "base-rate-neglect", "zh": "基准率忽视", "en": "Base Rate Neglect", "icon": null, "one": "在判断概率时过度关注个案信息（似然）而忽略总体基础概率（基准率），导致系统性误判。", "status": "complete", "rep": "partial", "repDetail": "现象在概率/百分比格式下稳健复现（自 Kahneman & Tversky 1973 起数十年），但在自然频率格式下大幅减弱甚至消失（Gigerenzer & Hoffrage 1995 的综述与实验）。因此「人普遍忽视基准率」这一强版本不成立；弱版本——特定表征格式下系统性低估先验——成立，且可预测在什么格式下失效。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "数学/统计", "决策科学"], "context": ["决策", "批判性思维", "学习/研究"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["base rate fallacy", "base-rate fallacy", "基准率谬误", "基础比率忽视", "基础比率谬误"], "claims": [{"kind": "boundary", "body": "正确算法是贝叶斯：后验 ∝ 似然 × 先验。忽略基准率等于把先验设成均匀分布——这不是「节省认知」，而是换了一个模型，且换错了。", "basis": "literature", "src": "Kahneman, D. & Tversky, A. (1973). On the psychology of prediction. Psychological Review, 80(4), 237–251."}, {"kind": "boundary", "body": "基准率必须与个案「同分布」才有意义：把不相关总体的比例当基准率，是另一种错误（错误参照类）。所以问题不只是「用不用基准率」，还有「用哪一个」。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "效应强烈依赖呈现格式：用自然频率（「1000 人中有 10 人患病」）而非概率（「1%」）呈现时，多数人能正确做贝叶斯推断，错误率大幅下降。", "basis": "literature", "src": "Gigerenzer, G. & Hoffrage, U. (1995). How to improve Bayesian reasoning without instruction: frequency formats. Psychological Review, 102(4), 684–704."}, {"kind": "boundary", "body": "所以「人不会用基准率」是格式依赖的，不是能力缺失。这条边界直接改变干预方式：改表示法比讲道理有效——把百分比换成人数，比提醒对方「别忘了基准率」管用得多。", "basis": "literature", "src": "Gigerenzer & Hoffrage (1995)"}, {"kind": "boundary", "body": "反方向的偏差同样存在：过度依赖先验、忽视新证据（保守主义），在「摸球」类实验里被反复观察到。所以人会同时犯两个方向的错，取决于任务结构。", "basis": "literature", "src": "Edwards, W. (1968). Conservatism in human information processing. In B. Kleinmuntz (Ed.), Formal Representation of Human Judgment. Wiley."}, {"kind": "boundary", "body": "低基准率 + 高假阳性率下，阳性结果的预测值可以很低——医学筛查的「阳性不等于患病」是算术结果，不是概率错觉。这一条把概念从「认知偏差」拉回到「贝叶斯计算」。", "basis": "literature", "src": "Gigerenzer, G., Gaissmaier, W., Kurz-Milcke, E., Schwartz, L. M. & Woloshin, S. (2007). Helping doctors and patients make sense of health statistics. Psychological Science in the Public Interest, 8(2), 53–96."}, {"kind": "misuse", "body": "把「我觉得这事概率很低」当基准率。那是印象，不是测量；基准率要来自可核对的总体数据。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "反过来只报基准率、无视个案证据（把先验当后验）。这与基准率忽视是对称的错误，在医学与风控里同样常见。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "在样本本身有偏时，把样本比例当基准率。此时基准率已被污染，先算清抽样机制再谈贝叶斯。", "basis": "definition", "src": ""}], "bibs": ["Kahneman, D. & Tversky, A. (1973). On the psychology of prediction. Psychological Review, 80(4), 237–251.", "Tversky, A. & Kahneman, D. (1974). Judgment under uncertainty: heuristics and biases. Science, 185(4157), 1124–1131.", "Gigerenzer, G. & Hoffrage, U. (1995). How to improve Bayesian reasoning without instruction: frequency formats. Psychological Review, 102(4), 684–704.", "Gigerenzer, G. et al. (2007). Helping doctors and patients make sense of health statistics. Psychological Science in the Public Interest, 8(2), 53–96.", "Edwards, W. (1968). Conservatism in human information processing. In B. Kleinmuntz (Ed.), Formal Representation of Human Judgment. Wiley."], "links": []}, {"id": "c75d4f41916e383ffac8b817897de4fde", "slug": "fundamental-attribution-error", "zh": "基本归因错误", "en": "Fundamental Attribution Error", "icon": null, "one": "解释他人行为时高估人格/动机等内在因素、低估情境因素的倾向。", "status": "complete", "rep": "partial", "repDetail": "在欧美样本中稳定出现；跨文化不稳定，部分东亚与南亚样本出现反向或消失。作为「普遍人类倾向」的表述不成立，作为「西方样本中的稳定倾向」成立。", "checked": "2026-11-19", "nature": ["偏见/认知偏差"], "domain": ["心理学", "决策科学"], "context": ["沟通与说服", "组织管理", "批判性思维"], "epistemic": ["经验/归纳（Empirical / Inductive）"], "aliases": ["FAE", "correspondence bias", "基本归因偏误", "对应偏差"], "claims": [{"kind": "boundary", "body": "跨文化不稳健：印度被试出现方向相反的模式（更重情境与社会角色）；中国被试在鱼类动画归因中未显示相应的人格偏向；此后在多个东亚样本中重复。", "basis": "literature", "src": "Miller, J. G. (1984). Culture and the development of everyday social explanation. JPSP, 46(5), 961–978；Morris, M. W.
