"黑天鹅", "黑天鹅效应", "黑天鹅逻辑"], "claims": [{"kind": "boundary", "body": "这个词有两层来源，别混。逻辑层来自休谟-穆勒-波普尔的归纳问题：「所有天鹅都是白的」不能被再多观察证实，却能被一只黑天鹅否证。词源层来自尤维纳利斯《讽刺诗》第六篇的「罕见的鸟，极像黑天鹅」，当时是「不可能存在之物」的代称；1697 年荷兰探险家 Willem de Vlamingh 在西澳天鹅河真见到黑天鹅，词义才转为「被认为不可能之事被推翻」。", "basis": "literature", "src": "Iuvenalis, Saturae VI；Mill, J. S. (1843). A System of Logic；Popper, K. (1959). The Logic of Scientific Discovery；Taleb, N. N. (2007). The Black Swan. Random House, p. xvii."}, {"kind": "boundary", "body": "Taleb 的定义是三属性合取，不是「罕见且严重」：① 是离群值，过去的证据无法有说服力地指向它可能发生；② 影响极端；③ 事后可解释性——人性会为它编出理由，使它看起来本可预见。缺第①条就只是尾部事件，缺第③条就只是灾难。", "basis": "literature", "src": "Taleb, N. N. (2007). The Black Swan: The Impact of the Highly Improbable. Random House, Prologue."}, {"kind": "boundary", "body": "它是认识论范畴，不是概率类别。按定义，未知的未知无法事先枚举，因此不存在「黑天鹅的概率分布」这种东西。任何给出「黑天鹅年概率 x%」的模型，都已经把它降格成已知风险的尾部。", "basis": "definition", "src": ""}, {"kind": "boundary", "body": "「事后可解释」这条使它在严格意义上不可检验：任何事件发生后都能被追认为黑天鹅，任何没发生的也都能说「幸好不是」。这是它作为科学概念的主要弱点，Taleb 本人也承认黑天鹅是「观察者眼中的」，并明确反对给出对所有观察者不变的定义。", "basis": "literature", "src": "Taleb (2007), Prologue；Aven, T. (2013). On the meaning of a black swan in a risk context. Safety Science, 57, 44–51."}, {"kind": "boundary", "body": "统计学界有直接反对意见。Dennis Lindley 在书评里写道「Taleb talks nonsense」，并用独立同分布试验说明：即使每次观察到白天鹅的概率接近 1，只要看得足够多，出现一次黑天鹅几乎必然——概率演算足以处理这类不确定性，不需要另立范畴。", "basis": "literature", "src": "Lindley, D. (2008). Book review of The Black Swan. 转引自 Aven, T. (2013). On the meaning of a black swan in a risk context. Safety Science, 57, 44–51."}, {"kind": "boundary", "body": "它真正可操作的推论是「别把资源押在预测上，改去改造脆弱性」：既然无法预测，就降低对特定情景的依赖、保留冗余、让下行有界。这是决策姿态，不是预测技术。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "把任何「罕见的大坏事」都叫黑天鹅。金融危机、疫情、地震多数是可建模的尾部事件（灰天鹅/白天鹅），把它们叫黑天鹅会掩盖真正的准备不足。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "用它当免责声明：「这是黑天鹅，谁都没想到」。第③条属性说的正是这种事后叙事，把它当理由是把自己的失误归因给世界。", "basis": "definition", "src": ""}, {"kind": "misuse", "body": "声称能预测黑天鹅。按定义它不可预测；能预测的都不是黑天鹅。声称「识别下一个黑天鹅」的人，通常在做的是尾部风险情景分析。", "basis": "definition", "src": ""}], "bibs": ["Taleb, N. N. (2007). The Black Swan: The Impact of the Highly Improbable. Random House.", "Taleb, N. N. (2001). Fooled by Randomness. Random House.", "Mill, J. S. (1843). A System of Logic.", "Popper, K. (1959). The Logic of Scientific Discovery.", "Aven, T. (2013). On the meaning of a black swan in a risk context. Safety Science, 57, 44–51.", "Lindley, D. (2008). Book review of The Black Swan."], "links": []}], "meta": {"built": "2026-11-20 11:02", "facts": {"yes": 23, "partial": 33, "no": 1, "n/a": 17}, "counts": {"concepts": 74, "aliases": 345, "claims": 634, "bibs": 367}, "nature": {"基础概念/定义": 17, "悖论/二律背反": 3, "效应/现象": 14, "模型/框架/启发式": 17, "规律/经验法则": 7, "偏见/认知偏差": 19}, "domain": {"数学/统计": 16, "决策科学": 62, "哲学": 7, "心理学": 31, "社会学": 8, "经济学": 29, "博弈论": 4, "管理学": 12}, "context": {"学习/研究": 19, "批判性思维": 34, "决策": 60, "风险管理": 27, "产品/增长": 23, "沟通与说服": 15, "组织管理": 30}, "epistemic": {"形式/分析（Formal / Analytic）": 10, "经验/归纳（Empirical / Inductive）": 37, "构建/建模（Constructed / Model-based）": 21, "现象描述/命名（Phenomenological / Descriptive）": 4}}};
const CS=DATA.concepts, M=DATA.meta;

const REPN={yes:"已复现",partial:"部分成立",no:"未复现","n/a":"无效应可谈"};
let F={nature:new Set(),domain:new Set(),context:new Set(),epistemic:new Set(),rep:new Set()};
let Q="",SEL=null,GRP="nature";

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=s=>String(s).replace(/（[^）]*）/g,"").trim();
const CMP=(a,b)=>a.zh.localeCompare(b.zh,"zh-Hans-CN");
function hl(s){
  const t=esc(s); if(!Q.trim())return t;
  const toks=Q.trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(x=>x);
  if(!toks.length)return t;
  return t.replace(new RegExp("("+toks.join("|")+")","gi"),"<mark>$1</mark>");
}
function hay(c){
  if(!c._h){
    c._h=[c.zh,c.en,c.one,...c.aliases,...c.claims.map(x=>x.body),...c.bibs].join(" ").toLowerCase();
  }
  return c._h;
}
function pass(c,skip){
  for(const [k] of FKEY){
    if(k===skip)continue;
    const sel=F[k]; if(!sel.size)continue;
    if(k==="rep"){ if(!sel.has(c.rep||"n/a"))return false; }
    else if(!c[k].some(v=>sel.has(v)))return false;
  }
  if(Q.trim()){
    const toks=Q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const h=hay(c);
    if(!toks.every(t=>h.includes(t)))return false;
  }
  return true;
}
function facetVals(k){
  if(k==="rep")return Object.keys(REPN).map(x=>[x,REPN[x]]);
  const s=new Set(); CS.forEach(c=>c[k].forEach(v=>s.add(v)));
  return [...s].sort((a,b)=>(M[k][b]||0)-(M[k][a]||0)).map(x=>[x,x]);
}
function renderFacets(){

    h+=`<div class="fgroup"><div class="fgh"><span>${label}</span></div>`;
    for(const [v,txt] of vals){
      const n=CS.filter(c=>{const bg=F[k];const tmp=new Set(bg);F[k]=new Set([v]);const ok=pass(c);F[k]=tmp;return ok;}).length;
      h+=`<div class="fitem${F[k].has(v)?" on":""}${n?"":" zero"}" data-k="${k}" data-v="${esc(v)}" title="${esc(txt)}">
        <span>${esc(short(txt))}</span><span class="n">${n}</span></div>`;

    h+=`</div>`;

  document.querySelectorAll(".fitem").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k,v=el.dataset.v;

    render();
  });
}
function itemHTML(c){

  const rep=c.rep?`<span class="dot" style="background:var(--${col})"></span>`:"";

  const box=document.getElementById("list");
  if(!rows.length){box.innerHTML=`<div class="empty">没有匹配。</div>`;return rows;}
  let h="";
  if(GRP==="none"){

  }else{
    const order = GRP==="rep"
      ? ["yes","partial","no","n/a"]
      : [...new Set(CS.flatMap(c=>c[GRP]))].sort((a,b)=>(M[GRP][b]||0)-(M[GRP][a]||0));
    for(const g of order){
      const sub = GRP==="rep"
        ? rows.filter(c=>(c.rep||"n/a")===g)
        : rows.filter(c=>c[GRP].includes(g));
      if(!sub.length)continue;

      h+=sub.map(itemHTML).join("");

  box.innerHTML=h;

  return rows;
}

  if(bd.length)h+=`<h2>边界 · ${bd.length}</h2>`+bd.map(x=>claim(x)).join("");
  if(ms.length)h+=`<h2>常见误用 · ${ms.length}</h2>`+ms.map(x=>claim(x)).join("");
  if(c.bibs.length)h+=`<h2>文献 · ${c.bibs.length}</h2><ol class="bib">${c.bibs.map(b=>`<li>${esc(b)}</li>`).join("")}</ol>`;
  if(c.links.length)h+=`<h2>相关 · ${c.links.length}</h2><div class="rel">${c.links.map(l=>`<a href="#${l.id}" data-id="${l.id}">${esc(l.zh)}</a>`).join("")}</div>`;
  h+=`<div class="foot">复现核对${c.checked?"于 "+c.checked:""} · 条目 ${esc(c.id.slice(0,8))}</div>`;
  document.getElementById("detail").innerHTML=h;
  document.getElementById("detail").scrollTop=0;
  document.querySelectorAll(".rel a").forEach(a=>a.onclick=e=>{e.preventDefault();select(a.dataset.id);});
}
function claim(x){
  return `<div class="claim"><div class="basis${x.basis==="literature"?" lit":""}">${x.basis==="literature"?"文献":"定义"}</div>
    <div class="bd">${esc(x.body)}${x.src?`<span class="src">${esc(x.src)}</span>`:""}</div></div>`;
}
function render(){
  document.getElementById("stat").textContent=
    `${M.counts.concepts} 条 · ${M.counts.aliases} 别名 · ${M.counts.claims} 断言 · ${M.counts.bibs} 文献`;
  document.getElementById("built").textContent="内容截至 "+M.built.slice(5);
  renderFacets(); renderList(); renderDetail();
}
document.getElementById("q").oninput=e=>{Q=e.target.value;SEL=null;render();};
document.getElementById("clr").onclick=()=>{
  F={nature:new Set(),domain:new Set(),context:new Set(),epistemic:new Set(),rep:new Set()};
  Q="";document.getElementById("q").value="";SEL=null;location.hash="";render();
};
document.getElementById("rnd").onclick=()=>{
  const rows=CS.filter(c=>pass(c)); if(!rows.length)return;
  select(rows[Math.floor(Math.random()*rows.length)].id);
};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==document.getElementById("q")){
    e.preventDefault();document.getElementById("q").focus();return;
  }
  if(e.key==="Escape"){
    const q=document.getElementById("q");
    if(document.activeElement===q){q.value="";Q="";render();q.blur();}
    else if(SEL){SEL=null;location.hash="";document.body.classList.remove("detail");render();}
  }
  if((e.key==="ArrowDown"||e.key==="ArrowUp")&&document.activeElement!==document.getElementById("q")){
    const rows=CS.filter(c=>pass(c)); if(!rows.length)return;
    e.preventDefault();
    let i=rows.findIndex(c=>c.id===SEL);
    i=e.key==="ArrowDown"?Math.min(i+1,rows.length-1):Math.max(i-1,0);
    select(rows[i].id);
  }
});
document.getElementById("grp").onchange=e=>{GRP=e.target.value;renderList();};
if(location.hash){const id=decodeURIComponent(location.hash.slice(1));if(CS.some(c=>c.id===id))SEL=id;}
render();
if(!SEL&&window.innerWidth>1080){
  const first=CS.filter(c=>pass(c)).sort(CMP)[0];
  if(first)select(first.id,true);
}
</script>
</body>
</html>
